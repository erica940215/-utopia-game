<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a111d">
<style>body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}img{max-width:100%}</style>
<title>烏托邦</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
/* Layout: full-bleed 3D canvas; HUD pinned to the four corners; one committed night-frost world (ember = warmth, ice = cold) */
:root{
  --night:#0a111d;
  --frost:#d6ebf5;
  --frost-dim:#8aa4b6;
  --ice:#7cc8e8;
  --ember:#ff9a3c;
  --danger:#ff5d5d;
  --panel:rgba(9,16,28,.66);
  --line:rgba(160,205,230,.22);
  --font-ui:"Noto Sans TC",system-ui,sans-serif;
  --font-num:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--frost);font-family:var(--font-ui);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.lbl{font-size:11px;letter-spacing:.14em;color:var(--frost-dim)}

#hud{position:fixed;inset:0;pointer-events:none}
.corner{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.tl{top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));width:min(210px,42vw)}
.tr{top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));min-width:130px}
.tc{top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.bar{height:8px;background:rgba(124,200,232,.15);border-radius:4px;overflow:hidden;margin:5px 0 3px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ice),var(--ember));transition:width .2s linear}
#tempTxt{font-size:26px;font-weight:700;line-height:1}
#tempTxt.cold{color:var(--ice)}
#tempTxt.crit{color:var(--danger)}
#heatTag{font-size:11px;color:var(--ember);margin-top:2px}
.row{display:flex;justify-content:space-between;gap:14px;font-size:13px;line-height:1.55}
.row b{font-family:var(--font-num);font-size:16px;font-weight:700}
.sep{height:1px;background:var(--line);margin:5px 0}
#arrow{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:14px solid var(--ember);transition:transform .08s linear}
#trainDist{font-size:15px}
#storm{font-size:13px}
#storm.warn{color:var(--danger);font-weight:700}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--frost);box-shadow:0 0 0 2px rgba(0,0,0,.35)}
#ammo{position:absolute;left:50%;top:50%;transform:translate(14px,10px);font-size:13px;color:var(--ember);white-space:nowrap}
#prompt{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 14px;font-size:14px;white-space:nowrap}
#prog{display:block;height:3px;background:var(--ice);width:0;margin-top:5px;border-radius:2px}
#toast{position:fixed;pointer-events:none;z-index:5;width:max-content;max-width:calc(100vw - 32px);left:50%;top:32%;transform:translateX(-50%);font-size:15px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.8);text-align:center;transition:opacity .4s}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(150,215,255,.55) 100%);opacity:0;transition:opacity .3s}
#hurt{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(120,0,40,.5) 100%);opacity:0;transition:opacity .15s}

#touch{position:fixed;inset:0;pointer-events:none}
#stick{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:120px;height:120px;border-radius:50%;border:1px solid var(--line);background:rgba(9,16,28,.35);pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(214,235,245,.28)}
.tbtn{position:absolute;pointer-events:auto;border-radius:50%;border:1px solid var(--line);background:rgba(9,16,28,.55);color:var(--frost);font:700 13px var(--font-ui);display:grid;place-items:center}
.tbtn:active,.tbtn.on{background:rgba(255,154,60,.35)}
#btnFire{right:max(24px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:78px;height:78px}
#btnAct{right:calc(max(24px,env(safe-area-inset-right,0px)) + 92px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:66px;height:66px}
#btnRun{right:calc(max(24px,env(safe-area-inset-right,0px)) + 6px);bottom:calc(env(safe-area-inset-bottom,0px) + 132px);width:56px;height:56px;font-size:12px}

#screen{position:fixed;inset:0;display:grid;place-items:center;background:rgba(6,11,20,.82);overflow-y:auto;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{max-width:460px;width:100%;display:flex;flex-direction:column;gap:14px}
.card h1{font-family:var(--font-ui);font-weight:900;font-size:40px;letter-spacing:.08em;margin:0;line-height:1.1;text-wrap:balance}
.card h1 small{display:block;font-family:var(--font-num);font-size:14px;letter-spacing:.3em;color:var(--ice);font-weight:500;margin-bottom:6px}
.card h2{margin:0;font-size:24px;text-wrap:balance}
.card p{margin:0;line-height:1.7;color:var(--frost-dim);font-size:14px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;border-top:1px solid var(--line);padding-top:12px}
.keys kbd{font-family:var(--font-num);font-size:13px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--frost);white-space:nowrap}
.btn{appearance:none;border:0;border-radius:6px;background:var(--ember);color:#1a0d02;font:900 16px var(--font-ui);padding:13px 18px;cursor:pointer;letter-spacing:.1em}
.btn:focus-visible{outline:2px solid var(--frost);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--frost);border:1px solid var(--line)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1}
.ledger{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ledger div{border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center}
.ledger b{display:block;font-family:var(--font-num);font-size:26px;color:var(--frost)}
.ledger span{font-size:12px;color:var(--frost-dim)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:13px;border:1px solid rgba(255,154,60,.45);color:var(--ember);border-radius:999px;padding:2px 10px}
@media (prefers-reduced-motion:reduce){.bar i,#arrow,#toast,#vignette{transition:none}}
/* 營地（hub）與圖鑑 */
.hub{max-width:620px;width:100%;display:flex;flex-direction:column;gap:16px}
.hub-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hub-head h1{font-weight:900;font-size:34px;letter-spacing:.08em;margin:0;line-height:1.1}
.hub-head h1 small{display:block;font-family:var(--font-num);font-size:13px;letter-spacing:.3em;color:var(--ice);font-weight:500;margin-bottom:6px}
.savechip{font-size:12px;color:var(--frost-dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.savechip.cloud{color:var(--ice);border-color:rgba(124,200,232,.45)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;letter-spacing:.12em;color:var(--frost-dim)}
.sec-title b{font-family:var(--font-num);font-size:15px;color:var(--frost);letter-spacing:.04em}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.dex div{border:1px solid var(--line);border-left:3px solid var(--rc,var(--line));border-radius:6px;padding:7px 8px;min-width:0}
.dex b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dex span{font-size:11px;color:var(--frost-dim)}
.dex .unk b{color:var(--frost-dim);letter-spacing:.2em}
.dex .unk{opacity:.6}
.soon{font-size:13px;color:var(--frost-dim);border:1px dashed var(--line);border-radius:6px;padding:10px 12px;line-height:1.6}
.loading{font-size:14px;color:var(--frost-dim);letter-spacing:.1em}

/* 手機橫向：高度很矮時壓縮 HUD 與按鈕 */
@media (orientation:landscape) and (max-height:520px){
  .corner{padding:5px 8px}
  .tl{width:min(170px,26vw)}
  #tempTxt{font-size:20px}
  .row{font-size:12px;line-height:1.35}
  .row b{font-size:14px}
  .lbl{font-size:10px}
  #prompt{bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
  #stick{width:104px;height:104px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
  #btnFire{bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
  #btnAct{bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
  #btnRun{bottom:calc(env(safe-area-inset-bottom,0px) + 110px)}
  #toast{top:24%}
}
#rotateHint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 170px);transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:13px;color:var(--ice);white-space:nowrap;pointer-events:none}
@media (orientation:landscape){#rotateHint{display:none}}
.auth{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.auth input{flex:1;min-width:0;background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--frost);font:14px var(--font-ui);padding:10px 12px}
.auth input:focus-visible{outline:2px solid var(--ice);outline-offset:1px}
.auth .btn{padding:10px 14px;font-size:14px}
.auth-note{font-size:12px;color:var(--frost-dim)}

/* 園區介面 */
#touch.walk #btnAct,#touch.walk #btnFire{display:none}
#zooUI{position:fixed;inset:0;pointer-events:none}
#zooUI button{pointer-events:auto;cursor:pointer}
.ztop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.zres{display:flex;flex-wrap:wrap;gap:6px}
.zres span{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 9px;display:flex;align-items:baseline;gap:6px;font-size:12px}
.zres i{font-style:normal;color:var(--frost-dim)}
.zres b{font-size:17px;font-weight:700}
.zres .warnchip{color:var(--danger);font-weight:700}
.zacts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.zpool{font-size:13px;color:var(--ember)}
.zbtn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--frost);font:700 13px var(--font-ui);border-radius:6px;padding:8px 12px}
.zbtn.go{background:var(--ember);color:#1a0d02;border-color:transparent}
.zbtn:focus-visible,.ztool:focus-visible,.zmini:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.ztools{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:6px;overflow-x:auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:auto;scrollbar-width:none}
.ztool{flex:0 0 auto;appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--frost);border-radius:6px;padding:7px 11px;text-align:left;display:flex;flex-direction:column;gap:1px;font-family:var(--font-ui)}
.ztool b{font-size:13px}
.ztool span{font-size:11px;color:var(--frost-dim);white-space:nowrap}
.ztool.on{border-color:var(--ember);box-shadow:inset 0 0 0 1px var(--ember)}
.ztool.poor span{color:var(--danger)}
.zpanel{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 70px);width:min(340px,calc(100vw - 24px));max-height:55vh;overflow-y:auto;background:rgba(9,16,28,.9);border:1px solid var(--line);border-radius:8px;padding:12px;pointer-events:auto;display:flex;flex-direction:column;gap:10px}
.zp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.zp-head b{display:block;font-size:16px}
.zp-head span{font-size:12px;color:var(--frost-dim)}
.zpanel em{font-style:normal;color:var(--danger)}
.zclose{appearance:none;background:transparent;border:1px solid var(--line);color:var(--frost);border-radius:6px;width:30px;height:30px}
.zp-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;border-top:1px solid var(--line);padding-top:8px}
.zp-name{min-width:0}
.zp-name b{font-size:14px}
.zp-name span{display:block;font-size:11px;color:var(--frost-dim)}
.zp-bars{grid-column:1;display:flex;gap:10px}
.zp-bars label{flex:1;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--frost-dim)}
.zbar{flex:1;height:5px;background:rgba(124,200,232,.15);border-radius:3px;overflow:hidden}
.zbar i{display:block;height:100%;background:var(--ice)}
.zbar.low i{background:var(--danger)}
.zp-row .zmini{grid-column:2;grid-row:1 / span 2;align-self:center}
.zmini{appearance:none;border:1px solid var(--line);background:transparent;color:var(--frost);font:700 12px var(--font-ui);border-radius:6px;padding:6px 10px}
.zmini.add{border-color:rgba(255,154,60,.5);color:var(--ember)}
.zp-add{display:flex;flex-wrap:wrap;gap:6px}
.zp-empty{font-size:12px;color:var(--frost-dim);margin:0}
#zWalkExit{margin-left:auto}
@media (orientation:landscape) and (max-height:520px){.zpanel{max-height:62vh;bottom:calc(env(safe-area-inset-bottom,0px) + 60px)}.zres b{font-size:15px}}
</style></head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div class="corner tl">
    <div class="lbl">體溫</div>
    <div id="tempTxt" class="num">36.8°C</div>
    <div class="bar"><i id="tempFill"></i></div>
    <div id="heatTag" hidden>◆ 鍋爐熱區・回溫中</div>
  </div>
  <div class="corner tc">
    <div id="arrow"></div>
    <div id="trainDist" class="num">火車 0 m</div>
    <div id="storm" class="num">暴風雪 5:00</div>
  </div>
  <div class="corner tr">
    <div class="lbl">背包 <span id="bagCap" class="num">0/12</span></div>
    <div id="bagRows"></div>
    <div class="row"><span>跟隨生物</span><b id="bFol">0/2</b></div>
    <div class="sep"></div>
    <div class="lbl">已存入車廂</div>
    <div class="row"><span>物資</span><b id="sRes">0</b></div>
    <div class="row"><span>救援生物</span><b id="sAni">0</b></div>
  </div>
  <div id="cross"></div>
  <div id="ammo" class="num"></div>
  <div id="prompt" hidden><span id="promptTxt"></span><i id="prog"></i></div>
  <div id="vignette"></div>
  <div id="hurt"></div>
</div>

<div id="touch" hidden>
  <div id="stick"><div id="knob"></div></div>
  <button id="btnRun" class="tbtn" type="button">奔跑</button>
  <button id="btnAct" class="tbtn" type="button">互動</button>
  <button id="btnFire" class="tbtn" type="button">開火</button>
</div>

<div id="rotateHint" hidden>把手機轉成橫向，視野更大</div>
<div id="zooUI" hidden>
  <div class="ztop">
    <div class="zres" id="zRes"></div>
    <div class="zacts" id="zMain">
      <span class="zpool num" id="zPool"></span>
      <button type="button" class="zbtn" id="zWalk">逛園</button>
      <button type="button" class="zbtn" id="zDex">圖鑑・倉庫</button>
      <button type="button" class="zbtn go" id="zGo">出發遠征</button>
    </div>
    <button type="button" class="zbtn" id="zWalkExit" hidden>回到俯視</button>
  </div>
  <div class="zpanel" id="zPanel" hidden></div>
  <div class="ztools" id="zTools"></div>
</div>
<div id="toast"></div>
<div id="screen"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const isTouch = matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);
const screenEl = $('screen');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* =========================================================
   1. 載入設定表（data/*.json）——遊戲內容全部從這裡來
   ========================================================= */
const DATA = {};
async function loadData(){
  const names = ['config','species','items','equipment','stations','buildings'];
  const res = await Promise.all(names.map(n => fetch(`data/${n}.json`).then(r => { if(!r.ok) throw new Error(n); return r.json(); })));
  names.forEach((n,i) => DATA[n] = res[i]);
  DATA.speciesById = Object.fromEntries(DATA.species.map(s => [s.id, s]));
  DATA.itemsById = Object.fromEntries(DATA.items.map(s => [s.id, s]));
  DATA.equipById = Object.fromEntries(DATA.equipment.map(s => [s.id, s]));
  DATA.stationById = Object.fromEntries(DATA.stations.map(s => [s.id, s]));
  DATA.buildingById = Object.fromEntries(DATA.buildings.map(s => [s.id, s]));
}

/* =========================================================
   2. 存檔層：雲端（artifact db）優先，失敗時改用本機
   之後搬到自己的網域時，只要換掉 CloudStore 為 Supabase 版本
   ========================================================= */
const SAVE_VERSION = 1;
function emptySave(){ return { version:SAVE_VERSION, runs:0, resources:{}, collection:{}, updatedAt:null }; }
const LocalStore = {
  mode:'local',
  async load(){ try{ const t = localStorage.getItem('utopia-save'); return t ? JSON.parse(t) : null; }catch(e){ return null; } },
  async save(d){ try{ localStorage.setItem('utopia-save', JSON.stringify(d)); return true; }catch(e){ return false; } }
};
function waitForClaude(ms){
  return new Promise(res => {
    const t0 = Date.now();
    (function poll(){ if(window.claude && window.claude.use) return res(window.claude); if(Date.now()-t0>ms) return res(null); setTimeout(poll, 100); })();
  });
}
async function makeCloudStore(){
  const c = await waitForClaude(1500);
  if(!c) return null;
  const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]);
  const db = await withTimeout(c.use('db'), 10000);
  const user = await withTimeout(c.use('user'), 10000);
  if(!db || !user) return null;
  const uid = await user.id();
  if(!uid) return null;
  const ref = db.collection('data/users/' + uid).doc('save');
  return {
    mode:'cloud',
    async load(){ const s = await ref.get(); return s.exists ? s.data() : null; },
    async save(d){ await ref.set(d); return true; }
  };
}
let store = LocalStore, save = emptySave(), saving = Promise.resolve();
const SB_URL='https://pujvupwghochfklrgvtq.supabase.co', SB_KEY='sb_publishable_jHEGIwFLfpGOriA-ijixGg_dytbHXQH';
const onOwnSite=/github\.io$|^localhost$|^127\./.test(location.hostname);
const sb=(onOwnSite&&window.supabase&&window.supabase.createClient)?window.supabase.createClient(SB_URL,SB_KEY):null;
let sbUser=null;
function makeSupabaseStore(u){
  return {
    mode:'cloud',
    async load(){ const {data,error}=await sb.from('saves').select('data').eq('user_id',u.id).maybeSingle(); if(error) throw error; return data?data.data:null; },
    async save(d){ const {error}=await sb.from('saves').upsert({user_id:u.id,data:d,updated_at:new Date().toISOString()}); if(error) throw error; return true; }
  };
}
async function initSave(){
  const local=await LocalStore.load();
  if(local&&local.version) save=Object.assign(emptySave(),local);
  if(sb){
    try{
      const {data}=await sb.auth.getSession();
      sbUser=data.session?data.session.user:null;
      if(sbUser){
        store=makeSupabaseStore(sbUser);
        const cloud=await store.load();
        if(cloud&&cloud.version) save=Object.assign(emptySave(),cloud);
        else if(local&&local.version) await store.save(save); // 第一次登入：把本機進度帶上雲端
      }
    }catch(e){ store=LocalStore; }
    return;
  }
  try{ const cloud=await makeCloudStore(); if(cloud){ store=cloud; const d=await store.load(); if(d&&d.version) save=Object.assign(emptySave(),d); } }catch(e){ store=LocalStore; }
}
function persist(){
  save.updatedAt = new Date().toISOString();
  const snapshot = JSON.parse(JSON.stringify(save));
  LocalStore.save(snapshot);
  saving = saving.then(() => store.save(snapshot)).catch(() => { store = LocalStore; return LocalStore.save(snapshot); });
  return saving;
}

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const R=(a,b)=>a+rng()*(b-a);
const RI=(a,b)=>Math.floor(R(a,b+1));
function pickWeighted(list, w){ const tot=list.reduce((s,x)=>s+w(x),0); let r=rng()*tot; for(const x of list){ r-=w(x); if(r<=0) return x; } return list[list.length-1]; }
const markerLoot=new THREE.MeshBasicMaterial({color:0xff9a3c});

function addMarker(g,mat,y){ const m=new THREE.Mesh(new THREE.OctahedronGeometry(0.18),mat); m.position.y=y; m.userData.spin=true; g.add(m); return m; }

function buildStation(stationId, seed){
  const st=DATA.stationById[stationId];
  if(world) scene.remove(world);
  world=new THREE.Group(); scene.add(world);
  colliders.length=1; interactables=[]; wraiths=[]; flares=[]; followers=[];
  rng=mulberry32(seed);
  const wallMat=M(0x5b6068), woodMat=M(0x4a3a30), snowCap=M(0xf2f6fa);
  const ruins=[]; let tries=0;
  while(ruins.length<st.ruins && tries++<400){
    const a=R(0,Math.PI*2), r=R(26,135), x=Math.cos(a)*r, z=Math.sin(a)*r;
    if(!farFromTrain(x,z,4) || ruins.some(o=>Math.hypot(o.x-x,o.z-z)<18)) continue;
    ruins.push({x,z});
  }
  for(const o of ruins){
    const y=heightAt(o.x,o.z), hgt=R(2.2,4.2), sz=R(5,7), skip=Math.floor(R(0,4)), mat=rng()<0.5?wallMat:woodMat;
    [{w:sz,d:0.4,x:0,z:-sz/2},{w:sz,d:0.4,x:0,z:sz/2},{w:0.4,d:sz,x:-sz/2,z:0},{w:0.4,d:sz,x:sz/2,z:0}].forEach((wl,i)=>{
      if(i===skip) return;
      const hh=hgt*R(0.5,1), m=box(wl.w,hh,wl.d,mat); m.position.set(o.x+wl.x,y+hh/2-0.3,o.z+wl.z); world.add(m);
      const cap=box(wl.w+0.1,0.15,wl.d+0.1,snowCap); cap.position.set(m.position.x,y+hh-0.25,m.position.z); world.add(cap);
      colliders.push({x0:m.position.x-wl.w/2,x1:m.position.x+wl.w/2,z0:m.position.z-wl.d/2,z1:m.position.z+wl.d/2});
    });
    const n=RI(st.cratesPerRuin[0],st.cratesPerRuin[1]);
    for(let k=0;k<n;k++) addCrate(o.x+R(-1.6,1.6),o.z+R(-1.6,1.6));
  }
  for(let i=0;i<st.looseCrates;i++){ const a=R(0,Math.PI*2), r=R(18,110), x=Math.cos(a)*r, z=Math.sin(a)*r; if(farFromTrain(x,z,2)) addCrate(x,z); }
  const trunk=M(0x2b2420), pine=M(0x23362f);
  for(let i=0;i<st.trees;i++){
    const a=R(0,Math.PI*2), r=R(15,190), x=Math.cos(a)*r, z=Math.sin(a)*r;
    if(!farFromTrain(x,z,1)) continue;
    const y=heightAt(x,z);
    if(rng()<0.65){
      const g=new THREE.Group(), h=R(3,6);
      const t=cyl(0.15,0.25,h,trunk,6); t.position.y=h/2; g.add(t);
      if(rng()<0.6){ const c=new THREE.Mesh(new THREE.ConeGeometry(R(1,1.6),h*0.8,7),pine); c.position.y=h*0.75; g.add(c); const s=new THREE.Mesh(new THREE.ConeGeometry(0.7,0.8,7),snowCap); s.position.y=h*1.1; g.add(s); }
      g.position.set(x,y-0.2,z); world.add(g); colliders.push({x0:x-0.3,x1:x+0.3,z0:z-0.3,z1:z+0.3});
    } else {
      const s=R(0.6,1.8), rk=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),M(0x6a7078)); rk.position.set(x,y+s*0.3,z); rk.rotation.set(R(0,3),R(0,3),0); world.add(rk);
      colliders.push({x0:x-s*0.8,x1:x+s*0.8,z0:z-s*0.8,z1:z+s*0.8});
    }
  }
  // 物種：只從 spawn 含此站點、且有模型的物種中抽，稀有度決定權重與最短距離
  const pool=DATA.species.filter(s=>s.spawn.includes(stationId) && s.model && MODELS[s.model]);
  let placed=0; tries=0;
  while(pool.length && placed<st.animals && tries++<400){
    const sp=pickWeighted(pool, s=>DATA.config.rarity[s.rarity].weight);
    const minD=DATA.config.rarity[sp.rarity].minDist;
    const a=R(0,Math.PI*2), r=R(minD,Math.max(minD+20,130)), x=Math.cos(a)*r, z=Math.sin(a)*r;
    if(!farFromTrain(x,z,6)) continue;
    if(interactables.some(it=>it.type==='ice'&&Math.hypot(it.pos.x-x,it.pos.z-z)<25)) continue;
    placeIce(sp, x, z, R(0,6.28));
    placed++;
  }
}
function placeIce(sp,x,z,rot){
  const y=heightAt(x,z), g=new THREE.Group(); g.position.set(x,y,z);
  const an=makeModel(sp.model); an.rotation.y=rot; g.add(an);
  const ice=box(1.5,1.5,1.5,iceMat); ice.position.y=0.65; ice.rotation.y=rot*0.3; g.add(ice);
  const mk=addMarker(g,new THREE.MeshBasicMaterial({color:hex(DATA.config.rarity[sp.rarity].color)}),2.2);
  world.add(g);
  const it={type:'ice',pos:new THREE.Vector3(x,y,z),group:g,animal:an,ice,marker:mk,species:sp,thaw:0};
  interactables.push(it); return it;
}
function addCrate(x,z){
  const item=pickWeighted(DATA.items, i=>i.lootWeight);
  const y=heightAt(x,z), g=new THREE.Group(); g.position.set(x,y,z); g.rotation.y=R(0,3);
  const c=box(0.9,0.6,0.6,hex(item.color)); c.position.y=0.3; g.add(c);
  const band=box(0.94,0.08,0.64,0x9a7a3a); band.position.y=0.45; g.add(band);
  const mk=addMarker(g,markerLoot,1.3); world.add(g);
  interactables.push({type:'crate',item,amount:RI(item.amount[0],item.amount[1]),pos:new THREE.Vector3(x,y,z),group:g,marker:mk});
}

function nearest(){
  let best=null,bd=3.2;
  for(const it of interactables){ if(it.done) continue; const d=Math.hypot(it.pos.x-player.pos.x,it.pos.z-player.pos.z); if(d<bd){bd=d;best=it;} }
  if(Math.hypot(DEPART.x-player.pos.x,DEPART.z-player.pos.z)<3.4) best={type:'depart'};
  return best;
}
let lastTarget=null;
function interact(dt){
  const it=nearest(), pr=$('prompt'), pt=$('promptTxt'), pg=$('prog'), key=isTouch?'互動':'E';
  if(it!==lastTarget && lastTarget && lastTarget.type==='ice' && !lastTarget.done){ lastTarget.thaw=0; lastTarget.ice.scale.setScalar(1); }
  lastTarget=it;
  if(!it){ pr.hidden=true; actPressed=false; return; }
  pr.hidden=false; pg.style.width='0';
  if(it.type==='crate'){
    const full=bagCount()>=CFG().bagCapacity;
    pt.textContent=full?'背包已滿，先回火車存放':`[${key}] 搜刮${it.item.name}箱`;
    if(actPressed&&!full){
      const take=Math.min(it.amount,CFG().bagCapacity-bagCount());
      bag[it.item.id]+=take; it.amount-=take; toast(`取得 ${it.item.name} ×${take}`);
      if(it.amount<=0){ it.done=true; world.remove(it.group); }
    }
  } else if(it.type==='ice'){
    const sp=it.species, rar=DATA.config.rarity[sp.rarity];
    if(followers.length>=CFG().followCapacity) pt.textContent=`同時最多帶 ${CFG().followCapacity} 隻，先送回火車`;
    else{
      const known=save.collection[sp.id]?'':'・新物種';
      pt.textContent=`長按 [${key}] 融冰救援 ${sp.name}（${rar.name}${known}）`;
      if(actHeld){ it.thaw+=dt/1.8; it.ice.scale.setScalar(Math.max(0.05,1-it.thaw*0.9)); }
      else if(it.thaw>0){ it.thaw=Math.max(0,it.thaw-dt); it.ice.scale.setScalar(1-it.thaw*0.9); }
      pg.style.width=Math.min(100,it.thaw*100)+'%';
      if(it.thaw>=1){
        it.done=true; it.group.remove(it.ice); it.group.remove(it.marker);
        const an=it.animal; it.group.remove(an); an.position.copy(it.pos); world.add(an);
        followers.push({mesh:an,species:sp,origin:it.pos.clone(),rot:an.rotation.y,hop:Math.random()*6});

}

function collapse(){
  const D=DATA.config.death, T=TMP();
  // 隨機掉落一部分背包物品
  const units=[]; for(const k in bag) for(let i=0;i<bag[k];i++) units.push(k);
  const dropN=Math.round(units.length*D.dropFraction);
  for(let i=0;i<dropN;i++){ const j=Math.floor(Math.random()*units.length); bag[units[j]]--; units.splice(j,1); }
  // 跟隨的生物跑回原地重新被冰封
  const lost=followers.length;
  for(const f of followers){ world.remove(f.mesh); if(D.followersReturnToIce) placeIce(f.species,f.origin.x,f.origin.z,f.rot); }
  followers=[]; collapses++;
  if(timeLeft<=0){ finish(true); return; }
  player.pos.set(4.5,0,8); player.temp=T.respawnTemp; timeLeft=Math.max(5,timeLeft-T.collapseTimePenalty);
  toast(`你失溫倒下，被列車員拖回來。掉了 ${dropN} 件物資${lost?`，${lost} 隻生物跑回原地`:''}`);
}

    const s=new THREE.Mesh(new THREE.ConeGeometry(0.7,0.8,7),snowCap); s.position.y=hh*1.1; g.add(s);

  }
  zooRoot=new THREE.Group(); zooScene.add(zooRoot);
  // 預覽框與選取框

  zSelBox=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshBasicMaterial({color:0xff9a3c,wireframe:true}));
  zSelBox.visible=false; zooScene.add(zSelBox);
}
let zGhost=null, zSelBox=null;

function makeBuildingMesh(b){
  const d=bdef(b.type), c=tileCenter(b), W=d.size[0]*TS(), D=d.size[1]*TS(), g=new THREE.Group();
  g.position.set(c.x,0,c.z); g.userData.uid=b.uid;
  if(d.kind==='path'){ const p=box(W,0.08,D,hex(d.color)); p.position.y=0.04; g.add(p); }
  else if(d.kind==='habitat'){
    const gr=box(W-0.2,0.1,D-0.2,hex(d.ground)); gr.position.y=0.05; g.add(gr);
    if(d.water){ const w=box(W-1.2,0.05,D-1.2,new THREE.MeshPhongMaterial({color:0x2a6f99,shininess:90,transparent:true,opacity:0.9})); w.position.y=0.11; g.add(w); }
    const fm=M(hex(d.fence)), fh=d.house?2.6:1.0;
    if(d.house){
      const glass=box(W-0.4,fh,D-0.4,new THREE.MeshPhongMaterial({color:0xcfe9f0,transparent:true,opacity:0.32,shininess:100,depthWrite:false})); glass.position.y=fh/2+0.1; g.add(glass);
      for(const [sx,sz] of [[-1,-1],[1,-1],[-1,1],[1,1]]){ const p=box(0.15,fh,0.15,fm); p.position.set(sx*(W/2-0.2),fh/2+0.1,sz*(D/2-0.2)); g.add(p); }
    } else {
      for(const [w,dd,x,z] of [[W,0.12,0,-D/2+0.06],[W,0.12,0,D/2-0.06],[0.12,D,-W/2+0.06,0],[0.12,D,W/2-0.06,0]]){ const f=box(w,fh,dd,fm); f.position.set(x,fh/2,z); g.add(f); }
    }
  }
  else if(d.kind==='feeder'){ const f=box(1.1,0.9,1.1,hex(d.color)); f.position.y=0.45; g.add(f); const t=box(1.4,0.2,1.4,0x5a4434); t.position.y=0.95; g.add(t); }
  else if(d.kind==='heater'){
    const h=cyl(0.45,0.55,1.2,hex(d.color),10); h.position.y=0.6; g.add(h);
    const pipe=cyl(0.12,0.12,0.9,0x15181d,6); pipe.position.y=1.6; g.add(pipe);
    const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:DOT,color:0xff9a3c,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending})); glow.scale.set(3.4,3.4,1); glow.position.y=0.8; g.add(glow); g.userData.glow=glow;
  }
  else if(d.kind==='gate'){
    const pm=M(hex(d.color));
    for(const s of [-1,1]){ const p=box(0.6,3.4,0.6,pm); p.position.set(s*(W/2-0.3),1.7,0); g.add(p); }
    const beam=box(W,0.5,0.7,pm); beam.position.y=3.4; g.add(beam);
    const sign=box(W*0.7,0.6,0.1,0xff9a3c); sign.position.set(0,2.8,0.4); g.add(sign);
  }
  return g;
}
function rebuildZoo(){
  for(const g of zooBMeshes.values()) zooRoot.remove(g);
  zooBMeshes.clear();
  for(const b of save.zoo.buildings){ const g=makeBuildingMesh(b); zooRoot.add(g); zooBMeshes.set(b.uid,g); }

function rebuildZooAnimals(){
  for(const a of zooAnimals) zooRoot.remove(a.mesh);
  zooAnimals=[];
  for(const a of save.zoo.animals){
    const hb=findB(a.habitat); if(!hb) continue;
    const sp=DATA.speciesById[a.species]; if(!sp) continue;
    const m=makeModel(sp.model); const c=tileCenter(hb), d=bdef(hb.type);
    const hw=d.size[0]*TS()/2-0.8, hd=d.size[1]*TS()/2-0.8;
    m.position.set(c.x+(Math.random()*2-1)*hw,0.1,c.z+(Math.random()*2-1)*hd); m.scale.setScalar(1.3);
    zooRoot.add(m);
    zooAnimals.push({mesh:m,a,c,hw,hd,tx:m.position.x,tz:m.position.z,hop:Math.random()*6,wait:Math.random()*3});

}

/* ---------- 模擬：需求、溫度、門票 ---------- */
function heatersOn(){ return zooStats.heatOn; }
function habitatTemp(b){
  const d=bdef(b.type); let t=d.baseTemp||0;
  if(heatersOn()) for(const h of save.zoo.buildings){ const hd=bdef(h.type); if(hd.kind==='heater' && tileDist(h,b)<=hd.radius+Math.max(...d.size)/2) t+=hd.heat; }
  return t;
}
function habitatFed(b){ const d=bdef(b.type); return save.zoo.buildings.some(f=>{ const fd=bdef(f.type); return fd.kind==='feeder' && tileDist(f,b)<=fd.radius+Math.max(...d.size)/2; }); }
function simulate(min){
  const Z=ZC(), zoo=save.zoo;
  // 暖爐耗煤
  const heaters=zoo.buildings.filter(b=>bdef(b.type).kind==='heater');
  if(heaters.length){
    zoo.fuelDebt+=heaters.reduce((s,h)=>s+bdef(h.type).fuelPerMin,0)*min;
    while(zoo.fuelDebt>=1 && (save.resources.fuel||0)>0){ save.resources.fuel--; zoo.fuelDebt--; }
    zooStats.heatOn=(save.resources.fuel||0)>0 || zoo.fuelDebt<1;
  } else zooStats.heatOn=true;
  const temps=new Map(), fed=new Map(), counts=new Map();
  for(const a of zoo.animals){ const k=a.habitat+'|'+a.species; counts.set(k,(counts.get(k)||0)+1); }
  let attract=0;
  for(const a of zoo.animals){
    const b=findB(a.habitat), sp=DATA.speciesById[a.species]; if(!b||!sp) continue;
    if(!temps.has(b.uid)){ temps.set(b.uid,habitatTemp(b)); fed.set(b.uid,habitatFed(b)); }
    a.food=Math.max(0,(a.food??80)-Z.foodDecayPerMin*min);
    while(a.food<Z.feedRefillAt && fed.get(b.uid) && (save.resources.feed||0)>=1){ save.resources.feed--; a.food=Math.min(100,a.food+Z.feedRefillAmount); }
    const T=temps.get(b.uid), tempOK=T>=sp.tempRange[0]&&T<=sp.tempRange[1];
    const socialOK=!SOCIAL_GROUP.includes(sp.social) || counts.get(b.uid+'|'+a.species)>=2;
    const target=Math.min(40,a.food/30*40)+(tempOK?40:0)+(socialOK?20:5);
    const h=a.happy??60, step=Z.happinessPerMin*min;
    a.happy=Math.abs(target-h)<=step?target:h+Math.sign(target-h)*step;
    attract+=sp.attract*a.happy/100;
  }
  zooStats.coinsPerMin=attract*Z.coinPerAttractPerMin;
  zooStats.visitors=Math.round(attract*Z.visitorPerAttract);
  zoo.coins+=zooStats.coinsPerMin*min;
  zoo.lastTick=Date.now();
}
function catchUp(){
  const zoo=save.zoo, Z=ZC();
  let m=Math.min(Z.offlineCapMinutes,Math.max(0,(Date.now()-(zoo.lastTick||Date.now()))/60000));
  if(m<0.05){ simulate(0); return null; }
  const c0=zoo.coins, f0=save.resources.feed||0, total=m;
  while(m>0){ const s=Math.min(1,m); simulate(s); m-=s; }
  return { minutes:Math.round(total), coins:Math.floor(zoo.coins-c0), feed:f0-(save.resources.feed||0) };
}

  $('zooUI').hidden=false; $('zWalkExit').hidden=true; $('zMain').hidden=false; $('zPanel').hidden=true;
  if(document.exitPointerLock) document.exitPointerLock();

function openHabitatPanel(b){

        <div class="zp-bars"><label>幸福${bar(a.happy??60,(a.happy??60)<40?'low':'')}</label><label>飽足${bar(a.food??80,(a.food??80)<30?'low':'')}</label></div>
        <button type="button" class="zmini" data-out="${a.id}">移出</button></div>`; }).join('')

    <div class="zp-add">${cand.length&&!full?cand.map(([id,n])=>`<button type="button" class="zmini add" data-in="${id}">放入 ${esc(DATA.speciesById[id].name)}（${n}）</button>`).join('')
      :`<span class="zp-empty">${full?'已經住滿了':`沒有可以放進${esc(d.name)}的${d.accepts.map(c=>DATA.config.categories[c].name).join('、')}生物`}</span>`}</div>`;

/* ---------- 點擊與鏡頭 ---------- */
const zRay=new THREE.Raycaster(), zNdc=new THREE.Vector2(), zPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0), zHit=new THREE.Vector3();
function screenToTile(cx,cy){
  const r=canvas.getBoundingClientRect();
  zNdc.set((cx-r.left)/r.width*2-1,-(cy-r.top)/r.height*2+1);
  zRay.setFromCamera(zNdc,zooCam);
  if(!zRay.ray.intersectPlane(zPlane,zHit)) return null;
  return { x:Math.floor(zHit.x/TS()+GN()/2), z:Math.floor(zHit.z/TS()+GN()/2) };
}
function placeOffset(d,t){ return { x:t.x-Math.floor((d.size[0]-1)/2), z:t.z-Math.floor((d.size[1]-1)/2) }; }
function zooTap(cx,cy){
  const t=screenToTile(cx,cy); if(!t) return;
  const z=save.zoo, uid=occupancy().get(t.x+','+t.z);
  if(zTool==='select'){
    const b=uid&&findB(uid);
    if(!b){ zSelUid=null; updateSelBox(); $('zPanel').hidden=true; return; }
    zSelUid=b.uid; updateSelBox();
    const d=bdef(b.type);
    if(d.kind==='habitat') openHabitatPanel(b);
    else { $('zPanel').hidden=true;
      if(d.kind==='feeder') toast(`飼料站：半徑 ${d.radius} 格內的棲地會自動餵食（倉庫飼料 ${Math.floor(save.resources.feed||0)}）`);
      else if(d.kind==='heater') toast(`暖爐：半徑 ${d.radius} 格內的棲地 +${d.heat}°C，會慢慢消耗煤炭`);
      else toast(d.name); }
    return;
  }
  if(zTool==='demolish'){
    const b=uid&&findB(uid); if(!b) return;
    const d=bdef(b.type);
    if(d.buildable===false){ toast(`${d.name}不能拆除`); return; }
    for(const a of z.animals.filter(a=>a.habitat===b.uid)) z.unplaced[a.species]=(z.unplaced[a.species]||0)+1;
    z.animals=z.animals.filter(a=>a.habitat!==b.uid);
    z.buildings=z.buildings.filter(x=>x.uid!==b.uid);
    const refund={}; for(const [k,v] of Object.entries(d.cost)) refund[k]=Math.floor(v*ZC().demolishRefund);
    pay(refund,1); rebuildZoo(); simulate(0); updateZooHud(); renderZooTools(); persist();
    toast(`拆除${d.name}，退還 ${costText(refund)}`);
    return;
  }
  const d=bdef(zTool); if(!d) return;
  const p=placeOffset(d,t);
  if(!canPlace(d,p.x,p.z)){ toast('這裡放不下'); return; }
  if(!affordable(d.cost)){ toast(`不夠：需要 ${costText(d.cost)}`); return; }
  pay(d.cost,-1);
  const b={uid:z.nextUid++,type:d.id,x:p.x,z:p.z,rot:0};
  z.buildings.push(b);
  const g=makeBuildingMesh(b); zooRoot.add(g); zooBMeshes.set(b.uid,g);
  simulate(0); updateZooHud(); renderZooTools(); persist();
  if(d.kind==='habitat'){ zTool='select'; zSelUid=b.uid; updateSelBox(); renderZooTools(); openHabitatPanel(b); }
}
function updateGhost(cx,cy){
  const d=bdef(zTool);
  if(!d||state!=='zoo'){ zGhost.visible=false; return; }
  const t=screenToTile(cx,cy); if(!t){ zGhost.visible=false; return; }
  const p=placeOffset(d,t), ok=canPlace(d,p.x,p.z)&&affordable(d.cost);
  zGhost.visible=true; zGhost.scale.set(d.size[0]*TS(),1,d.size[1]*TS());
  zGhost.position.set((p.x+d.size[0]/2-GN()/2)*TS(),0.15,(p.z+d.size[1]/2-GN()/2)*TS());
  zGhost.material.color.setHex(ok?0x7cc8e8:0xff5d5d);
}
const zPtrs=new Map(); let zDrag=0, zPinch=0;
canvas.addEventListener('pointerdown',e=>{ if(state!=='zoo') return; zPtrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); zDrag=0; if(zPtrs.size===2){ const [a,b]=[...zPtrs.values()]; zPinch=Math.hypot(a.x-b.x,a.y-b.y); } });
canvas.addEventListener('pointermove',e=>{
  if(state!=='zoo') return;
  const p=zPtrs.get(e.pointerId);
  if(!p){ if(e.pointerType==='mouse') updateGhost(e.clientX,e.clientY); return; }
  const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if(zPtrs.size===1){
    zDrag+=Math.abs(dx)+Math.abs(dy);
    if(zDrag>6){ const k=zooCamT.d*0.0022; zooCamT.x-=dx*k; zooCamT.z-=dy*k; const lim=GN()*TS()/2; zooCamT.x=Math.max(-lim,Math.min(lim,zooCamT.x)); zooCamT.z=Math.max(-lim,Math.min(lim+6,zooCamT.z)); }
    if(e.pointerType==='mouse') updateGhost(e.clientX,e.clientY);
  } else if(zPtrs.size===2){
    const [a,b]=[...zPtrs.values()], dd=Math.hypot(a.x-b.x,a.y-b.y);
    if(zPinch) zooCamT.d=Math.max(14,Math.min(80,zooCamT.d*zPinch/dd)); zPinch=dd; zDrag=99;
  }
});
const zUp=e=>{ if(!zPtrs.has(e.pointerId)) return; const single=zPtrs.size===1; zPtrs.delete(e.pointerId); if(state==='zoo'&&single&&zDrag<=6) zooTap(e.clientX,e.clientY); if(zPtrs.size<2) zPinch=0; };
canvas.addEventListener('pointerup',zUp); canvas.addEventListener('pointercancel',e=>zPtrs.delete(e.pointerId));
canvas.addEventListener('wheel',e=>{ if(state!=='zoo') return; e.preventDefault(); zooCamT.d=Math.max(14,Math.min(80,zooCamT.d*(1+Math.sign(e.deltaY)*0.1))); },{passive:false});

/* ---------- 每幀 ---------- */
function zooUpdate(dt){
  if(toastT>0){ toastT-=dt; if(toastT<=0) $('toast').style.opacity=0; }
  zooAcc+=dt; if(zooAcc>=0.5){ simulate(zooAcc/60); zooAcc=0; }
  zSaveT+=dt; if(zSaveT>=ZC().autosaveSeconds){ zSaveT=0; persist(); }
  zHudT+=dt; if(zHudT>=0.5){ zHudT=0; updateZooHud(); }
  for(const g of zooBMeshes.values()) if(g.userData.glow) g.userData.glow.material.opacity=heatersOn()?0.55+Math.sin(clock.elapsedTime*3)*0.15:0;
  for(const z of zooAnimals){
    const m=z.mesh;
    if(z.wait>0){ z.wait-=dt; m.position.y=0.1; continue; }
    const dx=z.tx-m.position.x, dz=z.tz-m.position.z, d=Math.hypot(dx,dz);
    if(d<0.2){ z.tx=z.c.x+(Math.random()*2-1)*z.hw; z.tz=z.c.z+(Math.random()*2-1)*z.hd; z.wait=1+Math.random()*4; continue; }
    const s=Math.min(d,dt*1.4); m.position.x+=dx/d*s; m.position.z+=dz/d*s; m.rotation.y=Math.atan2(dx,dz);
    z.hop+=dt*10; m.position.y=0.1+Math.abs(Math.sin(z.hop))*0.12;
  }
  if(state==='zoowalk'){
    let ix=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x, iz=(keys.KeyS?1:0)-(keys.KeyW?1:0)+joy.y;
    const il=Math.hypot(ix,iz); if(il>1){ix/=il;iz/=il;}
    const sp=sprint?6.5:3.6, sy=Math.sin(player.yaw), cy=Math.cos(player.yaw);
    player.pos.x+=(ix*cy+iz*sy)*sp*dt; player.pos.z+=(-ix*sy+iz*cy)*sp*dt;
    const lim=GN()*TS()/2-0.6; player.pos.x=Math.max(-lim,Math.min(lim,player.pos.x)); player.pos.z=Math.max(-lim,Math.min(lim+4,player.pos.z));
    if(il>0.1) player.bob+=dt*8;
    camera.position.set(player.pos.x,1.65+(il>0.1?Math.sin(player.bob)*0.05:0),player.pos.z); camera.rotation.set(player.pitch,player.yaw,0);
  } else {
    zooCam.position.set(zooCamT.x,zooCamT.d*0.82,zooCamT.z+zooCamT.d*0.58); zooCam.lookAt(zooCamT.x,0,zooCamT.z);
  }
}

$('zWalk').onclick=()=>startZooWalk();
$('zWalkExit').onclick=()=>endZooWalk();
$('zDex').onclick=()=>{ $('zooUI').hidden=true; showDex(); };
$('zGo').onclick=()=>leaveZooForExpedition();

/* =========================================================
   8. 主迴圈
   ========================================================= */
const clock=new THREE.Clock(), tmpV=new THREE.Vector3();
function collide(p,r){
  for(const b of colliders){
    const cx=Math.max(b.x0,Math.min(p.x,b.x1)), cz=Math.max(b.z0,Math.min(p.z,b.z1)), dx=p.x-cx, dz=p.z-cz, d2=dx*dx+dz*dz;
    if(d2<r*r){ if(d2>1e-6){ const d=Math.sqrt(d2); p.x=cx+dx/d*r; p.z=cz+dz/d*r; } else { const mx=(b.x0+b.x1)/2; p.x=p.x>mx?b.x1+r:b.x0-r; } }
  }
  const d=Math.hypot(p.x,p.z); if(d>185){ p.x*=185/d; p.z*=185/d; }
}
function update(dt){
  if(zooActive){ zooUpdate(dt); return; }
  const t=clock.elapsedTime;
  if(world) world.traverse(o=>{ if(o.userData.spin){ o.rotation.y+=dt*2; o.position.y+=Math.sin(t*3)*0.003; } });
  for(const s of smoke){ s.userData.t=(s.userData.t+dt*0.18)%1; const k=s.userData.t; s.position.set(Math.sin(k*5)*0.6,5+k*9,33.6-k*7); const sc=0.8+k*4; s.scale.set(sc,sc,1); s.material.opacity=0.55*(1-k); }
  const playing=state==='play'||state==='confirm';
  const stormK=playing?(timeLeft<=0?1:Math.max(0,1-timeLeft/45)):0;
  const p=snowGeo.attributes.position.array, wind=2+stormK*14;
  for(let i=0;i<SNOW_N;i++){ p[i*3+1]-=dt*(2.2+stormK*3); p[i*3]+=dt*wind*0.6; p[i*3+2]+=dt*wind*0.3; if(p[i*3+1]<0)p[i*3+1]+=25; if(p[i*3]>30)p[i*3]-=60; if(p[i*3+2]>30)p[i*3+2]-=60; }
  snowGeo.attributes.position.needsUpdate=true;
  snow.position.set(player.pos.x,player.pos.y-6,player.pos.z);
  scene.fog.density=0.016+stormK*0.05;
  scene.fog.color.copy(SKY).lerp(STORM_SKY,stormK*0.7); scene.background.copy(scene.fog.color);
  if(state!=='play'){
    if(state==='hub'||state==='boot') player.yaw+=dt*0.03;
    camera.position.set(player.pos.x,heightAt(player.pos.x,player.pos.z)+1.65,player.pos.z); camera.rotation.set(player.pitch,player.yaw,0); return;
  }
  const C=CFG(), T=TMP(), W=DATA.config.wraith;
  timeLeft-=dt;
  if(toastT>0){ toastT-=dt; if(toastT<=0) $('toast').style.opacity=0; }
  let ix=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x, iz=(keys.KeyS?1:0)-(keys.KeyW?1:0)+joy.y;
  const il=Math.hypot(ix,iz); if(il>1){ix/=il;iz/=il;}
  const speed=sprint?C.sprintSpeed:C.walkSpeed, sy=Math.sin(player.yaw), cy=Math.cos(player.yaw);
  player.pos.x+=(ix*cy+iz*sy)*speed*dt; player.pos.z+=(-ix*sy+iz*cy)*speed*dt;
  collide(player.pos,0.45);
  const moving=il>0.1; if(moving) player.bob+=dt*(sprint?13:9);
  const gy=heightAt(player.pos.x,player.pos.z);
  camera.position.set(player.pos.x,gy+1.65+(moving?Math.sin(player.bob)*0.06:0),player.pos.z);
  camera.rotation.set(player.pitch,player.yaw,0); player.pos.y=gy;

  const inHeat=distToTrain(player.pos.x,player.pos.z)<C.heatRadius;
  if(inHeat){
    player.temp=Math.min(T.max,player.temp+T.heatRegenPerSec*dt);
    if(bagCount()>0){ const n=bagCount(); depositAll(); toast(`存入車廂 ${n} 單位物資`); }
    if(followers.length){ const names=boardFollowers(); toast(`${names.join('、')} 安全上車了`); }
    ammoTick+=dt; if(ammoTick>weapon.refillSeconds&&ammo<weapon.ammo){ ammo++; ammoTick=0; }
  } else {
    player.temp-=(timeLeft<=0?T.stormDrainPerSec:T.drainPerSec+(sprint&&moving?T.sprintExtraDrain:0)+followers.length*T.perFollowerDrain)*dt;
  }
  followers.forEach((f,i)=>{
    const back=1.6+i*1.3; tmpV.set(player.pos.x+Math.sin(player.yaw)*back,0,player.pos.z+Math.cos(player.yaw)*back);
    const m=f.mesh, dx=tmpV.x-m.position.x, dz=tmpV.z-m.position.z, d=Math.hypot(dx,dz);
    if(d>0.3){ const s=Math.min(d,dt*(d>4?9:5)); m.position.x+=dx/d*s; m.position.z+=dz/d*s; m.rotation.y=Math.atan2(dx,dz); f.hop+=dt*12; }
    m.position.y=heightAt(m.position.x,m.position.z)+Math.abs(Math.sin(f.hop))*0.12;
  });
  const elapsed=C.runSeconds-timeLeft;
  if(elapsed>nextSpawn){
    const max=timeLeft<=0?W.stormMax:W.baseMax+Math.floor(elapsed/W.addMaxEverySeconds);
    if(wraiths.length<max) spawnWraith();
    nextSpawn=elapsed+(timeLeft<=0?W.stormSpawnInterval:W.spawnInterval);
  }
  for(const w of wraiths){
    const g=w.g; w.phase+=dt;
    const dx=player.pos.x-g.position.x, dz=player.pos.z-g.position.z, d=Math.max(0.01,Math.hypot(dx,dz));
    if(d<W.chaseRange&&!inHeat){ const s=(timeLeft<=0?W.stormSpeed:W.speed)*dt; g.position.x+=dx/d*s; g.position.z+=dz/d*s; }
    else { g.position.x+=Math.sin(w.phase*0.5)*dt; g.position.z+=Math.cos(w.phase*0.4)*dt; }
    if(distToTrain(g.position.x,g.position.z)<C.heatRadius+1){ g.position.x-=dx/d*dt*4; g.position.z-=dz/d*dt*4; }
    g.rotation.y=Math.atan2(dx,dz); g.position.y=heightAt(g.position.x,g.position.z)+Math.sin(w.phase*2)*0.25;
    if(w.hit>0){ w.hit-=dt; w.mat.emissive.setHex(0x553311); } else w.mat.emissive.setHex(0x0a1a2a);
    if(d<1.5&&!inHeat){ player.temp-=W.touchDrainPerSec*dt; hurtT=0.3; player.pos.x+=dx/d*dt*3; player.pos.z+=dz/d*dt*3; }
  }
  if(hurtT>0) hurtT-=dt; $('hurt').style.opacity=hurtT>0?1:0;
  for(let i=flares.length-1;i>=0;i--){
    const f=flares[i]; f.life-=dt; f.v.y-=6*dt; f.m.position.addScaledVector(f.v,dt);
    let hit=false;
    for(let j=wraiths.length-1;j>=0;j--){
      const w=wraiths[j];
      if(f.m.position.distanceTo(tmpV.copy(w.g.position).setY(w.g.position.y+1.3))<weapon.range){
        hit=true; w.hp-=weapon.damage; w.hit=0.25;
        if(w.hp<=0){ world.remove(w.g); wraiths.splice(j,1); toast('霜影被驅散了'); }
        break;
      }
    }
    if(hit||f.life<=0||f.m.position.y<heightAt(f.m.position.x,f.m.position.z)){ world.remove(f.m); flares.splice(i,1); }
  }
  interact(dt);
  if(player.temp<=0) collapse();
  if(state==='play') hud(inHeat);
}
function loop(){ requestAnimationFrame(loop); const dt=Math.min(clock.getDelta(),0.05); update(dt); if(zooActive) renderer.render(zooScene,state==='zoowalk'?camera:zooCam); else renderer.render(scene,camera); }

/* =========================================================
   9. 啟動
   ========================================================= */
player.pos.set(6,0,12); player.yaw=-0.6; player.pitch=0.05;
screenEl.innerHTML='<div class="loading">讀取存檔中…</div>';
loop();
(async()=>{
  try{ await loadData(); }
  catch(e){ screenEl.innerHTML='<div class="card"><h2>遊戲資料讀取失敗</h2><p>設定表沒有載入成功，請重新整理頁面再試一次。</p></div>'; return; }
  buildStation('ruins',12345);
  await initSave();
  enterZoo();
})();
})();
