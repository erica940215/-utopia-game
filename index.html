/* 每次模擬：先處理員工（薪水、照護覆蓋、維修、清潔、醫療），再算動物需求 */
function opsBeforeAnimals(min){
  const z=save.zoo, O=OPS(), S=DATA.staffById;
  // 薪水
  const salary=Object.entries(z.staff).reduce((s,[id,n])=>s+(S[id]?S[id].salaryPerMin*n:0),0);
  opsStats.salary=salary; z.coins-=salary*(z.wage||1)*min;
  opsStats.unpaid=z.coins<0; if(z.coins<0) z.coins=0;
  const eff=opsStats.unpaid?0.5:1;
  // 飼育員覆蓋率
  const need=z.animals.length;
  opsStats.coverage=need?Math.min(1,staffPower('keeper')*S.keeper.capacity*RF().keeperCapacityMult*eff/need):1;
  computeHabCov(); moraleStep(min); utilityStep(min);
  // 設施耗損與技工維修
  const wear=z.buildings.filter(b=>{ const k=bdef(b.type).kind; return k!=='path'&&k!=='gate'; });
  for(const b of wear) b.cond=Math.max(0,(b.cond??100)-O.conditionDecayPerMin*min);
  let repair=staffPower('mechanic')*S.mechanic.repairPerMin*RF().repairMult*repairMult()*eff*min;
  for(const b of wear.slice().sort((a,b)=>a.cond-b.cond)){ if(repair<=0) break; const r=Math.min(repair,100-b.cond); b.cond+=r; repair-=r; }
  // 清潔
  z.clean=Math.max(0,Math.min(100,z.clean-(zooStats.visitors||0)*O.litterPerVisitorMin*min+staffPower('janitor')*S.janitor.cleanPerMin*RF().cleanMult*eff*min+propEffects().clean*min));
  // 生病與獸醫
  let cure=staffPower('vet')*S.vet.curePerMin*vetMult()*eff*min;
  for(const a of z.animals){
    if(!a.sick&&Math.random()<O.sickChancePerMin*RF().sickChanceMult*geneSickMult(a)*guestFeedMult(findB(a.habitat))*min*(a.food<30?3:1)) a.sick=true;
    if(a.sick&&cure>=1){ a.sick=false; cure-=1; }
    else if(a.sick&&cure>0&&Math.random()<cure){ a.sick=false; cure=0; }
    a.health=Math.max(5,Math.min(100,(a.health??100)+(a.sick?-O.sickHealthLossPerMin:O.healthRegenPerMin)*min));
  }
}
function animalOpsPenalty(a,b){
  return (a.sick?LIFE().sickHappyPenalty:0)+(1-habitatCoverage(b))*25+(100-(a.health??100))*0.3+(isWorking(b)?0:12)+utilityPenalty(a,b);
}

/* 遊客、門票、消費、研究 */
function facilityCoverage(service,visitors){
  const serves=save.zoo.buildings.filter(b=>{ const d=bdef(b.type); return d.kind==='facility'&&(d.service===service||(d.services||[]).includes(service))&&isWorking(b); }).reduce((s,b)=>s+bdef(b.type).serves,0)*bizStats.power.ratio;
  return visitors<=0?1:Math.min(1,serves/visitors);
}
function opsEconomy(attract,min){
  const z=save.zoo, O=OPS(), Z=ZC();
  const prevV=Math.max(1,zooStats.visitors||0);
  const viewing=z.animals.length?z.animals.reduce((s,a)=>s+(a.happy??60),0)/z.animals.length:20;
  const pe=propEffects();
  const needs={food:facilityCoverage('food',prevV),drink:drinkCoverage(prevV),restroom:facilityCoverage('restroom',prevV),rest:facilityCoverage('rest',prevV),shop:facilityCoverage('shop',prevV)};
  const boards=(z.props||[]).filter(p=>p.type==='info_board').length;
  const education=Math.min(100,staffPower('educator')*DATA.staffById.educator.satisfaction*4+boards*6+extraEducation(pe));
  const decor=Math.min(100,(z.props||[]).length*2);
  const needScore=(needs.food+needs.drink+needs.restroom+needs.rest)/4*100;
  const sat=Math.min(100,0.35*viewing+0.25*needScore+0.2*z.clean+0.1*education+0.1*decor+tramSatBonus()-toiletSatPenalty());
  opsStats.needs=needs; opsStats.satisfaction=sat; opsStats.parts.sat={viewing,needScore,clean:z.clean,education,decor};
  const priceF=Math.max(0.2,1-(z.ticket-O.ticketDefault)*O.priceElasticity*RF().priceElasticityMult);
  const visitors=Math.round(attract*Z.visitorPerAttract*(0.5+sat/100)*priceF*(0.7+0.1*opsStats.rating)*RF().visitorMult*campaignMult()*worldVisitorMult()*extraVisitorMult(pe));
  let ticket=visitors*z.ticket*O.coinsPerVisitorTicketMin;
  let spend=0;
  for(const b of z.buildings){ const d=bdef(b.type); if(d.kind==='facility'&&d.spendPerVisitorMin&&isWorking(b)) spend+=Math.min(visitors,d.serves)*d.spendPerVisitorMin; }
  if(hasFacility('atm')) spend*=FAC().atmSpend;
  spend+=toiletIncome(visitors)+pe.online;
  if(hasFacility('info')) z.cp=(z.cp||0)+visitors*FAC().adoptionCpPerVisitorMin*min;
  opsStats.theft=(staffPower('security')+pe.security)*DATA.staffById.security.capacity<visitors&&visitors>20;
  const mult=opsStats.theft?1-O.theftLoss:1;
  opsStats.income={ticket:ticket*mult,spend:spend*mult};
  zooStats.visitors=visitors; zooStats.coinsPerMin=(ticket+spend)*mult;
  z.coins+=zooStats.coinsPerMin*min;
  bizEconomy(visitors,ticket*mult,min);
  const distinct=new Set(z.animals.map(a=>a.species)).size;
  zooStats.researchPerMin=distinct*(Z.researchPerSpeciesPerMin||0)*(1+staffCount('educator')*DATA.staffById.educator.researchBonus)*researchMult();
  z.research=(z.research||0)+zooStats.researchPerMin*min;
}

/* 園區評價：動物福利、遊客滿意度、物種多樣性、保育、整潔 */
function computeRating(){
  const z=save.zoo, O=OPS(), W=O.ratingWeights;
  const welfare=z.animals.length?z.animals.reduce((s,a)=>s+(a.happy??60),0)/z.animals.length:0;
  const distinct=new Set(z.animals.map(a=>a.species));
  const diversity=Math.min(1,distinct.size/O.diversityFull)*100;
  const endangered=[...distinct].filter(id=>{ const r=DATA.speciesById[id]&&DATA.speciesById[id].rarity; return r==='endangered'||r==='legendary'; }).length;
  const pe=propEffects(), conservation=Math.min(1,(endangered+(z.released||0)*0.5+consDoneCount()*2+pe.cons*0.2)/O.conservationFull)*100;
  const parts={welfare,satisfaction:opsStats.satisfaction,diversity,conservation,cleanliness:z.clean};
  const score=Object.entries(W).reduce((s,[k,w])=>s+w*parts[k],0);
  opsStats.parts.rating=parts; opsStats.score=score; opsStats.endangered=endangered;
  opsStats.rating=Math.max(1,Math.min(5,1+Math.floor(score/20)));
  return opsStats.rating;
}

/* 遊客小人：在步道上走動 */
let zooPeople=[];
const PEOPLE_COLORS=[0xc8402a,0x2a5ad8,0xe8c040,0x3a8a4a,0x8a3a9a,0xe0802a,0xf2efe6,0x2a2828];
function makePerson(){
  const g=new THREE.Group(), c=PEOPLE_COLORS[Math.floor(Math.random()*PEOPLE_COLORS.length)];
  const body=cyl(0.18,0.22,0.8,c,8); body.position.y=0.6; g.add(body);
  const legs=cyl(0.14,0.14,0.4,0x2a2c34,6); legs.position.y=0.2; g.add(legs);
  const head=sph(0.15,0xe8c0a0); head.position.y=1.15; g.add(head);
  return g;
}
function pathTargets(){
  const ps=save.zoo.buildings.filter(b=>bdef(b.type).kind==='path'||bdef(b.type).kind==='facility'||b.type==='gate').map(tileCenter);
  return ps.length?ps:[{x:0,z:GN()*TS()/2-3}];
}
function updatePeople(dt){
  const want=Math.min(Q().people,Math.round((zooStats.visitors||0)/4));
  const G=walkTiles(), keys=[...G.keys()];
  while(zooPeople.length<want){ const p=makePerson(), k=keys.length?keys[Math.floor(Math.random()*keys.length)]:null, t=k?tileXZ(k):{x:0,z:GN()*TS()/2-3};
    p.position.set(t.x+(Math.random()-0.5),0,t.z+(Math.random()-0.5)); zooRoot.add(p); zooPeople.push({m:p,route:[],wait:Math.random()*3,ph:Math.random()*6}); }
  while(zooPeople.length>want){ const p=zooPeople.pop(); zooRoot.remove(p.m); }
  for(const p of zooPeople){
    const m=p.m;
    if(p.wait>0){ p.wait-=dt; }
    else if(!p.route||!p.route.length){ p.route=nextWalk(p)||[]; p.wait=Math.random()*3; }
    else{ const t=p.route[0], dx=t.x-m.position.x, dz=t.z-m.position.z, d=Math.hypot(dx,dz);
      if(d<0.25){ p.route.shift(); if(!p.route.length) p.wait=1+Math.random()*4; }
      else{ const s=Math.min(d,dt*1.3); m.position.x+=dx/d*s; m.position.z+=dz/d*s; m.rotation.y=Math.atan2(dx,dz); p.ph+=dt*9; } }
    m.position.y=ZH(m.position.x,m.position.z)+Math.abs(Math.sin(p.ph))*0.05;
  }
}
function clearPeople(){ for(const p of zooPeople) zooRoot.remove(p.m); zooPeople=[]; }

/* =========================================================
   研究所：技術研究、物種研究、保育計畫
   技術在 data/research.json；物種研究與保育的數值在 config.speciesResearch / config.conservation
   ========================================================= */
function ensureResearch(){
  const z=save.zoo; if(!z) return;
  z.tech=z.tech||{}; z.know=z.know||{}; z.cons=z.cons||{};
}
/* 已完成技術的效果合併（乘數相乘、加值相加） */
function RF(){
  const out={feedEfficiency:1,happinessBonus:0,sickChanceMult:1,breedChanceMult:1,adultMinutesMult:1,keeperCapacityMult:1,repairMult:1,cleanMult:1,
    visitorMult:1,priceElasticityMult:1,lifespanMult:1,elderPenaltyMult:1,expDrainMult:1,expWraithMult:1,expContainerBonus:0};
  const done=(save.zoo&&save.zoo.tech)||{};
  for(const r of DATA.research){ if(!done[r.id]) continue;
    for(const [k,v] of Object.entries(r.effects||{})){ if(k.endsWith('Bonus')) out[k]+=v; else out[k]*=v; } }
  return out;
}
const techDone=id=>!!(save.zoo&&save.zoo.tech&&save.zoo.tech[id]);
const buildingUnlocked=d=>!d.requires||techDone(d.requires);
const knowLevel=id=>(save.zoo&&save.zoo.know&&save.zoo.know[id])||0;
function knowCost(sp){ const C=DATA.config.speciesResearch, lv=knowLevel(sp.id); if(lv>=C.costs.length) return null; return Math.round(C.costs[lv]*(C.rarityMult[sp.rarity]||1)); }

/* 保育計畫：瀕危、傳說級物種各有一個計畫——園區出生 N 隻，再野放 1 隻園區出生的個體 */
function consFor(id){ const z=save.zoo; z.cons[id]=z.cons[id]||{born:0,released:0,done:false}; return z.cons[id]; }
function consEligible(sp){ return DATA.config.conservation.rarities.includes(sp.rarity); }
function consOnBirth(baby){ ensureResearch(); const sp=DATA.speciesById[baby.species]; if(sp&&consEligible(sp)){ consFor(sp.id).born++; earnCp(DATA.config.biz.cpBirth); checkCons(sp); } }
function consOnRelease(a){ ensureResearch(); const sp=DATA.speciesById[a.species]; if(sp&&consEligible(sp)&&a.gen>0){ consFor(sp.id).released++; checkCons(sp); } }
function checkCons(sp){
  const C=DATA.config.conservation, c=consFor(sp.id);
  if(c.done||c.born<C.bornTarget||c.released<C.releaseTarget) return;
  c.done=true; const rw=C.reward[sp.rarity]; pay(rw,1); earnCp(DATA.config.biz.cpConservation[sp.rarity]||0);
  toast(`保育計畫完成：${sp.name}！獎勵 ${costText(rw)}`);
}
const consDoneCount=()=>Object.values((save.zoo&&save.zoo.cons)||{}).filter(c=>c.done).length;

let labTab='tech';
function showLab(msg){
  ensureOps(); ensureResearch(); state='lab';
  const z=save.zoo, catName={care:'動物照護',facility:'設施',ops:'營運',expedition:'遠征'};
  let body='';
  if(labTab==='tech'){
    body=Object.keys(catName).map(cat=>`<div class="sec-title"><span>${catName[cat]}</span></div>`+DATA.research.filter(r=>r.cat===cat).map(r=>{
      const done=techDone(r.id), reqOK=r.requires.every(techDone), can=!done&&reqOK&&(z.research||0)>=r.cost;
      const btn=done?'<span class="sc-max">已完成</span>':!reqOK?`<span class="sc-max">需要先完成：${r.requires.map(x=>DATA.researchById[x].name).join('、')}</span>`
        :`<button type="button" class="zmini add" data-tech="${r.id}" ${can?'':'disabled'}>研究 ${r.cost}</button>`;
      return `<div class="shopcard${done?' on':''}"><div class="sc-main"><b>${esc(r.name)}</b><span>${esc(r.desc)}</span></div>${btn}</div>`; }).join('')).join('');
  } else if(labTab==='species'){
    const owned=[...new Set(z.animals.map(a=>a.species))].map(id=>DATA.speciesById[id]).filter(Boolean);
    body=owned.length?owned.map(sp=>{ const lv=knowLevel(sp.id), cost=knowCost(sp), max=DATA.config.speciesResearch.costs.length;
      return `<div class="shopcard${lv>=max?' on':''}"><div class="sc-main"><b>${esc(sp.name)} <em class="num">Lv${lv}/${max}</em></b><span>每級：這種動物幸福度 +${DATA.config.speciesResearch.happinessPerLevel}、吸引力 +${Math.round(DATA.config.speciesResearch.attractPerLevel*100)}%</span></div>
        ${cost==null?'<span class="sc-max">已研究完成</span>':`<button type="button" class="zmini add" data-know="${sp.id}" ${(z.research||0)>=cost?'':'disabled'}>研究 ${cost}</button>`}</div>`; }).join('')
      :'<p class="zp-empty">先把動物放進園區，才能研究牠們。</p>';
  } else {
    const C=DATA.config.conservation;
    const list=Object.keys(save.collection).map(id=>DATA.speciesById[id]).filter(sp=>sp&&consEligible(sp));
    body=`<p class="zp-empty">瀕危與傳說級物種各有一個保育計畫：在園區繁殖出 ${C.bornTarget} 隻寶寶，再野放 ${C.releaseTarget} 隻園區出生的個體。完成後可以拿到大量研究點數，也會提高園區的保育評價。</p>`+
      (list.length?list.map(sp=>{ const c=consFor(sp.id), r=DATA.config.rarity[sp.rarity];
        return `<div class="shopcard${c.done?' on':''}"><div class="sc-main"><b>${c.done?'✔ ':''}${esc(sp.name)} <em>${esc(r.name)}</em></b>
          <span>園區出生 ${Math.min(c.born,C.bornTarget)}/${C.bornTarget}・野放園區出生個體 ${Math.min(c.released,C.releaseTarget)}/${C.releaseTarget}</span><span>獎勵 ${esc(costText(C.reward[sp.rarity]))}</span></div></div>`; }).join('')
       :'<p class="zp-empty">還沒有發現瀕危或傳說級物種。往遠方的站點找找看。</p>');
  }
  const tabs=[['tech','技術'],['species','物種研究'],['cons','保育計畫']];
  screenEl.hidden=false;
  screenEl.innerHTML=`<div class="hub">
    <div class="hub-head"><h1><small>RESEARCH · 研究所</small>研究所</h1><span class="savechip">研究點數 ${Math.floor(z.research||0)}</span></div>
    <div class="dextabs" role="tablist">${tabs.map(([id,n])=>`<button type="button" role="tab" class="dextab${labTab===id?' on':''}" data-ltab="${id}" aria-selected="${labTab===id}">${n}</button>`).join('')}</div>
    ${msg?`<div class="dexinfo">${esc(msg)}</div>`:''}
    <div class="shoplist">${body}</div>
    <button class="btn ghost" id="labBack" type="button">回到園區</button>
  </div>`;
  screenEl.querySelectorAll('[data-ltab]').forEach(el=>el.onclick=()=>{ labTab=el.dataset.ltab; showLab(); });
  screenEl.querySelectorAll('[data-tech]').forEach(el=>el.onclick=()=>{ const r=DATA.researchById[el.dataset.tech]; if((z.research||0)<r.cost) return; z.research-=r.cost; z.tech[r.id]=Date.now(); persist(); renderZooTools(); showLab(`完成研究：${r.name}`); });
  screenEl.querySelectorAll('[data-know]').forEach(el=>el.onclick=()=>{ const sp=DATA.speciesById[el.dataset.know], cost=knowCost(sp); if(cost==null||(z.research||0)<cost) return; z.research-=cost; z.know[sp.id]=knowLevel(sp.id)+1; persist(); showLab(`${sp.name} 研究到 Lv${z.know[sp.id]}`); });
  $('labBack').onclick=()=>{ screenEl.hidden=true; state='zoo'; $('zooUI').hidden=false; updateZooHud(); };
}

/* =========================================================
   遊戲模式：生涯、沙盒、挑戰
   生涯存檔就是原本的存檔；沙盒與挑戰存在 save.slots 底下，互不影響
   挑戰關卡在 data/challenges.json
   ========================================================= */
let careerSave=null, activeSlot='career';
function rootSave(){
  if(activeSlot==='visit'||activeSlot==='coop') return careerSave||save;
  if(activeSlot==='career'||!careerSave) return save;
  careerSave.slots=careerSave.slots||{}; careerSave.slots[activeSlot]=save; return careerSave;
}
const modeOf=()=>save.mode||'career';
function switchSlot(slot,fresh){
  if(activeSlot==='coop') leaveCoopZoo();
  if(activeSlot!=='career'&&activeSlot!=='visit'&&activeSlot!=='coop'&&careerSave){ careerSave.slots=careerSave.slots||{}; careerSave.slots[activeSlot]=save; }
  activeSlot=slot;
  if(slot==='career'){ save=careerSave; }
  else{ careerSave.slots=careerSave.slots||{}; if(!careerSave.slots[slot]) careerSave.slots[slot]=fresh(); save=careerSave.slots[slot]; }
  zooBaseBuilt&&clearPeople();
}
function newSandbox(){
  const s=emptySave(); s.mode='sandbox';
  s.resources=Object.fromEntries(DATA.items.map(i=>[i.id,9999]));
  for(const sp of DATA.species) s.collection[sp.id]=2;
  s.upgrades=Object.fromEntries(DATA.upgrades.map(u=>[u.id,u.levels.length]));
  s.gear={owned:DATA.equipment.map(e=>e.id),equipped:{weapon:'flamethrower',body:'polar_suit',pack:'heater_pack',tool:'pro_kit',feet:'snow_boots'}};
  s.map={visited:DATA.map.map(n=>n.id)};
  const keep=save; save=s; ensureZoo(); ensureOps(); ensureResearch();
  s.zoo.coins=999999; s.zoo.research=99999; s.zoo.tech=Object.fromEntries(DATA.research.map(r=>[r.id,1]));
  s.zoo.staff={keeper:4,vet:2,mechanic:2,janitor:3,security:2,educator:1}; s.zoo.noAging=true;
  save=keep; return s;
}
function newChallenge(ch){
  const s=emptySave(); s.mode='challenge'; s.challenge=ch.id;
  s.resources=Object.assign({fuel:0,scrap:0,feed:0},ch.start.resources||{});
  for(const [id,n] of Object.entries(ch.start.animals||{})) s.collection[id]=n;
  const keep=save; save=s; ensureZoo(); ensureOps(); ensureResearch();
  s.zoo.coins=ch.start.coins||0; s.zoo.research=ch.start.research||0; s.zoo.unplaced={...(ch.start.animals||{})};
  if(ch.start.staff) s.zoo.staff={...ch.start.staff};
  s.zoo.chStart=0; save=keep; return s;
}
const MODE_NAME={career:'生涯',sandbox:'沙盒',challenge:'挑戰',visit:'參觀',coop:'合營'};

/* 挑戰進度 */
function challengeDef(){ return save.mode==='challenge'?DATA.challenges.find(c=>c.id===save.challenge):null; }
function challengeStat(k){ if(k==='coins') return Math.floor(save.zoo.coins); if(k==='animals') return save.zoo.animals.length; if(k==='satisfaction') return Math.round(opsStats.satisfaction); return achStat(k); }
function challengeStatus(){
  const ch=challengeDef(); if(!ch) return null;
  const used=(save.zoo.clock||0)-(save.zoo.chStart||0), left=Math.max(0,ch.minutes-used);
  const goals=ch.goals.map(g=>({...g,v:challengeStat(g.stat)}));
  const done=goals.every(g=>g.v>=g.target);
  return {ch,left,goals,done,failed:!done&&left<=0};
}
let chResolved=false;
function checkChallenge(){
  const st=challengeStatus(); if(!st||chResolved||save.chResult) return;
  if(st.done){ chResolved=true; save.chResult='won'; careerSave.chDone=careerSave.chDone||{}; const best=careerSave.chDone[st.ch.id];
    const t=Math.round(st.ch.minutes-st.left); if(!best||t<best) careerSave.chDone[st.ch.id]=t; persist(); showChallengeEnd(st,true,t); }
  else if(st.failed){ chResolved=true; save.chResult='lost'; persist(); showChallengeEnd(st,false); }
}
function challengeHud(){
  const el=$('zChal'); const st=challengeStatus();
  if(!st){ el.hidden=true; return; }
  el.hidden=false;
  el.innerHTML=`<b>${esc(st.ch.name)}</b><span class="num">剩 ${Math.floor(st.left)} 分鐘</span>${st.goals.map(g=>`<span class="${g.v>=g.target?'ok':''}">${esc(g.label)} ${Math.min(g.v,g.target)}/${g.target}</span>`).join('')}`;
}
function showChallengeEnd(st,won,t){
  state='chend'; $('zooUI').hidden=true; screenEl.hidden=false;
  screenEl.innerHTML=`<div class="card"><h1><small>CHALLENGE · ${won?'挑戰成功':'挑戰失敗'}</small>${esc(st.ch.name)}</h1>
    <p>${won?`用了 ${t} 分鐘完成所有目標。`:'時間到了，還有目標沒有完成。'}</p>
    <div class="tags">${st.goals.map(g=>`<span>${esc(g.label)} ${Math.min(g.v,g.target)}/${g.target}</span>`).join('')}</div>
    <div class="btns"><button class="btn ghost" id="chRetry" type="button">重新挑戰</button><button class="btn" id="chMenu" type="button">回到模式選擇</button></div></div>`;
  $('chRetry').onclick=()=>startChallenge(st.ch);
  $('chMenu').onclick=()=>showModeSelect();
}
function startChallenge(ch){ chResolved=false; if(careerSave&&careerSave.slots) careerSave.slots['ch_'+ch.id]=null; switchSlot('ch_'+ch.id,()=>newChallenge(ch)); persist(); enterZoo(); toast(ch.brief); }

/* 模式選擇畫面 */
function showModeSelect(){
  if(activeSlot==='coop'){ leaveCoopZoo(); activeSlot='career'; save=careerSave; }
  state='mode'; $('zooUI').hidden=true; $('hud').hidden=true; screenEl.hidden=false;
  const done=(careerSave&&careerSave.chDone)||{}, c=careerSave||save;
  const sbx=careerSave&&careerSave.slots&&careerSave.slots.sandbox;
  screenEl.innerHTML=`<div class="hub">
    <div class="hub-head"><h1><small>UTOPIA · 冰原最後的避難所</small>烏托邦</h1><span class="savechip">記錄檔：${esc((careerSave&&careerSave.profileName)||(saveProfile==='p1'?'記錄檔 1':saveProfile))}</span></div>
    ${sb?authHtml():`<p class="zp-empty">${store.mode==='cloud'?'已用你的 Claude 帳號自動存檔。':'本機存檔。'}要登入帳號、跨裝置或和朋友多人遊玩，請到遊戲網站。</p>`}
    <div class="zp-btns"><button type="button" class="zmini add" id="mProfiles">切換・新增記錄檔／多人記錄檔</button></div>
    <div class="modecards">
      <button type="button" class="modecard main" id="mCareer"><b>生涯模式</b><span>遠征救援、經營動物園、集滿圖鑑。已遠征 ${c.runs||0} 次・圖鑑 ${Object.keys(c.collection||{}).length} 種</span></button>
      <button type="button" class="modecard" id="mSandbox"><b>沙盒模式</b><span>資源無限、全部物種與設施解鎖，專心蓋自己的動物園。${sbx?'繼續上次的沙盒':''}</span></button>
    </div>
    ${sbx?'<button type="button" class="zmini" id="mSandboxNew">重新開一座沙盒動物園</button>':''}
    <div class="sec-title"><span>挑戰模式</span><b>${Object.keys(done).length}/${DATA.challenges.length}</b></div>
    <div class="shoplist">${DATA.challenges.map(ch=>`<div class="shopcard${done[ch.id]?' on':''}"><div class="sc-main"><b>${done[ch.id]?'✔ ':''}${esc(ch.name)}</b><span>${esc(ch.desc)}</span><span>限時 ${ch.minutes} 分鐘${done[ch.id]?`・最佳紀錄 ${done[ch.id]} 分鐘`:''}</span></div>
      <button type="button" class="zmini add" data-ch="${ch.id}">開始</button></div>`).join('')}</div>
    <p class="zp-empty">沙盒和挑戰的進度分開存，不會影響生涯存檔。挑戰時間是遊戲內時間，跟現實時間一樣快。</p>
  </div>`;
  $('mProfiles').onclick=()=>showProfiles();
  if(sb) wireAuth();
  $('mCareer').onclick=()=>{ switchSlot('career'); enterZoo(); };
  $('mSandbox').onclick=()=>{ switchSlot('sandbox',()=>newSandbox()); persist(); enterZoo(); };
  const nb=$('mSandboxNew'); if(nb) nb.onclick=()=>{ careerSave.slots.sandbox=null; switchSlot('sandbox',()=>newSandbox()); persist(); enterZoo(); };
  screenEl.querySelectorAll('[data-ch]').forEach(el=>el.onclick=()=>startChallenge(DATA.challenges.find(c=>c.id===el.dataset.ch)));
}

/* =========================================================
   遠征 Boss：霜影首領
   資料在 data/bosses.json；每個首領守在一個路線節點，身邊冰封著一隻稀有生物
   招式：charge 衝撞、nova 寒氣爆發（先蓄力再爆開）、summon 召喚霜影
   ========================================================= */
let boss=null, bossPending=null;
const bossForNode=node=>node&&DATA.bosses?DATA.bosses.find(b=>b.node===node.id):null;
const bossKills=id=>(save.bosses&&save.bosses[id]&&save.bosses[id].kills)||0;
const bossesDefeated=()=>Object.values(save.bosses||{}).filter(b=>b.kills>0).length;

function makeBossMesh(B){
  const g=new THREE.Group(), s=B.size;
  const mat=new THREE.MeshLambertMaterial({color:hex(B.color),transparent:true,opacity:0.88,emissive:0x0a1a2a});
  const eye=new THREE.MeshBasicMaterial({color:hex(B.eye)});
  const body=sph(0.6*s,mat); body.scale.y=1.35; body.position.y=1.5*s; g.add(body);
  const tail=new THREE.Mesh(new THREE.ConeGeometry(0.55*s,1.5*s,12),mat); tail.rotation.x=Math.PI; tail.position.y=0.6*s; g.add(tail);
  for(const k of [-1,1]){ const e=sph(0.09*s,eye); e.position.set(k*0.22*s,1.75*s,0.5*s); g.add(e); }
  const ice=new THREE.MeshPhongMaterial({color:0xcff2ff,shininess:90,emissive:0x1d4a66});
  if(B.look==='horns') for(const k of [-1,1]){ const h=new THREE.Mesh(new THREE.ConeGeometry(0.12*s,0.9*s,8),ice); h.position.set(k*0.4*s,2.2*s,0.1*s); h.rotation.z=-k*0.5; g.add(h); }
  if(B.look==='crown') for(let i=0;i<7;i++){ const a=i/7*Math.PI*2, h=new THREE.Mesh(new THREE.ConeGeometry(0.08*s,0.6*s,6),ice); h.position.set(Math.cos(a)*0.35*s,2.25*s,Math.sin(a)*0.35*s); g.add(h); }
  if(B.look==='shards') for(let i=0;i<5;i++){ const a=i/5*Math.PI*2, h=new THREE.Mesh(new THREE.OctahedronGeometry(0.18*s),ice); h.position.set(Math.cos(a)*0.95*s,1.6*s,Math.sin(a)*0.95*s); h.userData.orbit=a; g.add(h); }
  const aura=new THREE.Sprite(new THREE.SpriteMaterial({map:DOT,color:hex(B.eye),transparent:true,opacity:0.35,depthWrite:false,blending:THREE.AdditiveBlending}));
  aura.scale.set(4.5*s,4.5*s,1); aura.position.y=1.4*s; g.add(aura);
  const ring=new THREE.Mesh(new THREE.RingGeometry(0.85,1,48),new THREE.MeshBasicMaterial({color:hex(B.eye),transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false}));
  ring.rotation.x=-Math.PI/2; ring.position.y=0.15; g.add(ring);
  return {g,mat,ring};
}

/* 在站點放首領：巢穴離火車 55～80 m，旁邊放一隻被封住的稀有生物和兩個彈藥箱 */
function placeBoss(node){
  boss=null; bossPending=null;
  const B=bossForNode(node); if(!B) return;
  const avoid=(x,z)=>(lakeInfo&&Math.hypot(x-lakeInfo.x,z-lakeInfo.z)<lakeInfo.r+6)||warmZones.some(w=>Math.hypot(x-w.x,z-w.z)<w.r+4);
  let lx=0,lz=-70;
  for(let t=0;t<200;t++){ const a=R(0,Math.PI*2), r=R(55,80), x=Math.cos(a)*r, z=Math.sin(a)*r; if(farFromTrain(x,z,10)&&!avoid(x,z)){ lx=x; lz=z; break; } }
  // 巢穴：一圈冰柱
  const ice=new THREE.MeshPhongMaterial({color:0xa8e4ff,transparent:true,opacity:0.75,shininess:90,emissive:0x1d4a66});
  for(let i=0;i<9;i++){ const a=i/9*Math.PI*2+R(-0.2,0.2), r=R(9,12), x=lx+Math.cos(a)*r, z=lz+Math.sin(a)*r, h=R(2,5);
    const c=new THREE.Mesh(new THREE.ConeGeometry(R(0.5,0.9),h,6),ice); c.position.set(x,heightAt(x,z)+h/2-0.2,z); world.add(c); }
  // 被守護的生物
  const st=curStation, cats=(st.ice&&st.ice.categories)||['mammal'];
  let pool=speciesPool(node,cats).filter(s=>s.rarity===B.guard);
  if(!pool.length) pool=DATA.species.filter(s=>s.rarity===B.guard&&cats.includes(s.category)&&((s.model&&MODELS[s.model])||s.body));
  let guarded=null;
  if(pool.length){ const sp=pickWeighted(pool,s=>save.collection[s.id]||coop?1:(DATA.config.undiscoveredBonus||1)); guarded=placeIce(sp,lx+R(-2,2),lz+R(-2,2),R(0,6.28)); guarded.locked=true; }
  // 彈藥箱
  for(let k=0;k<2;k++){ const a=Math.atan2(lz,lx)+Math.PI+(k?0.5:-0.5), x=lx+Math.cos(a)*22, z=lz+Math.sin(a)*22; placeAmmoCache(x,z); }
  const m=makeBossMesh(B), y=heightAt(lx,lz); m.g.position.set(lx,y,lz); world.add(m.g);
  const wm=DATA.config.tiers[node.tier]?DATA.config.tiers[node.tier].wraithMult:1;
  boss={def:B,...m,hp:B.hp,max:B.hp,lair:new THREE.Vector3(lx,y,lz),aggro:false,hit:0,phase:0,
    cd:{charge:B.attacks.charge?B.attacks.charge.every*0.6:0,nova:B.attacks.nova?B.attacks.nova.every*0.5:0,summon:B.attacks.summon?B.attacks.summon.every*0.5:0},
    charging:0,chargeDir:new THREE.Vector3(),windup:0,guarded,announced:false,minions:[],spdMult:Math.sqrt(wm)};
}
function placeAmmoCache(x,z){
  const y=heightAt(x,z), g=new THREE.Group(); g.position.set(x,y,z);
  const c=box(0.8,0.5,0.5,0x3a5a3a); c.position.y=0.25; g.add(c);
  const band=box(0.84,0.08,0.54,0xff9a3c); band.position.y=0.4; g.add(band);

/* 每幀更新（遠征中） */
function updateBoss(dt,inHeat,storm){
  if(!boss||boss.dead) { $('bossBar').hidden=true; return; }
  const b=boss, B=b.def, A=B.attacks, g=b.g, s=B.size;
  b.phase+=dt;
  const tg=netTarget(g.position), dx=tg.x-g.position.x, dz=tg.z-g.position.z, d=Math.max(0.01,Math.hypot(dx,dz));   // 追最近的玩家
  const ldx=player.pos.x-g.position.x, ldz=player.pos.z-g.position.z, ld=Math.max(0.01,Math.hypot(ldx,ldz));
  const fromLair=netMinDist(b.lair);
  if(!b.aggro && fromLair<B.aggro && !tg.inHeat){ b.aggro=true; if(!b.announced){ b.announced=true; toast(`${B.name}醒過來了！${B.desc}`); } }
  if(b.aggro && (fromLair>B.leash || tg.inHeat)){ b.aggro=false; b.windup=0; b.charging=0; }
  const spd=B.speed*b.spdMult*(storm?1.2:1);
  if(b.charging>0){
    b.charging-=dt; g.position.addScaledVector(b.chargeDir,A.charge.speed*dt);
  } else if(b.aggro && b.windup<=0){
    if(d>1.2*s){ g.position.x+=dx/d*spd*dt; g.position.z+=dz/d*spd*dt; }
  } else if(!b.aggro){
    const lx=b.lair.x-g.position.x, lz=b.lair.z-g.position.z, ld=Math.hypot(lx,lz);
    if(ld>2){ g.position.x+=lx/ld*spd*dt; g.position.z+=lz/ld*spd*dt; }
    if(b.hp<b.max && ld<3) b.hp=Math.min(b.max,b.hp+B.regenPerSec*dt);   // 回巢慢慢恢復
  }
  if(distToTrain(g.position.x,g.position.z)<CFG().heatRadius+2*s){ g.position.x-=dx/d*dt*6; g.position.z-=dz/d*dt*6; b.charging=0; }
  if(b.charging<=0) g.rotation.y=Math.atan2(dx,dz);
  g.position.y=heightAt(g.position.x,g.position.z)+Math.sin(b.phase*1.6)*0.3;
  g.children.forEach(c=>{ if(c.userData.orbit!=null){ const a=c.userData.orbit+b.phase*1.2; c.position.x=Math.cos(a)*0.95*s; c.position.z=Math.sin(a)*0.95*s; } });
  // 招式
  if(b.aggro){
    for(const k in b.cd) b.cd[k]-=dt;
    if(A.charge && b.cd.charge<=0 && b.windup<=0 && b.charging<=0 && d>6 && d<28){
      b.cd.charge=A.charge.every; b.charging=A.charge.secs; b.chargeDir.set(dx/d,0,dz/d); toast(`${B.name}衝過來了，往旁邊閃！`);
    }
    if(A.nova && b.cd.nova<=0 && b.windup<=0 && b.charging<=0 && d<A.nova.radius*1.6){ b.cd.nova=A.nova.every; b.windup=A.nova.windup; }
    if(A.summon && b.cd.summon<=0){ b.cd.summon=A.summon.every; for(let i=0;i<A.summon.count;i++) spawnMinion(g.position); }
  }
  // 寒氣爆發：地上的圈越來越大，蓄力完爆開
  if(b.windup>0){
    b.windup-=dt; const k=1-Math.max(0,b.windup)/A.nova.windup, r=A.nova.radius*k;
    b.ring.scale.set(r,r,r); b.ring.material.opacity=0.25+k*0.5;
    if(b.windup<=0){
      b.ring.material.opacity=0.9; setTimeout(()=>{ if(b.ring) b.ring.material.opacity=0; },180);
      coopSend('nova',{node:curNode.id,x:g.position.x,z:g.position.z,r:A.nova.radius,dr:A.nova.drain});
      if(ld<A.nova.radius && !inHeat){ hurt(A.nova.drain*(CFG().wraithTouchMult||1)); hurtT=0.6; player.pos.x+=ldx/ld*2.5; player.pos.z+=ldz/ld*2.5; toast('被寒氣爆發打中了！'); }
    }
  } else b.ring.material.opacity=0;
  // 碰撞
  if(ld<1.1*s && !inHeat){ hurt(B.touchDrain*(CFG().wraithTouchMult||1)*dt); hurtT=0.3; player.pos.x+=ldx/ld*dt*5; player.pos.z+=ldz/ld*dt*5; if(b.charging>0){ hurt(A.charge.hitDrain); b.charging=0; player.pos.x+=ldx/ld*3; player.pos.z+=ldz/ld*3; toast('被撞飛了！'); } }
  if(b.hit>0){ b.hit-=dt; b.mat.emissive.setHex(0x553311); } else b.mat.emissive.setHex(b.windup>0?0x2a4a6a:0x0a1a2a);
  // 血條
  const bar=$('bossBar'); bar.hidden=!(b.aggro||b.hp<b.max) || fromLair>B.leash+20;
  $('bossName').textContent=B.name; $('bossFill').style.width=Math.max(0,b.hp/b.max*100)+'%';
}
function spawnMinion(at){
  if(wraiths.length>=12) return;
  const a=Math.random()*Math.PI*2, x=at.x+Math.cos(a)*4, z=at.z+Math.sin(a)*4;
  if(!netAuth) return; const keep=player.pos.clone(); player.pos.set(x+60,0,z);   // spawnWraith 以玩家為中心，暫時借用位置
  const n=wraiths.length; spawnWraith(); player.pos.copy(keep);
  if(wraiths.length>n){ const w=wraiths[wraiths.length-1]; w.g.position.set(x,heightAt(x,z),z); }
}
/* 彈丸命中檢查，回傳是否打中 */
function bossHitTest(f){
  if(!boss||boss.dead) return false;
  const s=boss.def.size; tmpV.copy(boss.g.position); tmpV.y+=1.4*s;
  if(f.m.position.distanceTo(tmpV)>(weapon.range||1.5)+0.7*s) return false;
  damageBoss(f.dmg||1);
  return true;
}
function defeatBoss(){
  const b=boss, B=b.def; b.dead=true; world.remove(b.g); $('bossBar').hidden=true;
  const first=bossKills(B.id)===0, rw=first?B.reward.first:B.reward.repeat;
  bossPending={id:B.id,reward:rw,first};
  // 掉落物資箱
  for(let i=0;i<B.dropCrates;i++){ const a=i/B.dropCrates*Math.PI*2, x=b.g.position.x+Math.cos(a)*3, z=b.g.position.z+Math.sin(a)*3; addCrate(x,z); }
  if(b.guarded) b.guarded.locked=false;
  for(const w of wraiths) world.remove(w.g); wraiths.length=0;
  toast(`擊敗了${B.name}！${b.guarded?`${b.guarded.species.name}的冰封鬆動了，`:''}旁邊掉了 ${B.dropCrates} 箱物資`);
}
/* 結算時寫入存檔，回傳結算畫面要顯示的文字 */
function bossSettle(){
  if(!bossPending) return '';
  const p=bossPending; bossPending=null;
  save.bosses=save.bosses||{}; const r=save.bosses[p.id]=save.bosses[p.id]||{kills:0};
  r.kills++; if(!r.firstAt) r.firstAt=Date.now();
  pay(p.reward,1);
  const B=DATA.bosses.find(b=>b.id===p.id);
  return `<p class="bossline">擊敗 ${esc(B.name)}${p.first?'（第一次）':''}：獲得 ${esc(costText(p.reward))}</p>`;
}

/* =========================================================
   火車：車廂編組與模組、火車防守、行駛事件
   資料：data/cars.json（車廂、模組、防守數值）、data/events.json（行駛事件）
   ========================================================= */
const CARS=()=>DATA.cars, DEF=()=>DATA.cars.defense;
const carDef=id=>CARS().cars.find(c=>c.id===id);
const modDef=id=>CARS().modules.find(m=>m.id===id);
function ensureTrain(){
  save.train=save.train||{cars:JSON.parse(JSON.stringify(CARS().start))};
  for(const c of save.train.cars){ const d=carDef(c.type); c.mods=c.mods||[]; while(c.mods.length<d.slots) c.mods.push(null); }
  return save.train;
}
/* 把車廂與模組效果加進遠征數值 */
function applyTrainEffects(s){
  ensureTrain();
  const add=e=>{ for(const [k,v] of Object.entries(e||{})){ if(k.endsWith('Mult')) s[k]=(s[k]??1)*v; else s[k]=(s[k]||0)+v; } };
  for(const c of save.train.cars){ add(carDef(c.type).effects); for(const m of c.mods) if(m) add(modDef(m).effects); }
  s.trainHp=(s.trainHp||0)+DEF().baseHp;
  return s;
}

/* ---------- 車廂外觀：依編組重新排列，火車長度跟著變 ---------- */

/* ---------- 火車防守：霜影突襲車廂，砲塔自動開火 ---------- */
let trainHp=100, trainHpMax=100, nextRaid=0, turretCd=[], trainBrokenRun=false, runMods={};
function initTrainDefense(){
  trainHpMax=Math.max(20,STATS.trainHp+(runMods.trainHpDelta||0)); trainHp=trainHpMax;
  nextRaid=DEF().firstRaidAt; turretCd=Array.from({length:STATS.turrets||0},(_,i)=>i*0.3); trainBrokenRun=false;
}
function spawnRaid(){
  const D=DEF(), n=D.raidSize[0]+Math.floor(Math.random()*(D.raidSize[1]-D.raidSize[0]+1));
  const keep=player.pos.clone();
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, r=40+Math.random()*12, cz=(TRAIN_Z0+TRAIN_Z1)/2, x=Math.cos(a)*r, z=cz+Math.sin(a)*r;
    player.pos.set(x+60,0,z); const k=wraiths.length; spawnWraith();
    if(wraiths.length>k){ const w=wraiths[wraiths.length-1]; w.g.position.set(x,heightAt(x,z),z); w.raid=true; w.mat.color.setHex(0x2a1418); }
  }
  player.pos.copy(keep);
  toast(`霜影正在突襲火車！${STATS.turrets?'砲塔會幫忙，':''}快回去守住車廂`);
}
/* 突襲的霜影：直衝火車、抓車廂 */
function raidStep(w,dt){
  const g=w.g; w.phase+=dt;
  const tz=Math.max(TRAIN_Z0,Math.min(TRAIN_Z1,g.position.z)), tx=Math.sign(g.position.x||1)*1.8;
  const dx=tx-g.position.x, dz=tz-g.position.z, d=Math.hypot(dx,dz);
  if(d>0.6){ const s=DATA.config.wraith.speed*(w.spd||1)*dt; g.position.x+=dx/d*s; g.position.z+=dz/d*s; }
  else { trainHp-=DEF().raidTouchDamage*dt; trainHitT=0.3; }
  g.rotation.y=Math.atan2(dx,dz); g.position.y=heightAt(g.position.x,g.position.z)+Math.sin(w.phase*2)*0.25;
  if(w.hit>0){ w.hit-=dt; w.mat.emissive.setHex(0x553311); } else w.mat.emissive.setHex(0x2a0a0a);
  const pd=Math.hypot(player.pos.x-g.position.x,player.pos.z-g.position.z);
  if(pd<1.5){ hurt(DATA.config.wraith.touchDrainPerSec*0.5*(CFG().wraithTouchMult||1)*dt); hurtT=0.3; }
}
let trainHitT=0;
function updateTrainDefense(dt,elapsed){
  const D=DEF();
  if(netAuth&&elapsed>nextRaid){ spawnRaid(); nextRaid=elapsed+D.raidEvery*(timeLeft<=0?0.6:1); }
  // 砲塔
  for(let i=0;i<turretCd.length;i++){
    turretCd[i]-=dt; if(turretCd[i]>0) continue;
    let best=null,bd=D.turretRange;
    for(const w of wraiths){ const dd=distToTrain(w.g.position.x,w.g.position.z); if(dd<bd){ bd=dd; best=w; } }
    if(!best) continue; turretCd[i]=D.turretCooldown;   // 砲塔打中的傷害也走 damageEnemy
    const from=new THREE.Vector3(0,5,Math.max(TRAIN_Z0,Math.min(TRAIN_Z1,best.g.position.z))-i*2);
    const to=best.g.position.clone().setY(best.g.position.y+1.3), dir=to.sub(from).normalize();
    const m=sph(0.12,flareMat); m.position.copy(from); world.add(m);
    flares.push({m,v:dir.multiplyScalar(45),life:1.2,dmg:D.turretDamage,grav:0});
  }
  if(trainHitT>0) trainHitT-=dt;
  const el=$('trainHp'); el.textContent=`火車耐久 ${Math.max(0,Math.ceil(trainHp))}/${trainHpMax}`; el.className='num'+(trainHp<trainHpMax*0.35?' warn':'')+(trainHitT>0?' hit':'');
  if(trainHp<=0) trainBroken();
}
function trainBroken(){
  trainBrokenRun=true; const f=DEF().brokenLossFraction;
  depositAll(); for(const k in haul) haul[k]=Math.floor(haul[k]*(1-f));
  boardFollowers(); boardContainer();
  finish(true);
}

/* ---------- 行駛事件：出發後、抵達前 ---------- */
function travelEvent(node,go){
  runMods={};

  if(!E||node.type==='stall'||Math.random()>E.chance){ go(); return; }
  const ev=E.events[Math.floor(Math.random()*E.events.length)];

  state='event'; screenEl.hidden=false; $('zooUI').hidden=true;

    <div class="evopts">${ev.options.map((o,i)=>`<button type="button" class="btn ghost" data-ev="${i}" ${can(o)?'':'disabled'}>${esc(o.label)}${o.cost?`<small>${esc(costText(o.cost))}</small>`:''}${o.need&&!can(o)?'<small>需要砲塔</small>':''}</button>`).join('')}</div></div>`;
  screenEl.querySelectorAll('[data-ev]').forEach(el=>el.onclick=()=>{
    const o=ev.options[+el.dataset.ev]; if(!can(o)) return;
    if(o.cost) pay(o.cost,-1);

    if(o.gain){ const g={...o.gain}; if(g.species){ const pool=DATA.species.filter(s=>s.rarity===g.species&&s.spawn.length); const sp=pool[Math.floor(Math.random()*pool.length)];
        if(sp){ ensureZoo(); save.collection[sp.id]=(save.collection[sp.id]||0)+1; save.zoo.unplaced[sp.id]=(save.zoo.unplaced[sp.id]||0)+1; extra=`（${sp.name}）`; } delete g.species; }
      pay(g,1); }
    Object.assign(runMods,o.effects||{}); persist();
    screenEl.innerHTML=`<div class="card"><h2>${esc(ev.title)}</h2><p>${esc(o.result)}${esc(extra)}</p><div class="btns"><button class="btn" id="evGo" type="button">繼續前往${esc(node.name)}</button></div></div>`;
    $('evGo').onclick=()=>go();
  });
}

/* 遠程敵人的冰刺 */
let eShots=[];
const shardMat=new THREE.MeshBasicMaterial({color:0xc8f4ff});
function enemyRanged(w,d,dx,dz,dt,inHeat,tg){
  const R=w.def.ranged, g=w.g; w.rcd=(w.rcd??R.every*Math.random())-dt;
  if(d<R.keep){ g.position.x-=dx/d*dt*2.5; g.position.z-=dz/d*dt*2.5; }
  if(d<R.range&&!inHeat&&w.rcd<=0){
    w.rcd=R.every; const from=g.position.clone().setY(g.position.y+1.4), to=tg?new THREE.Vector3(tg.x,heightAt(tg.x,tg.z)+1.3,tg.z):player.pos.clone().setY(player.pos.y+1.3), dir=to.sub(from).normalize();
    const m=new THREE.Mesh(new THREE.ConeGeometry(0.08,0.5,5),shardMat); m.position.copy(from); m.lookAt(from.clone().add(dir)); m.rotateX(Math.PI/2); world.add(m);
    eShots.push({m,v:dir.multiplyScalar(R.speed),life:2,drain:R.drain});
    if(coop&&netPeersHere().length){ const v=eShots[eShots.length-1].v; coopSend('shot',{node:curNode.id,p:[from.x,from.y,from.z],v:[v.x,v.y,v.z],dr:R.drain}); }
  }
  return d<R.range;   // 在射程內就不再往前衝
}
function updateEnemyShots(dt){
  for(let i=eShots.length-1;i>=0;i--){
    const s=eShots[i]; s.life-=dt; s.m.position.addScaledVector(s.v,dt);
    const hit=Math.hypot(s.m.position.x-player.pos.x,s.m.position.z-player.pos.z)<0.8&&Math.abs(s.m.position.y-(player.pos.y+1.2))<1.2;
    if(hit){ hurt(s.drain*(CFG().wraithTouchMult||1)); hurtT=0.4; }
    if(hit||s.life<=0){ world.remove(s.m); eShots.splice(i,1); }
  }
}

function meleeAttack(){

/* ---------- 料理 ---------- */
const FOOD=()=>DATA.food;
let foodBuffs=[], runElapsed=0;
const foodStock=()=>(save.food=save.food||{});
const foodCount=()=>Object.values(foodStock()).reduce((a,b)=>a+b,0);
function eatFood(){
  if(state!=='play') return;
  const r=FOOD().recipes.find(r=>foodStock()[r.id]>0);
  if(!r){ toast('身上沒有料理。有廚房車廂的話，可以在工坊做料理'); return; }
  if(foodBuffs.some(b=>b.id===r.id)){ toast(`${r.name}的效果還在`); return; }
  foodStock()[r.id]--;
  const map={walkSpeedMult:'walkSpeed',sprintSpeedMult:'sprintSpeed',catchSpeedMult:'catchSpeed'}, applied=[];
  for(const [k,v] of Object.entries(r.effects)){ const key=map[k]||k; const before=STATS[key]??1; STATS[key]=before*v; applied.push([key,before]); }
  foodBuffs.push({id:r.id,name:r.name,until:runElapsed+r.seconds*(STATS.foodDurationMult||1),applied});
  toast(`吃了${r.name}：${r.desc}`);
}
function updateFood(dt){
  runElapsed+=dt;
  for(let i=foodBuffs.length-1;i>=0;i--){ const b=foodBuffs[i]; if(runElapsed<b.until) continue;
    for(const [k,v] of b.applied) STATS[k]=v; foodBuffs.splice(i,1); toast(`${b.name}的效果消失了`); }
  const el=$('buffTag'); el.hidden=!foodBuffs.length&&!foodCount();
  el.textContent=(foodBuffs.length?foodBuffs.map(b=>`${b.name} ${Math.ceil(b.until-runElapsed)}s`).join('・'):'')+(foodCount()?`${foodBuffs.length?'・':''}料理 ${foodCount()}（${isTouch?'吃':'Q'}）`:'');
}

/* ---------- 地下碉堡 ---------- */
let vault=null;
function placeVault(node,avoid){
  vault=null;
  if(!node.vault||rng()>node.vault) return;
  let vx=null,vz=null;
  for(let t=0;t<200;t++){ const a=R(0,Math.PI*2), r=R(50,105), x=Math.cos(a)*r, z=Math.sin(a)*r;
    if(farFromTrain(x,z,14)&&!avoid(x,z)&&!(boss&&Math.hypot(boss.lair.x-x,boss.lair.z-z)<30)){ vx=x; vz=z; break; } }
  if(vx==null) return;
  const W=14, D=22, H=3.2, y=heightAt(vx,vz), con=M(0x55595e), dark=M(0x2a2c30);
  const wall=(cx,cz,w,d)=>{ const m=box(w,H,d,con); m.position.set(cx,y+H/2-0.2,cz); world.add(m); colliders.push({x0:cx-w/2,x1:cx+w/2,z0:cz-d/2,z1:cz+d/2}); };
  // 外牆（南側留門）
  wall(vx,vz-D/2,W,0.5); wall(vx-W/2,vz,0.5,D); wall(vx+W/2,vz,0.5,D);
  wall(vx-W/4-1,vz+D/2,W/2-2,0.5); wall(vx+W/4+1,vz+D/2,W/2-2,0.5);
  // 內牆
  wall(vx-W/4-1.5,vz+2,W/2-3,0.4); wall(vx+W/4+1.5,vz-4,W/2-3,0.4);
  const roof=box(W+0.6,0.4,D+0.6,dark); roof.position.set(vx,y+H,vz); world.add(roof);

/* =========================================================
   動物照護細節：棲地需求、豐富化、圍欄與脫逃、基因、打架與避孕
   數值在 config.care；豐富化物件是 props.json 裡 cat 為 enrich 的物件
   ========================================================= */
const CARE=()=>DATA.config.care;
/* ---------- 棲地環境：從地形、水、物件、周圍步道算出來 ---------- */
function habitatRect(b){ if(b.poly){ const xs=b.poly.map(p=>p[0]), zs=b.poly.map(p=>p[1]); return {x0:Math.min(...xs),x1:Math.max(...xs),z0:Math.min(...zs),z1:Math.max(...zs),tiles:polyArea(b.poly)/(TS()*TS()),poly:b.poly}; }
  const d=bdef(b.type), c=tileCenter(b), hw=d.size[0]*TS()/2, hd=d.size[1]*TS()/2; return {x0:c.x-hw,x1:c.x+hw,z0:c.z-hd,z1:c.z+hd,tiles:d.size[0]*d.size[1]}; }
let envCache=new Map(), envCacheT=-1;
function habitatEnv(b){
  const key=b.uid; if(envCacheT===zEnvStamp&&envCache.has(key)) return envCache.get(key);
  if(envCacheT!==zEnvStamp){ envCache.clear(); envCacheT=zEnvStamp; }
  const r=habitatRect(b), T=save.zoo.terrain, paints=TRN().paints, cnt=new Array(paints.length).fill(0); let water=0, n=0;
  const defPaint=paints.findIndex(p=>p.id===bdef(b.type).groundPaint);   // 沒上色的地方算棲地本身的地面
  if(T) for(let x=r.x0+0.5;x<r.x1;x+=1) for(let z=r.z0+0.5;z<r.z1;z+=1){
    if(r.poly&&!pointInPoly(x,z,r.poly)) continue;
    const {fi,fj}=terrXY(x,z), i=Math.round(fi), j=Math.round(fj); if(i<0||j<0||i>=zTerrN||j>=zTerrN) continue;
    n++; if(T.h[tIdx(i,j)]<TRN().waterLevel) water++; else { const pi=T.p[tIdx(i,j)]||0; cnt[pi===0&&defPaint>=0?defPaint:pi]++; }
  }
  const inside=(save.zoo.props||[]).filter(p=>p.x>r.x0&&p.x<r.x1&&p.z>r.z0&&p.z<r.z1&&(!r.poly||pointInPoly(p.x,p.z,r.poly)));
  const foliage=inside.filter(p=>{ const d=pdef(p.type); return d&&d.cat==='nature'&&!/rock|log|stump/.test(d.kind); }).length;
  const shelter=inside.some(p=>{ const d=pdef(p.type); return d&&(/rock_l|log|stump|cave/.test(d.kind)||(d.likes&&d.likes.shelter)||/wall|roof/.test(d.kind)); });
  const enrich=[...new Set(inside.map(p=>pdef(p.type)).filter(d=>d&&d.cat==='enrich').map(d=>d.id))];
  // 遊客壓力：棲地外圍一格內的步道與設施格數 / 周長
  const d=bdef(b.type); let edge=0;
  for(const o of save.zoo.buildings){ const od=bdef(o.type); if(od.kind!=='path'&&od.kind!=='facility') continue;
    for(let ox=o.x;ox<o.x+od.size[0];ox++) for(let oz=o.z;oz<o.z+od.size[1];oz++)
      if(ox>=b.x-1&&ox<=b.x+d.size[0]&&oz>=b.z-1&&oz<=b.z+d.size[1]&&!(ox>=b.x&&ox<b.x+d.size[0]&&oz>=b.z&&oz<b.z+d.size[1])) edge++; }
  const per=2*(d.size[0]+d.size[1])+4;
  const br=b.poly?barrierDef(b.barrier):null, leak=br&&!br.watertight;   // 不防水的圍欄：水會漏掉
  const env={tiles:r.tiles,ground:Object.fromEntries(paints.map((p,i)=>[p.id,n?cnt[i]/n:0])),water:n&&!leak?water/n:0,leak:leak&&water>0,foliage,foliageDensity:foliage/(r.tiles/4),shelter,enrich,pressure:Math.min(1,edge/per)*(br?(br.oneway?0:br.opaque?0.3:1):1)};
  envCache.set(key,env); return env;
}
let zEnvStamp=0; const envDirty=()=>{ zEnvStamp++; };
/* ---------- 物種需求（從類別、體型、展區、名稱推出來，不必逐一填資料） ---------- */
function speciesNeeds(sp){
  const C=CARE(), size=(sp.body&&sp.body.size)||1;
  const space=sp.category==='bird'?1.5:sp.category==='mammal'?(size<0.7?2:size<1.2?3:size<1.8?5:8):1;
  return { space, ground:C.groundByZone[sp.zone]||C.groundByZone._default,
    water:C.waterNames.some(k=>sp.name.includes(k)), foliage:C.foliageByZone[sp.zone]??C.foliageByZone._default,
    shelter:sp.social==='獨居'||sp.rarity==='endangered'||sp.rarity==='legendary', shy:sp.social==='獨居',
    solitary:sp.social==='獨居' };
}
/* 回傳這種動物在這座棲地的每項需求檢查 */
function habitatChecks(b,sp){
  const d=bdef(b.type), C=CARE(), P=C.needPenalty, env=habitatEnv(b), need=speciesNeeds(sp), list=[];
  const same=save.zoo.animals.filter(a=>a.habitat===b.uid&&a.species===sp.id), adults=same.filter(isAdult).length;
  const used=save.zoo.animals.filter(a=>a.habitat===b.uid).reduce((s,a)=>s+speciesNeeds(DATA.speciesById[a.species]).space*(isAdult(a)?1:0.5),0);
  list.push({k:'space',label:`空間 已用 ${Math.ceil(used)}/${Math.round(env.tiles)} 格`,ok:used<=env.tiles,pen:P.space*Math.min(1,Math.max(0,used/env.tiles-1))});
  if(!d.indoor){
    const g=need.ground.reduce((s,id)=>s+(env.ground[id]||0),0);
    const gn=need.ground.map(id=>TRN().paints.find(p=>p.id===id).name).join('、');
    list.push({k:'ground',label:`地面要${gn}（${Math.round(g*100)}%）`,ok:g>=C.groundNeed,pen:g>=C.groundNeed?0:P.ground});
    if(need.water) list.push({k:'water',label:`要有水（${Math.round(env.water*100)}%）${env.leak?'・圍欄不防水，水都漏光了':''}`,ok:env.water>=C.waterNeed,pen:env.water>=C.waterNeed?0:P.water});
    if(need.foliage) list.push({k:'foliage',label:`植物 ${env.foliage} 株（需要 ${Math.ceil(need.foliage*env.tiles/4)}）`,ok:env.foliageDensity>=need.foliage,pen:env.foliageDensity>=need.foliage?0:P.foliage});
    list.push({k:'pressure',label:`遊客壓力 ${Math.round(env.pressure*100)}%`,ok:env.pressure<=(need.shy?0.5:0.85),pen:env.pressure<=(need.shy?0.5:0.85)?0:P.pressure});
  }
  const sc=singleCheck(b); if(sc) list.push(sc);
  if(need.shelter) list.push({k:'shelter',label:'需要躲藏處（大石頭、木頭、岩洞、牆）',ok:env.shelter,pen:env.shelter?0:P.shelter});
  if(need.solitary&&adults>1){ const pair=same.filter(isAdult).every(a=>true)&&adults===2&&same.filter(isAdult).some(a=>a.sex==='M')&&same.filter(isAdult).some(a=>a.sex==='F');
    list.push({k:'solitary',label:'獨居動物，太多隻住一起會有壓力',ok:pair,pen:pair?0:P.solitary}); }
  return list;
}
function enrichBonus(b,sp){
  const C=CARE(), env=habitatEnv(b);
  const liked=env.enrich.map(id=>pdef(id)).filter(d=>{ const L=d.likes||{}; return (!L.cats||L.cats.includes(sp.category))&&(!L.diets||L.diets.some(x=>(sp.diet||'').includes(x)))&&(!L.bodies||L.bodies.includes(sp.body&&sp.body.type)); });
  return {n:liked.length,bonus:Math.min(C.enrichMax,liked.length*C.enrichPerItem),names:liked.map(d=>d.name)};
}
/* 給 simulate 用：需求扣分 − 豐富化加分 */
function careHappyDelta(a,b){
  const sp=DATA.speciesById[a.species]; if(!sp) return 0;
  const pen=Math.min(30,habitatChecks(b,sp).reduce((s,c)=>s+c.pen,0));
  return enrichBonus(b,sp).bonus-pen;
}

/* ---------- 圍欄與脫逃 ---------- */
const fenceLv=b=>b.poly?barrierDef(b.barrier).grade:(b.fence||1);
const climbGap=(b,sp)=>b.poly&&sp.body&&sp.body.type==='primate'&&!barrierDef(b.barrier).climbproof?1:0;
function fenceNeed(sp){ const size=(sp.body&&sp.body.size)||1;
  if(sp.body&&sp.body.type==='primate') return 3;
  if(sp.category!=='mammal') return 1;
  if(size>=1.6||((sp.diet||'').includes('肉')&&size>=1)) return 2;
  return 1; }
let zooEscapeLog=[];
function escapeStep(min){
  const z=save.zoo, C=CARE(); z.escaped=z.escaped||[];
  for(const a of [...z.animals]){
    const b=findB(a.habitat), sp=DATA.speciesById[a.species]; if(!b||!sp||bdef(b.type).indoor) continue;
    const gap=Math.max(0,fenceNeed(sp)-fenceLv(b))+climbGap(b,sp), p=gap*C.escapePerMinPerLevel+(isWorking(b)?0:C.escapeBrokenPerMin);
    if(p>0&&Math.random()<p*min){ z.animals.splice(z.animals.indexOf(a),1); delete a.preg; a.escapedAt=z.clock; a.from=b.uid; z.escaped.push(a); zooEscapeLog.push(a); }
  }
  // 保全與飼育員把逃走的動物抓回來
  const rate=(staffCount('security')*C.recapturePerSecurity+staffCount('keeper')*C.recapturePerKeeper)*min;
  for(const a of [...z.escaped]){
    if(Math.random()<rate){ z.escaped.splice(z.escaped.indexOf(a),1); const b=findB(a.from); const room=b&&z.animals.filter(x=>x.habitat===b.uid).length<bdef(b.type).capacity;
      if(room){ a.habitat=b.uid; z.animals.push(a); } else { a.habitat=null; z.stored.push(a); } toast(`${nameOf(a)} 被抓回來了`); }
    else if(z.clock-a.escapedAt>C.escapeLostMinutes){ z.escaped.splice(z.escaped.indexOf(a),1); toast(`${nameOf(a)} 跑進荒野，再也找不到了`); }
  }
}
const escapeAttract=()=>Math.pow(CARE().escapeAttractMult,(save.zoo.escaped||[]).length);

/* ---------- 基因：體型、壽命、生育力、免疫力（0～100） ---------- */
const GENE_KEYS=[['size','體型'],['life','壽命'],['fert','生育'],['immune','免疫']];
function rollGenes(stars){ const g={}; for(const [k] of GENE_KEYS) g[k]=Math.max(5,Math.min(100,Math.round(stars*16+12+(Math.random()*2-1)*15))); return g; }
function inheritGenes(m,f,inbred){ const C=CARE().genes, g={};
  for(const [k] of GENE_KEYS){ const pm=(m.genes||rollGenes(m.stars||2))[k], pf=(f.genes||rollGenes(f.stars||2))[k];
    g[k]=Math.max(5,Math.min(100,Math.round((pm+pf)/2+(Math.random()*2-1)*C.mutation-(inbred?C.inbreedLoss:0)))); }
  return g; }
const gene=(a,k)=>(a.genes&&a.genes[k])??50;
const geneSizeMult=a=>0.85+gene(a,'size')/100*0.3;
const geneLifeMult=a=>0.8+gene(a,'life')/100*0.4;
const geneFertMult=a=>0.5+gene(a,'fert')/100;
const geneSickMult=a=>1.5-gene(a,'immune')/100;
const genesTxt=a=>GENE_KEYS.map(([k,n])=>`${n} ${gene(a,k)}`).join('・');

/* ---------- 打架 ---------- */
function fightStep(min){
  const z=save.zoo, C=CARE(), groups=new Map();
  for(const a of z.animals){ if(!isAdult(a)) continue; const k=a.habitat+'|'+a.species; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(a); }
  for(const list of groups.values()){
    const m=list.filter(a=>a.sex==='M'), f=list.length-m.length; if(m.length<2) continue;
    const sp=DATA.speciesById[list[0].species];
    if(!(sp.social==='獨居'||m.length>Math.max(1,f))) continue;
    if(Math.random()<C.fightChancePerMin*min*(m.length-1)){ const v=m[Math.floor(Math.random()*m.length)];
      v.happy=Math.max(0,(v.happy??60)-C.fightHappy); v.health=Math.max(5,(v.health??100)-C.fightHealth);
      v.fightUntil=(z.clock||0)+1; toast(`${sp.name}的公獸打架了，${nameOf(v)} 受了傷。公的太多時，可以移出幾隻`); }
  }
}

/* ---------- 棲地面板用的 HTML ---------- */
function habitatCareHtml(b){

/* =========================================================
   園區經營細節：交易中心、園內小火車、水電、員工（訓練・薪資・士氣・指派）、
   遊客（想法・退票・捐款箱）、行銷活動與貸款
   數值在 config.biz；建築在 buildings.json（kind: utility / transport）
   ========================================================= */
const BIZ=()=>DATA.config.biz;
function ensureBiz(){
  const z=save.zoo; if(!z) return;
  z.cp=z.cp||0; z.staffLv=z.staffLv||{}; z.wage=z.wage||1; z.morale=z.morale??70; z.assign=z.assign||{};
  z.market=z.market||{offers:[],refreshAt:0};
}
const bizStats={power:{supply:0,demand:0,ratio:1},water:{supply:0,demand:0,ratio:1},bill:0,rides:0,donations:0,refund:0,loanPay:0,thoughts:[],campaign:1,tram:false};

/* ---------- 員工：訓練、薪資、士氣 ---------- */
const staffLv=id=>(save.zoo.staffLv&&save.zoo.staffLv[id])||1;
function staffEff(id){ const B=BIZ(); return (1+(staffLv(id)-1)*B.trainBonus)*(0.6+0.4*Math.min(1.2,(save.zoo.morale??70)/70)); }
const staffPower=id=>staffCount(id)*staffEff(id);
function moraleStep(min){
  const z=save.zoo, B=BIZ();
  const target=Math.max(0,Math.min(100,55+(z.wage-1)*160+(opsStats.unpaid?-45:0)-restPenalty()));
  z.morale+=(target-z.morale)*Math.min(1,min*0.05);
  if(z.morale<B.quitBelow&&totalStaff()>1&&Math.random()<B.quitChancePerMin*min){
    const ids=Object.keys(z.staff).filter(id=>z.staff[id]>0); const id=ids[Math.floor(Math.random()*ids.length)];
    z.staff[id]--; toast(`一位${DATA.staffById[id].name}因為士氣太低辭職了。調高薪資可以留住員工`);

}
/* 飼育員指派：指派到棲地的飼育員優先照顧那裡 */
function habitatCoverage(b){ return (bizStats.habCov&&bizStats.habCov.get(b.uid))??opsStats.coverage; }
function computeHabCov(){
  const z=save.zoo, cap=DATA.staffById.keeper.capacity*RF().keeperCapacityMult*(opsStats.unpaid?0.5:1)*staffEff('keeper');
  const map=new Map(); let free=Math.max(0,staffCount('keeper')-Object.values(z.assign).reduce((a,b)=>a+b,0))*cap, rest=0;
  for(const b of z.buildings){ if(bdef(b.type).kind!=='habitat') continue; const n=z.animals.filter(a=>a.habitat===b.uid).length; if(!n) continue;
    const own=(z.assign[b.uid]||0)*cap; map.set(b.uid,Math.min(1,own/n)); if(own<n) rest+=n-own; }
  const share=rest?Math.min(1,free/rest):1;
  for(const [uid,c] of map) map.set(uid,(c<1?Math.min(1,c+(1-c)*share):c)*hutFactor(findB(uid)));
  bizStats.habCov=map;
}

/* ---------- 水電 ---------- */
function utilityStep(min){
  const z=save.zoo, B=BIZ(); let ps=B.gatePower, ws=B.gateWater, pd=0, wd=0, fuel=0;
  for(const b of z.buildings){ const d=bdef(b.type);
    if(d.kind==='utility'&&isWorking(b)){ if(d.util==='power'){ ps+=d.supply; fuel+=d.fuelPerMin||0; } else ws+=d.supply; }
    pd+=d.power||0;
    if(d.kind==='habitat'&&(d.water||z.animals.some(a=>a.habitat===b.uid&&speciesNeeds(DATA.speciesById[a.species]||{}).water))) wd+=1;
  }
  // 發電機燒煤；沒煤就停
  if(fuel>0){ z.powerFuelDebt=(z.powerFuelDebt||0)+fuel*min; while(z.powerFuelDebt>=1&&(save.resources.fuel||0)>0){ save.resources.fuel--; z.powerFuelDebt--; }
    if((save.resources.fuel||0)<=0&&z.powerFuelDebt>=1){ ps-=z.buildings.filter(b=>bdef(b.type).util==='power'&&bdef(b.type).fuelPerMin).reduce((s,b)=>s+bdef(b.type).supply,0); } }
  bizStats.power={supply:ps,demand:pd,ratio:pd?Math.min(1,ps/pd):1};
  bizStats.water={supply:ws,demand:wd,ratio:wd?Math.min(1,ws/wd):1};
  bizStats.bill=pd*B.powerBillPerUnitMin; z.coins-=bizStats.bill*min;
}
function utilityPenalty(a,b){
  const d=bdef(b.type); let p=0;
  if(d.house&&bizStats.power.ratio<1) p+=BIZ().outagePenalty*(1-bizStats.power.ratio);
  if(bizStats.water.ratio<1&&(d.water||speciesNeeds(DATA.speciesById[a.species]||{}).water)) p+=BIZ().dirtyWaterPenalty*(1-bizStats.water.ratio);
  return p;
}

function bizEconomy(visitors,ticketIncome,min){
  const z=save.zoo, B=BIZ();
  const stations=z.buildings.filter(b=>bdef(b.type).kind==='transport'&&isWorking(b)).length;
  bizStats.tram=stations>=2;
  bizStats.rides=bizStats.tram?visitors*B.rideShare*B.rideFare*bizStats.power.ratio:0;
  const boxes=Math.min(B.donationMaxBoxes,(z.props||[]).filter(p=>p.type==='donation_box').length);
  bizStats.donations=boxes*visitors*B.donationPerVisitorMin*(1+(opsStats.parts.rating?opsStats.parts.rating.conservation:0)/100);
  const sat=opsStats.satisfaction;
  bizStats.refund=sat<B.refundBelow?ticketIncome*(B.refundBelow-sat)/(B.refundBelow*2):0;
  // 貸款
  bizStats.loanPay=0;
  if(z.loan&&z.loan.left>0){ const pay=Math.min(z.loan.left,z.loan.perMin*min); z.loan.left-=pay; bizStats.loanPay=pay/Math.max(min,1e-6); z.coins-=pay; if(z.loan.left<=0){ z.loan=null; toast('貸款還清了'); } }
  z.coins+=(bizStats.rides+bizStats.donations-bizStats.refund)*min;
  thoughtsUpdate(visitors);
}

let bubbleT=0, bubbles=[];
function bubbleSprite(text,good){
  const c=document.createElement('canvas'); c.width=512; c.height=96; const x=c.getContext('2d');
  x.fillStyle=good?'rgba(230,250,232,.92)':'rgba(255,240,228,.92)'; x.strokeStyle='rgba(0,0,0,.25)'; x.lineWidth=3;
  if(x.roundRect){ x.beginPath(); x.roundRect(4,4,504,80,28); x.fill(); x.stroke(); } else x.fillRect(4,4,504,80);
  x.fillStyle='#1a1d22'; x.font='bold 34px sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(text,256,46);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false})); s.scale.set(4,0.75,1); return s;
}
function updateBubbles(dt){
  bubbleT-=dt; if(!Q().bubbles){ for(const b of bubbles) b.p.m.remove(b.s); bubbles=[]; return; }
  for(let i=bubbles.length-1;i>=0;i--){ const b=bubbles[i]; b.life-=dt; if(b.life<=0||!b.p.m.parent){ b.p.m.remove(b.s); bubbles.splice(i,1); } }
  if(bubbleT>0||!zooPeople.length||!bizStats.thoughts.length) return;
  bubbleT=2.5; const p=zooPeople[Math.floor(Math.random()*zooPeople.length)], t=bizStats.thoughts[Math.floor(Math.random()*bizStats.thoughts.length)];
  if(bubbles.some(b=>b.p===p)) return;
  let s; try{ s=bubbleSprite(t.t,t.good); }catch(e){ return; } s.position.y=2.1; p.m.add(s); bubbles.push({p,s,life:4});
}

/* ---------- 園內小火車：在車站之間的高架軌道上繞圈 ---------- */
let tramGroup=null, tramCar=null, tramPath=[], tramS=0;
function rebuildTram(){
  if(tramGroup) zooRoot.remove(tramGroup); tramGroup=null; tramCar=null; tramPath=[];
  const st=save.zoo.buildings.filter(b=>bdef(b.type).kind==='transport').sort((a,b)=>a.uid<b.uid?-1:1).map(tileCenter);
  if(st.length<2) return;
  tramGroup=new THREE.Group(); zooRoot.add(tramGroup); const H=3.4, rail=M(0x4a4f56);
  const pts=st.map(c=>new THREE.Vector3(c.x,H,c.z)); if(pts.length>2) pts.push(pts[0].clone());
  for(let i=0;i<pts.length-1;i++){ const a=pts[i], b=pts[i+1], L=a.distanceTo(b), mid=a.clone().add(b).multiplyScalar(0.5);
    const beam=box(0.5,0.25,L,rail); beam.position.copy(mid); beam.lookAt(b); tramGroup.add(beam);
    for(let k=1;k<Math.floor(L/6);k++){ const p=a.clone().lerp(b,k/Math.floor(L/6)); const pl=box(0.3,H,0.3,rail); pl.position.set(p.x,ZH(p.x,p.z)+H/2,p.z); tramGroup.add(pl); } }
  tramPath=pts.length>2?pts:[pts[0],pts[1],pts[0].clone()];
  tramCar=new THREE.Group(); const body=box(1.4,1.2,3,0xc8402a); body.position.y=0.8; tramCar.add(body);
  const roof=box(1.5,0.15,3.1,0xf2efe6); roof.position.y=1.5; tramCar.add(roof);
  for(const s of [-1,1]) for(let k=-1;k<=1;k++){ const w=box(0.05,0.45,0.6,new THREE.MeshBasicMaterial({color:0xffe8b0})); w.position.set(s*0.72,1.0,k*0.9); tramCar.add(w); }
  tramGroup.add(tramCar);
}
function updateTram(dt){
  if(!tramCar||tramPath.length<2) return;
  let total=0; const seg=[]; for(let i=0;i<tramPath.length-1;i++){ const L=tramPath[i].distanceTo(tramPath[i+1]); seg.push(L); total+=L; }
  tramS=(tramS+dt*4*bizStats.power.ratio)%total; let s=tramS, i=0; while(s>seg[i]){ s-=seg[i]; i++; }
  const a=tramPath[i], b=tramPath[i+1], p=a.clone().lerp(b,s/seg[i]);
  tramCar.position.set(p.x,p.y+0.15,p.z); tramCar.lookAt(b.x,p.y+0.15,b.z);
}

function refreshMarket(force){
  const z=save.zoo, B=BIZ(); ensureBiz();
  if(!force&&(z.clock||0)<z.market.refreshAt&&z.market.offers.length) return;
  const pool=DATA.species.filter(s=>s.spawn&&s.spawn.length&&((s.model&&MODELS[s.model])||s.body)), offers=[];
  const w={common:10,rare:5,endangered:2,legendary:0.4};
  while(offers.length<B.marketOffers&&pool.length){ let r=Math.random()*pool.reduce((s,x)=>s+(w[x.rarity]||0),0), pick=pool[0];
    for(const x of pool){ r-=(w[x.rarity]||0); if(r<=0){ pick=x; break; } }
    if(offers.some(o=>o.species===pick.id)) continue;
    const pr=B.prices[pick.rarity], stars=rollStars(pick), sex=Math.random()<0.5?'M':'F';
    offers.push({id:'o'+Math.random().toString(36).slice(2,8),species:pick.id,sex,stars,cost:{coins:Math.round(pr.coins*(0.7+stars*0.15)),...(pr.cp?{cp:pr.cp}:{})}}); }

}

function worldTime(){

/* =========================================================

   - 資料存在 Supabase 的 coop_zoos；成員在 coop_members
   - 在線成員中排序第一的人當「主機」：只有主機跑模擬，每隔幾秒把園區狀態廣播給其他人
   - 其他人的操作（蓋建築、放動物、雇員工…）算成差異送給主機合併
   - 只有一人在線時就是主機；沒人在線時暫停，下次有人上線時補算（最多 8 小時）
   ========================================================= */
let coopZoo=null;   // {id,code,name,ch,host,members,base,gotSnap,uid,dbT,snapT}
const CZ_LIST={buildings:'uid',props:'uid',animals:'id',stored:'id',escaped:'id'};
const CZ_WHOLE=['terrain','unplaced','staff','ticket','assign','market','campaign','loan','tech','know','cons','wage','staffLv','memorial','ach'];
const CZ_DELTA=['coins','research','cp'];
const CZ_SAVE_WHOLE=['upgrades','gear','train','map','lore','food','bosses'];
const czKey=()=>coopId+'-'+((sbUser&&sbUser.id)||'x');
const jsonEq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const deep=o=>JSON.parse(JSON.stringify(o));
function czState(){ const o={zoo:save.zoo,resources:save.resources,collection:save.collection,runs:save.runs||0}; for(const k of CZ_SAVE_WHOLE) o[k]=save[k]; return o; }
function czLoadState(d){ save.resources=d.resources||{}; save.collection=d.collection||{}; save.zoo=d.zoo; save.runs=d.runs||0; for(const k of CZ_SAVE_WHOLE) if(d[k]!==undefined) save[k]=d[k]; }

function czPresence(){
  if(!coopZoo) return;
  const st=coopZoo.ch.presenceState(), keys=Object.keys(st).sort();
  coopZoo.members=keys.map(k=>st[k][0]&&st[k][0].name||'?');

  const wasHost=coopZoo.host; coopZoo.host=(inZoo.length?inZoo:keys)[0]===czKey();
  if(coopZoo.host&&!wasHost){
    if(!coopZoo.gotSnap){ const away=catchUp(); if(away&&away.minutes>=1) toast(`沒人在的 ${away.minutes} 分鐘裡：門票 +${away.coins} 金幣`); }

/* ---------- 主機：廣播狀態、寫資料庫 ---------- */
function czBroadcast(force){
  const z=coopZoo; if(!z||!z.host) return; const now=performance.now();
  if(!force&&now-z.snapT<3000) return; z.snapT=now;
  const stats={zooStats:{...zooStats},opsStats:{coverage:opsStats.coverage,satisfaction:opsStats.satisfaction,rating:opsStats.rating,score:opsStats.score,parts:opsStats.parts,needs:opsStats.needs,salary:opsStats.salary,income:opsStats.income,unpaid:opsStats.unpaid,theft:opsStats.theft,endangered:opsStats.endangered},

}
async function czSaveDb(force){

/* ---------- 其他成員：套用主機狀態 ---------- */
function czApplySnap(p){
  const z=coopZoo; if(!z||z.host) return;
  const structChanged=!z.gotSnap||!jsonEq(p.zoo.buildings,save.zoo.buildings)||!jsonEq(p.zoo.props,save.zoo.props)||!jsonEq(p.zoo.terrain,save.zoo.terrain);
  const animalsChanged=!jsonEq(p.zoo.animals.map(a=>a.id+a.habitat),save.zoo.animals.map(a=>a.id+a.habitat));
  czLoadState(p); save.zoo.nextUid=z.uid;
  Object.assign(zooStats,p.stats.zooStats); Object.assign(opsStats,p.stats.opsStats); Object.assign(bizStats,p.stats.bizStats);
  z.base=deep(czState()); z.gotSnap=true;
  if(structChanged){ ensureTerrain(); rebuildZoo(); } else if(animalsChanged) rebuildZooAnimals();
  updateZooHud(); czHud();
  if(!$('zPanel').hidden&&zSelUid){ const b=findB(zSelUid); if(b&&bdef(b.type).kind==='habitat') openHabitatPanel(b); }
}
/* 跟上一次的狀態比，算出自己改了什麼 */
function czDiff(){
  const z=coopZoo, base=z.base, cur=czState(), d={lists:{},whole:{},delta:{},res:{},col:{}}; let any=false;
  for(const [k,key] of Object.entries(CZ_LIST)){
    const a=(base.zoo[k]||[]), b=(cur.zoo[k]||[]), am=new Map(a.map(x=>[x[key],x])), bm=new Map(b.map(x=>[x[key],x]));
    const add=b.filter(x=>!am.has(x[key])), del=a.filter(x=>!bm.has(x[key])).map(x=>x[key]), mod=[];
    for(const x of b){ const o=am.get(x[key]); if(!o||jsonEq(o,x)) continue; const f={}; for(const kk of Object.keys(x)) if(!jsonEq(o[kk],x[kk])) f[kk]=x[kk]; if(k==='animals'){ for(const s of ['food','happy','health','sick','preg','cooldownUntil']) delete f[s]; } if(Object.keys(f).length) mod.push([x[key],f]); }
    if(add.length||del.length||mod.length){ d.lists[k]={add,del,mod}; any=true; }
  }
  for(const k of CZ_WHOLE) if(!jsonEq(base.zoo[k],cur.zoo[k])){ d.whole[k]=cur.zoo[k]; any=true; }
  for(const k of CZ_DELTA){ const v=(cur.zoo[k]||0)-(base.zoo[k]||0); if(Math.abs(v)>1e-6){ d.delta[k]=v; any=true; } }
  for(const k of new Set([...Object.keys(base.resources),...Object.keys(cur.resources)])){ const v=(cur.resources[k]||0)-(base.resources[k]||0); if(Math.abs(v)>1e-6){ d.res[k]=v; any=true; } }
  for(const k of Object.keys(cur.collection)) if((cur.collection[k]||0)!==(base.collection[k]||0)){ d.col[k]=(cur.collection[k]||0)-(base.collection[k]||0); any=true; }
  d.save={}; for(const k of CZ_SAVE_WHOLE) if(!jsonEq(base[k],cur[k])){ d.save[k]=cur[k]; any=true; }
  if(cur.runs!==base.runs){ d.runs=cur.runs-base.runs; any=true; }
  return any?d:null;
}
function czSendEdit(){ const z=coopZoo; if(!z||z.host) return; const d=czDiff(); if(!d) return; z.ch.send({type:'broadcast',event:'edit',payload:d}); z.base=deep(czState()); }
/* 主機合併別人的修改 */
function czMerge(d){
  const z=save.zoo;
  for(const [k,c] of Object.entries(d.lists||{})){ const key=CZ_LIST[k]; z[k]=z[k]||[];
    z[k]=z[k].filter(x=>!c.del.includes(x[key]));
    for(const x of c.add) if(!z[k].some(y=>y[key]===x[key])) z[k].push(x);
    for(const [id,f] of c.mod){ const t=z[k].find(y=>y[key]===id); if(t) Object.assign(t,f); } }
  for(const [k,v] of Object.entries(d.whole||{})) z[k]=v;
  for(const [k,v] of Object.entries(d.delta||{})) z[k]=(z[k]||0)+v;
  for(const [k,v] of Object.entries(d.res||{})) save.resources[k]=(save.resources[k]||0)+v;
  for(const [k,v] of Object.entries(d.col||{})) save.collection[k]=(save.collection[k]||0)+v;
  for(const [k,v] of Object.entries(d.save||{})) save[k]=v;
  if(d.runs) save.runs=(save.runs||0)+d.runs;
  migrateAnimals(); envDirty(); rebuildZoo(); simulate(0); updateZooHud();
}

/* ---------- 多人記錄檔裡一起遠征：用同一個頻道同步位置、撿東西、Boss 血量 ---------- */
let czPendingExp=null;
function coopAttachZoo(ch){
  coop={code:'zoo',ch,host:false,peers:new Map(),zoo:true};
  ch.on('broadcast',{event:'start'},({payload})=>{ if(state==='play'||state==='confirm') return;
    czPendingExp={node:payload.node,seed:payload.seed,by:payload.by,at:payload.at,until:performance.now()+90000};
    const b=$('zJoinExp'); if(b){ b.hidden=false; b.textContent=`${payload.by||'隊友'} 出發去${payload.node.name}了，按這裡一起去`; } toast(`${payload.by||'隊友'} 出發去${payload.node.name}了，可以一起去！`); });
  ch.on('broadcast',{event:'pos'},({payload})=>coopPeer(payload));
  ch.on('broadcast',{event:'take'},({payload})=>{ if(state!=='play') return; const it=interactables.find(i=>!i.done&&i.type===payload.t&&Math.hypot(i.pos.x-payload.x,i.pos.z-payload.z)<0.6); if(it){ it.done=true; world.remove(it.group); } });
  ch.on('broadcast',{event:'boss'},({payload})=>{ if(netAuth&&boss&&!boss.dead&&state==='play') damageBoss(payload.d); });
  netHandlers(ch);
}

/* =========================================================
   多人遠征的敵人同步：同一站裡最早到的玩家負責敵人（產生、移動、扣血），
   每秒廣播 10 次敵人、Boss、火車耐久給其他玩家；其他玩家的攻擊送給他結算。
   敵人會追最近的玩家，所以大家打的是同一群怪。
   ========================================================= */
let netAuth=true, netSince=0, netNid=1, netEstT=0, netEst=null;
function netPeersHere(){
  if(!coop) return [];
  const now=performance.now(), node=curNode&&curNode.id, out=[];
  for(const [id,p] of coop.peers) if(p.node===node&&now-(p.seen||0)<3000) out.push({id,p});
  return out;
}
function netComputeAuth(){
  if(!coop) return (netAuth=true);
  for(const {id,p} of netPeersHere()){ const s=p.since||0; if(s<netSince||(s===netSince&&id<coopId)) return (netAuth=false); }
  return (netAuth=true);
}
/* 敵人要追的對象：最近、而且不在熱區裡的玩家 */
function netTargets(){
  const H=CFG().heatRadius, t=[{x:player.pos.x,z:player.pos.z,me:true}];
  for(const {p} of netPeersHere()) t.push({x:p.to.x,z:p.to.z});
  for(const o of t) o.inHeat=distToTrain(o.x,o.z)<H;
  return t;
}
function netTarget(pos){
  let best=null, bd=1e9, bestAny=null, ba=1e9;
  for(const o of netTargets()){ const d=Math.hypot(o.x-pos.x,o.z-pos.z); if(d<ba){ ba=d; bestAny=o; } if(!o.inHeat&&d<bd){ bd=d; best=o; } }
  return best||bestAny;
}
function netMinDist(pos){ let m=1e9; for(const o of netTargets()) m=Math.min(m,Math.hypot(o.x-pos.x,o.z-pos.z)); return m; }

/* ---------- 傷害：負責的人直接扣血，其他人送給他 ---------- */
function damageEnemy(w,d){
  w.hit=0.25;
  if(!netAuth){ coopSend('ehit',{n:w.nid,d}); return false; }
  w.hp-=d;
  if(w.hp<=0){ const i=wraiths.indexOf(w); if(i>=0) wraiths.splice(i,1); world.remove(w.g); toast(`${w.def?w.def.name:'霜影'}被打倒了`); return true; }
  return false;
}
function damageBoss(d){
  if(!boss||boss.dead) return; boss.hit=0.2;
  if(!netAuth){ coopSend('boss',{d}); return; }
  boss.hp-=d; boss.aggro=true; if(boss.hp<=0) defeatBoss();
}

/* ---------- 頻道事件 ---------- */
function netHandlers(ch){
  ch.on('broadcast',{event:'est'},({payload})=>{ if(state==='play'&&payload.node===(curNode&&curNode.id)) netEst=payload; });
  ch.on('broadcast',{event:'ehit'},({payload})=>{ if(!netAuth||state!=='play') return; const w=wraiths.find(x=>x.nid===payload.n); if(w) damageEnemy(w,payload.d); });
  ch.on('broadcast',{event:'shot'},({payload})=>{ if(state!=='play'||payload.node!==(curNode&&curNode.id)) return;
    const m=new THREE.Mesh(new THREE.ConeGeometry(0.08,0.5,5),shardMat); m.position.set(...payload.p); const v=new THREE.Vector3(...payload.v);
    m.lookAt(m.position.clone().add(v)); m.rotateX(Math.PI/2); world.add(m); eShots.push({m,v,life:2,drain:payload.dr}); });
  ch.on('broadcast',{event:'nova'},({payload})=>{ if(state!=='play'||payload.node!==(curNode&&curNode.id)) return;
    const d=Math.hypot(player.pos.x-payload.x,player.pos.z-payload.z);
    if(d<payload.r&&distToTrain(player.pos.x,player.pos.z)>=CFG().heatRadius){ hurt(payload.dr*(CFG().wraithTouchMult||1)); hurtT=0.6; toast('被寒氣爆發打中了！'); } });
  ch.on('broadcast',{event:'leave'},({payload})=>{ if(!coop) return; const p=coop.peers.get(payload.id); if(p){ p.g.parent&&p.g.parent.remove(p.g); coop.peers.delete(payload.id); } });
}

/* ---------- 每幀：負責的人廣播；其他人照著畫 ---------- */
function netTick(dt){
  if(!coop||state!=='play') return;
  if(netAuth){
    netEstT-=dt; if(netEstT>0||!netPeersHere().length) return; netEstT=0.1;
    const types=DATA.enemies.map(e=>e.id);
    const e=wraiths.map(w=>{ if(!w.nid) w.nid=coopId+':'+(netNid++); return [w.nid,types.indexOf(w.def?w.def.id:'wraith'),+w.g.position.x.toFixed(2),+w.g.position.z.toFixed(2),+w.g.rotation.y.toFixed(2),+w.hp.toFixed(2),w.raid?1:0]; });
    const b=boss?[+boss.g.position.x.toFixed(2),+boss.g.position.z.toFixed(2),+boss.g.rotation.y.toFixed(2),+boss.hp.toFixed(2),boss.windup>0?+(1-boss.windup/boss.def.attacks.nova.windup).toFixed(2):0,boss.dead?1:0,boss.aggro?1:0]:null;
    coopSend('est',{node:curNode.id,e,b,th:Math.round(trainHp),thm:trainHpMax});
    return;
  }
  // 照負責玩家的資料更新敵人
  const E=netEst; if(!E) return; netEst=null;
  const seen=new Set();
  for(const [nid,ti,x,z,ry,hp,raid] of E.e){
    seen.add(nid); let w=wraiths.find(o=>o.nid===nid);
    if(!w){ const def=DATA.enemies[ti]||DATA.enemies[0], m=makeEnemyMesh(def); m.g.position.set(x,heightAt(x,z),z); world.add(m.g);
      w={g:m.g,mat:m.mat,def,hp,spd:1,hit:0,phase:Math.random()*6,nid,raid:!!raid}; if(raid) w.mat.color.setHex(0x2a1418); wraiths.push(w); }
    w.to={x,z}; w.ry=ry; w.hp=hp;
  }
  for(let i=wraiths.length-1;i>=0;i--) if(!seen.has(wraiths[i].nid)){ world.remove(wraiths[i].g); wraiths.splice(i,1); }
  if(E.b&&boss){ const [x,z,ry,hp,wf,dead,ag]=E.b; boss.to={x,z}; boss.ry=ry; boss.hp=hp; boss.wf=wf; boss.aggro=!!ag; if(dead&&!boss.dead) defeatBoss(); }
  trainHpMax=E.thm; trainHp=E.th;
}
/* 其他玩家這邊的敵人：只移動到同步位置，碰到自己才扣自己的體溫 */
function netFollowEnemy(w,dt,inHeat){
  const g=w.g, W=DATA.config.wraith; w.phase+=dt;
  if(w.to){ g.position.x+=(w.to.x-g.position.x)*Math.min(1,dt*10); g.position.z+=(w.to.z-g.position.z)*Math.min(1,dt*10); g.rotation.y=w.ry||0; }
  g.position.y=heightAt(g.position.x,g.position.z)+(w.def&&w.def.look!=='wraith'?0:Math.sin(w.phase*2)*0.25);
  if(w.hit>0){ w.hit-=dt; w.mat.emissive.setHex(0x553311); } else w.mat.emissive.setHex(w.raid?0x2a0a0a:0x0a1a2a);
  const dx=player.pos.x-g.position.x, dz=player.pos.z-g.position.z, d=Math.max(0.01,Math.hypot(dx,dz));
  if(d<1.5&&!inHeat){ hurt(W.touchDrainPerSec*(w.raid?0.5:1)*(w.def?w.def.touchMult:1)*(CFG().wraithTouchMult||1)*dt); hurtT=0.3; player.pos.x+=dx/d*dt*3; player.pos.z+=dz/d*dt*3; }
}
function netFollowBoss(dt,inHeat){
  if(!boss||boss.dead){ $('bossBar').hidden=true; return; }
  const b=boss, B=b.def, g=b.g, s=B.size; b.phase+=dt;
  if(b.to){ g.position.x+=(b.to.x-g.position.x)*Math.min(1,dt*8); g.position.z+=(b.to.z-g.position.z)*Math.min(1,dt*8); g.rotation.y=b.ry||0; }
  g.position.y=heightAt(g.position.x,g.position.z)+Math.sin(b.phase*1.6)*0.3;
  if(B.attacks.nova&&b.wf>0){ const r=B.attacks.nova.radius*b.wf; b.ring.scale.set(r,r,r); b.ring.material.opacity=0.25+b.wf*0.5; } else b.ring.material.opacity=0;
  const dx=player.pos.x-g.position.x, dz=player.pos.z-g.position.z, d=Math.max(0.01,Math.hypot(dx,dz));
  if(d<1.1*s&&!inHeat){ hurt(B.touchDrain*(CFG().wraithTouchMult||1)*dt); hurtT=0.3; player.pos.x+=dx/d*dt*5; player.pos.z+=dz/d*dt*5; }
  if(b.hit>0){ b.hit-=dt; b.mat.emissive.setHex(0x553311); } else b.mat.emissive.setHex(b.wf>0?0x2a4a6a:0x0a1a2a);
  const bar=$('bossBar'); bar.hidden=!(b.aggro||b.hp<b.max); $('bossName').textContent=B.name; $('bossFill').style.width=Math.max(0,b.hp/b.max*100)+'%';
}

/* =========================================================
   效能：畫質等級（自動／低／中／高）、自動降解析度、遠處動畫降頻
   ========================================================= */
const QUALITY={
  low :{name:'低',pr:1,   trees:0.45,snow:0.35,people:10,far:220,animDist:30, lambert:true, bubbles:false},
  mid :{name:'中',pr:1.25,trees:0.75,snow:0.65,people:22,far:320,animDist:55, lambert:false,bubbles:true},
  high:{name:'高',pr:1.75,trees:1,   snow:1,   people:36,far:400,animDist:110,lambert:false,bubbles:true}};
let qSetting=(()=>{ try{ return localStorage.getItem('utopia-quality')||'auto'; }catch(e){ return 'auto'; } })();
function autoQuality(){ if(!isTouch) return 'high'; const mem=navigator.deviceMemory||4, cores=navigator.hardwareConcurrency||4; return (mem<=3||cores<=4)?'low':'mid'; }
let qLevel=qSetting==='auto'?autoQuality():qSetting, dynScale=1, fpsNow=60;
const Q=()=>QUALITY[qLevel]||QUALITY.mid;
function applyQuality(){
  renderer.setPixelRatio(Math.max(0.5,Math.min(devicePixelRatio,Q().pr)*dynScale)); resize(); zooResize();
  camera.far=Q().far; camera.updateProjectionMatrix();
  snowGeo.setDrawRange(0,Math.floor(SNOW_N*Q().snow));
  if(typeof zSnow!=='undefined'&&zSnow) zSnow.geometry.setDrawRange(0,Math.floor(1500*Q().snow));
}
function setQuality(v){ qSetting=v; try{ localStorage.setItem('utopia-quality',v); }catch(e){} qLevel=v==='auto'?autoQuality():v; dynScale=1; applyQuality(); }
/* 自動模式：每 2 秒看一次 FPS，太低就降解析度，順了再慢慢調回來 */
let fpsAcc=0, fpsN=0;
function perfTick(dt){
  fpsAcc+=dt; fpsN++; if(fpsAcc<2) return;
  fpsNow=fpsN/fpsAcc; fpsAcc=0; fpsN=0;
  if(qSetting!=='auto'||document.hidden) return;
  if(fpsNow<27&&dynScale>0.55){ dynScale=Math.max(0.55,dynScale-0.15); applyQuality(); }
  else if(fpsNow<20&&qLevel!=='low'&&dynScale<=0.55){ qLevel=qLevel==='high'?'mid':'low'; dynScale=0.85; applyQuality(); }
  else if(fpsNow>52&&dynScale<1){ dynScale=Math.min(1,dynScale+0.1); applyQuality(); }
}
/* 動畫：只更新目前畫面上的場景；離鏡頭越遠更新得越少 */
const _mv=new THREE.Vector3();
function activeCam(){ return zooActive?(state==='zoowalk'?camera:zooCam):camera; }
function updateMixersLod(dt){
  const sc=zooActive?zooScene:scene, cam=activeCam(), far=Q().animDist;
  for(const m of mixers){
    const r=m.getRoot(); let o=r; while(o.parent) o=o.parent;
    if(!o.isScene){ mixers.delete(m); continue; }
    if(o!==sc){ m._acc=0; continue; }
    r.getWorldPosition(_mv); const d=_mv.distanceTo(cam.position);
    if(d<far){ if(m._acc){ m.update(m._acc); m._acc=0; } m.update(dt); }
    else { m._acc=(m._acc||0)+dt; if(m._acc>(d<far*2?0.2:0.6)){ m.update(m._acc); m._acc=0; } }
  }
}
function qualityHtml(){
  return `<label>畫質 <select id="qSel">${[['auto','自動'],['low','低（最省電）'],['mid','中'],['high','高']].map(([v,n])=>`<option value="${v}"${qSetting===v?' selected':''}>${n}</option>`).join('')}</select></label>
    <span>目前約 ${Math.round(fpsNow)} FPS・${Q().name}畫質${qSetting==='auto'&&dynScale<1?`・解析度 ${Math.round(dynScale*100)}%`:''}</span>`;
}
function wireQuality(){ const s=$('qSel'); if(s) s.onchange=e=>{ setQuality(e.target.value); const p=$('ctrlPanel'); const q=p&&p.querySelector('.qbox'); if(q){ q.innerHTML=qualityHtml(); wireQuality(); } }; }

/* =========================================================
   自由畫棲地：在地上點出圍欄的轉角，繞一圈回到起點就圍成棲地
   圍欄種類與氣候在 data/habitats.json
   ========================================================= */
const HABS=()=>DATA.habitats;
const barrierDef=id=>HABS().barriers.find(b=>b.id===id)||HABS().barriers[0];
const climateDef=id=>HABS().climates.find(c=>c.id===id)||HABS().climates[1];
function pointInPoly(x,z,poly){ let inside=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const [xi,zi]=poly[i],[xj,zj]=poly[j]; if(((zi>z)!==(zj>z))&&(x<(xj-xi)*(z-zi)/(zj-zi)+xi)) inside=!inside; } return inside; }
const polyArea=p=>Math.abs(p.reduce((s,[x,z],i)=>{ const [x2,z2]=p[(i+1)%p.length]; return s+x*z2-x2*z; },0))/2;
const polyPerim=p=>p.reduce((s,[x,z],i)=>{ const [x2,z2]=p[(i+1)%p.length]; return s+Math.hypot(x2-x,z2-z); },0);
function freeHabCost(poly,barrier,climate){
  const P=polyPerim(poly), c={...climateDef(climate).base};
  for(const [k,v] of Object.entries(barrierDef(barrier).costPerM)) c[k]=Math.ceil((c[k]||0)+v*P);
  return c;
}
/* 自由棲地用的「建築定義」：每座都不一樣，所以依實例產生 */
function registerFreeHab(b){
  const H=HABS(), cl=climateDef(b.climate), br=barrierDef(b.barrier), areaT=polyArea(b.poly)/(TS()*TS());
  const xs=b.poly.map(p=>p[0]), zs=b.poly.map(p=>p[1]);
  const def={id:b.type,name:`${cl.name}棲地（自訂）`,kind:'habitat',free:true,size:[b.w,b.h],baseTemp:cl.temp,accepts:H.accepts,
    capacity:Math.max(2,Math.floor(areaT/H.tilesPerAnimal)),ground:'#7a8a6a',groundPaint:cl.paint,cost:b.cost||{},barrier:br.id,areaTiles:areaT,
    power:br.power?Math.ceil(br.power*polyPerim(b.poly)):0};
  DATA.buildingById[b.type]=def; return def;
}
function registerAllFreeHabs(){ for(const b of save.zoo.buildings) if(b.poly) registerFreeHab(b); }
/* 圍欄外觀 */
function makeFenceMesh(b,c){
  const g=new THREE.Group(), br=barrierDef(b.barrier), H=br.height, col=hex(br.color);
  const glass=br.id==='glass'||br.id==='oneway';
  const panelM=glass?new THREE.MeshPhongMaterial({color:col,transparent:true,opacity:br.id==='oneway'?0.7:0.3,shininess:100,depthWrite:false,side:THREE.DoubleSide}):br.id==='steel'?new THREE.MeshLambertMaterial({color:col,transparent:true,opacity:0.55,side:THREE.DoubleSide}):M(col);
  const postM=M(br.id==='wood'?0x5a4030:0x4a4f56);
  const n=b.poly.length;
  for(let i=0;i<n;i++){
    const [x1,z1]=b.poly[i], [x2,z2]=b.poly[(i+1)%n], L=Math.hypot(x2-x1,z2-z1), a=Math.atan2(x2-x1,z2-z1);
    const steps=Math.max(1,Math.round(L/2));
    for(let k=0;k<steps;k++){
      const t0=k/steps, t1=(k+1)/steps, xa=x1+(x2-x1)*t0, za=z1+(z2-z1)*t0, xb=x1+(x2-x1)*t1, zb=z1+(z2-z1)*t1, mx=(xa+xb)/2, mz=(za+zb)/2, y=ZH(mx,mz), seg=L/steps;
      if(br.id==='wood'){ for(const yy of [0.45,0.95]){ const r=box(0.06,0.1,seg,panelM); r.position.set(mx-c.x,y+yy,mz-c.z); r.rotation.y=a; g.add(r); } }
      else if(br.id==='electric'){ for(const yy of [0.5,1.1,1.7,2.3]){ const r=box(0.03,0.03,seg,M(0xd8c060)); r.position.set(mx-c.x,y+yy,mz-c.z); r.rotation.y=a; g.add(r); } }
      else { const p=box(br.id==='concrete'?0.35:0.06,H,seg,panelM); p.position.set(mx-c.x,y+H/2,mz-c.z); p.rotation.y=a; g.add(p); }
      const post=box(0.14,H+0.1,0.14,postM); post.position.set(xa-c.x,ZH(xa,za)+H/2,za-c.z); g.add(post);
    }
  }
  return g;
}

function barrierInfo(br){ return `耐撞 ${br.grade} 級・${br.climbproof?'防攀爬':'會被攀爬'}・${br.oneway?'單面玻璃（動物看不到遊客）':br.opaque?'不透明（遊客看不到動物）':'看得見'}・${br.watertight?'防水（可以有水池）':'不防水（水會漏，水池無效）'}・高 ${br.height} m${br.power?'・要用電':''}`; }

/* =========================================================
   園區生態：遊客沿步道走（尋路）、員工步道、員工設施、疾病傳染與隔離、動物行為
   數值在 config.life；建築 kind: staff 在 buildings.json
