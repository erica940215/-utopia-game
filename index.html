const LIFE=()=>DATA.config.life;
const staffBuildings=role=>save.zoo.buildings.filter(b=>{ const d=bdef(b.type); return d&&d.kind==='staff'&&d.role===role&&isWorking(b); });
/* 飼育員小屋：太遠的棲地照護打折（入口本身算一間小的） */
function hutFactor(b){
  const L=LIFE(), huts=staffBuildings('hut'), gate=save.zoo.buildings.find(x=>x.type==='gate');
  const near=(h,r)=>tileDist(h,b)<=r+Math.max(...bdef(b.type).size)/2;
  if(gate&&near(gate,L.gateHutRadius)) return 1;
  return huts.some(h=>near(h,bdef(h.type).radius))?1:L.farCoverage;
}
function restCapacity(){ return LIFE().gateRestServes+staffBuildings('rest').reduce((s,b)=>s+bdef(b.type).serves,0); }
const restPenalty=()=>{ const n=totalStaff(), cap=restCapacity(); return n>cap?LIFE().restMoralePenalty*Math.min(1,(n-cap)/Math.max(1,n)):0; };
const vetMult=()=>staffBuildings('vet').length?1:LIFE().vetNoClinic;
const researchMult=()=>1+Math.min(3,staffBuildings('research').length)*LIFE().researchPerCenter;
const repairMult=()=>1+Math.min(2,staffBuildings('repair').length)*LIFE().repairPerWorkshop;
const quarantineCap=()=>staffBuildings('quarantine').reduce((s,b)=>s+bdef(b.type).serves,0);

/* ---------- 疾病：同一座棲地會傳染；隔離區裡的不會 ---------- */
function contagionStep(min){
  const z=save.zoo, L=LIFE(), sick=new Map();
  for(const a of z.animals) if(a.sick) sick.set(a.habitat,(sick.get(a.habitat)||0)+1);
  for(const a of z.animals){ if(a.sick) continue; const n=sick.get(a.habitat)||0;
    if(n&&Math.random()<L.contagionPerMin*n*geneSickMult(a)*RF().sickChanceMult*min){ a.sick=true; zooSickLog.push(a); } }
  // 隔離區：治療比較快，好了就回原本的棲地
  z.quar=z.quar||[];
  let cure=staffPower('vet')*DATA.staffById.vet.curePerMin*L.quarantineCure*vetMult()*min;
  for(const a of [...z.quar]){
    a.health=Math.min(100,(a.health??60)+DATA.config.ops.healthRegenPerMin*2*min);
    if(a.sick&&cure>0&&Math.random()<Math.min(1,cure)){ a.sick=false; cure-=1; }
    if(!a.sick&&a.health>=80){ z.quar.splice(z.quar.indexOf(a),1); const b=findB(a.from); const room=b&&z.animals.filter(x=>x.habitat===b.uid).length<bdef(b.type).capacity;
      if(room){ a.habitat=b.uid; z.animals.push(a); } else { a.habitat=null; z.stored.push(a); } toast(`${nameOf(a)} 康復了，${room?'回到棲地':'先放進倉庫'}`); }
  }
}
let zooSickLog=[];
function sendToQuarantine(a){
  const z=save.zoo; z.quar=z.quar||[];
  if(z.quar.length>=quarantineCap()) { toast(quarantineCap()?'隔離區滿了':'先蓋一座隔離區'); return false; }
  z.animals.splice(z.animals.indexOf(a),1); delete a.preg; a.from=a.habitat; a.habitat=null; z.quar.push(a); return true;
}

/* ---------- 遊客沿步道走：在步道格子上找路 ---------- */
function walkGrid(){
  const m=new Map();
  for(const b of save.zoo.buildings){ const d=bdef(b.type); if(!d) continue; const ok=(d.kind==='path'&&!d.staff)||d.kind==='gate'||d.kind==='facility'||d.kind==='transport';
    if(!ok) continue; for(let i=0;i<d.size[0];i++) for(let j=0;j<d.size[1];j++) m.set((b.x+i)+','+(b.z+j),d.kind==='path'||d.kind==='gate'); }
  return m;
}
let walkCache=null, walkStamp='';
function walkTiles(){ const s=save.zoo.buildings.length+':'+(save.zoo.nextUid||0); if(s!==walkStamp){ walkStamp=s; walkCache=walkGrid(); } return walkCache; }
const tileXZ=k=>{ const [i,j]=k.split(',').map(Number); return {x:(i+0.5-GN()/2)*TS(),z:(j+0.5-GN()/2)*TS()}; };
function findRoute(fromK,toK){
  const G=walkTiles(); if(!G.has(fromK)||!G.has(toK)) return null;
  const prev=new Map([[fromK,null]]), q=[fromK];
  while(q.length){ const k=q.shift(); if(k===toK) break; const [i,j]=k.split(',').map(Number);
    for(const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){ const n=(i+di)+','+(j+dj); if(G.has(n)&&!prev.has(n)){ prev.set(n,k); q.push(n); } } }
  if(!prev.has(toK)) return null;
  const r=[]; for(let k=toK;k;k=prev.get(k)) r.unshift(k); return r;
}
function keyAt(x,z){ return Math.floor(x/TS()+GN()/2)+','+Math.floor(z/TS()+GN()/2); }
/* 給 updatePeople 用：替一位遊客挑下一段路 */
function nextWalk(p){
  const G=walkTiles(), keys=[...G.keys()]; if(!keys.length) return null;
  const from=keyAt(p.m.position.x,p.m.position.z), to=keys[Math.floor(Math.random()*keys.length)];
  const r=G.has(from)?findRoute(from,to):null;
  if(r&&r.length>1) return r.slice(1).map(k=>{ const c=tileXZ(k); return {x:c.x+(Math.random()-0.5)*0.9,z:c.z+(Math.random()-0.5)*0.9}; });
  const c=tileXZ(to); p.m.position.set(c.x,0,c.z); return [{x:c.x,z:c.z}];   // 不在步道上就直接放到步道
}
/* 員工步道與一般步道：拖曳就能一路鋪 */
const isPathTool=()=>{ const d=bdef(zTool); return d&&d.kind==='path'; };
function pathDragAt(cx,cy){
  const t=screenToTile(cx,cy); if(!t) return; const d=bdef(zTool), z=save.zoo;
  if(!canPlace(d,t.x,t.z)||!affordable(d.cost)) return;
  pay(d.cost,-1); const b={uid:z.nextUid++,type:d.id,x:t.x,z:t.z,rot:0}; z.buildings.push(b);
  const g=makeBuildingMesh(b); zooRoot.add(g); zooBMeshes.set(b.uid,g); zPathDirty=true;
}
let zPathDirty=false;
function pathDragEnd(){ if(zPathDirty){ zPathDirty=false; simulate(0); updateZooHud(); renderZooTools(); persist(); } }

/* ---------- 動物行為：睡覺、玩玩具、吃東西、游泳、打架 ---------- */
const ACT_NAME={walk:'散步',sleep:'睡覺',play:'玩玩具',eat:'吃東西',swim:'游泳',fight:'打架',sick:'生病休息'};
function pickBehavior(z){
  const a=z.a, L=LIFE(), b=findB(a.habitat); if(!b) return 'walk';
  if(a.sick) return 'sick';
  if((a.fightUntil||0)>(save.zoo.clock||0)) return 'fight';
  if(typeof worldTime==='function'&&worldTime().night) return 'sleep';
  if((a.food??80)<L.eatBelow) return 'eat';
  const env=habitatEnv(b);
  if(env.water>0.05&&Math.random()<L.swimChance) return 'swim';
  if(env.enrich.length&&Math.random()<L.playChance) return 'play';
  return 'walk';
}
function behaviorTarget(z,act){
  const b=findB(z.a.habitat); if(!b) return null; const r=habitatRect(b);
  const inside=(x,zz)=>!r.poly||pointInPoly(x,zz,r.poly);
  if(act==='play'){ const ps=(save.zoo.props||[]).filter(p=>{ const d=pdef(p.type); return d&&d.cat==='enrich'&&p.x>r.x0&&p.x<r.x1&&p.z>r.z0&&p.z<r.z1&&inside(p.x,p.z); }); if(ps.length){ const p=ps[Math.floor(Math.random()*ps.length)]; return {x:p.x+(Math.random()-0.5)*1.5,z:p.z+(Math.random()-0.5)*1.5}; } }
  if(act==='swim'){ const T=save.zoo.terrain; for(let t=0;t<30;t++){ const x=r.x0+Math.random()*(r.x1-r.x0), zz=r.z0+Math.random()*(r.z1-r.z0); if(inside(x,zz)&&ZH(x,zz)<TRN().waterLevel) return {x,z:zz}; } }
  if(act==='eat'){ const c=tileCenter(b); const f=save.zoo.buildings.find(o=>bdef(o.type).kind==='feeder'); if(f){ const fc=tileCenter(f), k=0.75; const x=c.x+(fc.x-c.x)*k*0.5, zz=c.z+(fc.z-c.z)*k*0.5; if(inside(x,zz)) return {x,z:zz}; } }
  if(act==='fight'){ const rival=zooAnimals.find(o=>o!==z&&o.a.habitat===z.a.habitat&&o.a.species===z.a.species&&o.a.sex==='M'); if(rival) return {x:rival.mesh.position.x,z:rival.mesh.position.z}; }
  return null;
}
/* 每隻動物每幀呼叫：回傳 true 表示這幀已經處理過移動 */
function animalBehave(z,dt,gy,lift){
  const m=z.mesh;
  if(!z.act||z.actT<=0){ z.act=pickBehavior(z); z.a.act=z.act; z.actT=6+Math.random()*8; const t=behaviorTarget(z,z.act); if(t){ z.tx=t.x; z.tz=t.z; z.wait=0; } }
  z.actT-=dt;
  const sy=z.baseScale||(z.baseScale=m.scale.y);
  if(z.act==='sleep'||z.act==='sick'){ m.scale.y=sy*(z.act==='sleep'?LIFE().sleepScaleY:0.85); m.position.y=gy+0.05+lift; setAnim(m,'idle'); freezeAnim(m,z.act==='sleep'); return true; }
  if(m.scale.y!==sy){ m.scale.y=sy; freezeAnim(m,false); }
  if(z.act==='swim'&&ZH(m.position.x,m.position.z)<TRN().waterLevel){ m.position.y=TRN().waterLevel-0.25; }
  if(z.act==='fight'){ m.rotation.y+=Math.sin(performance.now()/60)*0.08; }
  return false;
}

/* =========================================================
   園區設施細節：冷氣、水溫調節、飲料店、販賣機、資訊中心、ATM、動物講座、廁所收費、
   教育與行銷物件（喇叭、教育站、保育看板、廣告看板、直播鏡頭）、保全（監視器、請勿餵食牌）、
   玻璃展示箱與步入式展館。數值在 config.fac
   ========================================================= */
const FAC=()=>DATA.config.fac;
function propEffects(){
  const out={clean:0,cons:0,edu:0,visit:0,online:0,security:0,nofeed:0,count:{}};
  for(const p of save.zoo.props||[]){ const d=pdef(p.type); if(!d||!d.effect) continue; out.count[d.id]=(out.count[d.id]||0)+1;
    for(const [k,v] of Object.entries(d.effect)) out[k]+=v; }
  const F=FAC(); out.visit=Math.min(F.billboardMax,out.count.billboard||0)*(pdef('billboard').effect.visit);
  out.online=Math.min(F.webcamMax,out.count.webcam||0)*(pdef('webcam').effect.online);
  return out;
}
const hasFacility=svc=>save.zoo.buildings.some(b=>{ const d=bdef(b.type); return d&&d.kind==='facility'&&d.service===svc&&isWorking(b); });
function drinkCoverage(v){
  const F=FAC(), serves=save.zoo.buildings.filter(b=>{ const d=bdef(b.type); return d&&d.kind==='facility'&&isWorking(b)&&(d.service==='drink'||(d.services||[]).includes('drink')||d.service==='food'); })
    .reduce((s,b)=>{ const d=bdef(b.type); return s+d.serves*(d.service==='drink'||(d.services||[]).includes('drink')?1:F.restaurantDrink); },0)*bizStats.power.ratio;
  return v<=0?1:Math.min(1,serves/v);
}
/* 教育分數的額外來源 */
function extraEducation(pe){
  const F=FAC(); let e=pe.edu;
  if(hasFacility('info')) e+=F.audioEdu;
  if(hasFacility('talk')&&staffCount('educator')>0) e+=F.talkEdu;
  if(save.zoo.buildings.some(b=>bdef(b.type).walk&&save.zoo.animals.some(a=>a.habitat===b.uid))) e+=F.walkEdu;
  return e;
}
/* 遊客人數的額外倍率 */
function extraVisitorMult(pe){
  const F=FAC(); let m=1+pe.visit;
  if(hasFacility('talk')&&staffCount('educator')>0) m*=F.talkVisit;
  if(hasFacility('info')&&typeof weatherNow==='function'){ const w=weatherNow().visit; if(w<1) m*=1+(1-w)*F.umbrellaRecover; }   // 雨傘
  return m;
}
/* 廁所收費 */
function toiletIncome(visitors){ const z=save.zoo, F=FAC(); const fee=z.toiletFee||0; return fee*visitors*F.toiletFeeShare*facilityCoverage('restroom',visitors)*0.05; }
const toiletSatPenalty=()=>(save.zoo.toiletFee||0)*FAC().toiletFeeSat;
/* 遊客亂餵：步道旁、附近沒有「請勿餵食牌」的棲地，動物比較容易生病 */
function guestFeedMult(b){
  if(!b) return 1; const d=bdef(b.type); if(d.house) return 1;
  const c=tileCenter(b), r=Math.max(...d.size)*TS()/2+6;
  const nearPath=save.zoo.buildings.some(o=>{ const od=bdef(o.type); if(od.kind!=='path'||od.staff) return false; const oc=tileCenter(o); return Math.hypot(oc.x-c.x,oc.z-c.z)<r; });
  if(!nearPath) return 1;
  const signed=(save.zoo.props||[]).some(p=>p.type==='nofeed_sign'&&Math.hypot(p.x-c.x,p.z-c.z)<r);
  return signed?1:FAC().guestFeedSick;
}
/* 冷氣與水溫調節器加進棲地溫度 */
function coolerOffset(b){
  const d=bdef(b.type); let t=0; if(d.house) return 0;
  for(const h of save.zoo.buildings){ const hd=bdef(h.type); if(hd.kind==='cooler'&&isWorking(h)&&tileDist(h,b)<=hd.radius+Math.max(...d.size)/2) t+=hd.heat*bizStats.power.ratio; }
  return t;
}
function waterRegulated(b){
  const d=bdef(b.type); if(!d.water) return false;
  return save.zoo.buildings.some(h=>{ const hd=bdef(h.type); return hd.kind==='waterreg'&&isWorking(h)&&bizStats.power.ratio>0.5&&tileDist(h,b)<=hd.radius+Math.max(...d.size)/2; });
}
/* 展示箱只能一種 */
function singleCheck(b){ const d=bdef(b.type); if(!d.single) return null; const n=new Set(save.zoo.animals.filter(a=>a.habitat===b.uid).map(a=>a.species)).size;
  return {k:'single',label:'展示箱只能放一種動物',ok:n<=1,pen:n<=1?0:FAC().singlePenalty}; }

let bpSel=null;

function bpTools(){ return [{id:'bp_save',name:'框選存藍圖',sub:'點兩個對角'},{id:'bp_import',name:'匯入藍圖',sub:'貼上代碼'},...blueprints().map(b=>({id:'bpl_'+b.id,name:b.name,sub:costText(b.cost),cost:b.cost}))]; }
function bpTap(cx,cy){
  const h=groundHit(cx,cy); if(!h) return;
  if(zTool==='bp_save'){
    if(!bpSel){ bpSel={x:h.x,z:h.z}; toast('再點對角，框起要存的物件'); return; }
    const x0=Math.min(bpSel.x,h.x), x1=Math.max(bpSel.x,h.x), z0=Math.min(bpSel.z,h.z), z1=Math.max(bpSel.z,h.z); bpSel=null;
    const inside=(save.zoo.props||[]).filter(p=>p.x>=x0&&p.x<=x1&&p.z>=z0&&p.z<=z1);
    if(!inside.length){ toast('框裡沒有物件'); return; }
    const cx0=(x0+x1)/2, cz0=(z0+z1)/2, cost={};
    for(const p of inside) for(const [k,v] of Object.entries(pdef(p.type).cost)) cost[k]=(cost[k]||0)+v;
    const bp={id:Date.now().toString(36),name:`藍圖 ${blueprints().length+1}`,props:inside.map(p=>({type:p.type,dx:+(p.x-cx0).toFixed(2),dz:+(p.z-cz0).toFixed(2),y:p.y||0,rot:p.rot||0})),cost};
    blueprints().push(bp); persist(); zTool='bpl_'+bp.id; renderZooTools(); bpPanel(bp); toast(`存成藍圖了（${inside.length} 個物件）`); return;
  }
  const bp=blueprints().find(b=>'bpl_'+b.id===zTool); if(!bp) return;
  if(!affordable(bp.cost)){ toast(`不夠：需要 ${costText(bp.cost)}`); return; }
  pay(bp.cost,-1); const c=Math.cos(zRot), s=Math.sin(zRot);
  for(const q of bp.props){ const p={uid:save.zoo.nextUid++,type:q.type,x:h.x+q.dx*c+q.dz*s,z:h.z-q.dx*s+q.dz*c,y:q.y,rot:(q.rot||0)+zRot}; save.zoo.props.push(p); placePropMesh(p); }
  updateZooHud(); persist(); toast(`放下${bp.name}`);
}

    const {error}=await sb.from('market_listings').insert({seller_name:coopName(),species:a.species,animal:a,price}); if(error){ toast('上架失敗：'+error.message); el.disabled=false; return; }
    save.zoo.stored.splice(i,1); persist(); showMarket(`${DATA.speciesById[a.species].name} 上架了，${price} 金幣`); });
}

/* ---------- 劇情任務與新手教學 ---------- */
const STORY=()=>DATA.story;
function storyStat(k){
  const z=save.zoo, B=z?z.buildings:[], kind=k2=>B.filter(b=>{ const d=bdef(b.type); return d&&d.kind===k2; }).length;
  switch(k){
    case 'paths': return kind('path'); case 'habitats': return kind('habitat'); case 'feeders': return kind('feeder');
    case 'animals': return z?z.animals.length:0; case 'runs': return save.runs||0;
    case 'upgrades': return Object.values(save.upgrades||{}).reduce((a,b)=>a+b,0)+Math.max(0,((save.gear&&save.gear.owned)||[]).length-1);
    case 'staff': return z?totalStaff():0; case 'visitors': return zooStats.visitors||0; case 'rating': return opsStats.rating||1;
    case 'restaurant': return B.filter(b=>b.type==='restaurant').length; case 'restroom': return B.filter(b=>b.type==='restroom').length;
    case 'tier2': return (save.map&&save.map.visited||[]).filter(id=>DATA.mapById[id]&&DATA.mapById[id].tier>=2).length;
    case 'rare': return Object.keys(save.collection).filter(id=>DATA.speciesById[id]&&DATA.speciesById[id].rarity!=='common').length;
    case 'crafted': return (save.stats&&save.stats.crafted)||0; case 'births': return z?z.births||0:0; case 'released': return z?z.released||0:0;
    case 'techs': return Object.keys((z&&z.tech)||{}).length; case 'bosses': return bossesDefeated(); case 'species': return Object.keys(save.collection).length;
    case 'cars': return ((save.train&&save.train.cars)||[]).length; case 'freehab': return B.filter(b=>b.poly).length;
    default: return 0;
  }
}
function storyState(){ save.story=save.story||{ch:0,step:0,seen:-1}; return save.story; }
function storyCurrent(){ const s=storyState(), ch=STORY().chapters[s.ch]; return ch?{ch,step:ch.steps[s.step],s}:null; }
let storyT=0;
function storyTick(dt){
  if(modeOf()!=='career'||!DATA.story) return; storyT+=dt; if(storyT<1.5) return; storyT=0;
  const cur=storyCurrent(); if(!cur) { $('zStory').hidden=true; return; }
  const {ch,s}=cur;
  if(s.seen!==s.ch){ s.seen=s.ch; persist(); showStoryCard(ch); return; }
  let done=0, rw={};
  while(s.ch<STORY().chapters.length){ const C=STORY().chapters[s.ch], st=C.steps[s.step]; if(!st||storyStat(st.stat)<st.target) break;
    for(const [k,v] of Object.entries(st.reward||{})) rw[k]=(rw[k]||0)+v; done++; s.step++;
    if(s.step>=C.steps.length){ s.ch++; s.step=0; for(const [k,v] of Object.entries(C.reward||{})) rw[k]=(rw[k]||0)+v; toast(`完成章節「${C.name}」！`); break; } }
  if(done){ pay(rw,1); persist(); if(Object.keys(rw).length) toast(`任務完成 ×${done}：${costText(rw)}`); }
  storyHud();
}
function storyHud(){
  const el=$('zStory'), cur=storyCurrent(); if(!el) return;
  if(!cur||modeOf()!=='career'){ el.hidden=true; return; }
  const {ch,step,s}=cur; el.hidden=false;
  el.innerHTML=`<b>${esc(ch.name)} ${s.step+1}/${ch.steps.length}</b><span>${esc(step.text)}</span><span class="num">${Math.min(storyStat(step.stat),step.target)}/${step.target}</span>`;
  el.onclick=()=>toast(step.hint||step.text);
}
function showStoryCard(ch){
  state='story'; $('zooUI').hidden=true; screenEl.hidden=false;
  screenEl.innerHTML=`<div class="card"><h1><small>CHAPTER ${STORY().chapters.indexOf(ch)+1}</small>${esc(ch.name)}</h1>${ch.intro.map(p=>`<p>${esc(p)}</p>`).join('')}
    <div class="btns"><button class="btn" id="stGo" type="button">開始</button></div></div>`;
  $('stGo').onclick=()=>{ screenEl.hidden=true; state='zoo'; $('zooUI').hidden=false; storyHud(); };
}

/* =========================================================
   觸控操作設定：搖桿與按鈕可以調整大小、拖曳位置
   設定只存在這台裝置（localStorage）
   ========================================================= */
const CTRL_IDS={stick:'搖桿',btnFire:'開火',btnAct:'互動',btnRun:'奔跑',btnEat:'吃',btnHeal:'治療'};
const CTRL_BASE={stick:120,btnFire:78,btnAct:66,btnRun:56,btnEat:50,btnHeal:50};
let ctrlCfg={size:{},pos:{}};
try{ const t=localStorage.getItem('utopia-controls'); if(t) ctrlCfg=Object.assign({size:{},pos:{}},JSON.parse(t)); }catch(e){}
function saveCtrl(){ try{ localStorage.setItem('utopia-controls',JSON.stringify(ctrlCfg)); }catch(e){} }
function applyCtrl(){
  for(const id of Object.keys(CTRL_IDS)){
    const el=$(id), sz=Math.round(CTRL_BASE[id]*(ctrlCfg.size[id]||1)), p=ctrlCfg.pos[id];
    el.style.width=sz+'px'; el.style.height=sz+'px';
    if(p){ el.style.left=(p.x*100)+'%'; el.style.top=(p.y*100)+'%'; el.style.right='auto'; el.style.bottom='auto'; el.style.transform='translate(-50%,-50%)'; }
    else { el.style.left=el.style.top=el.style.right=el.style.bottom=el.style.transform=''; }
  }
  const k=$('knob'), ks=Math.round(50*(ctrlCfg.size.stick||1)); k.style.width=k.style.height=ks+'px'; k.style.margin=`${-ks/2}px 0 0 ${-ks/2}px`;
}
applyCtrl();
let ctrlDrag=null;
function startCtrlEdit(){
  state='ctrledit';
  $('touch').hidden=false; $('touch').classList.remove('walk'); $('touch').classList.add('edit');
  const p=$('ctrlPanel'); p.hidden=false;
  p.innerHTML=`<b>操作設定</b><span>直接拖曳按鈕調整位置，用滑桿調整大小。</span>
    ${Object.entries(CTRL_IDS).map(([id,n])=>`<label>${n}<input type="range" id="sz_${id}" min="0.6" max="1.6" step="0.05" value="${ctrlCfg.size[id]||1}"></label>`).join('')}
    <div class="qbox">${qualityHtml()}</div>
    <div class="btns"><button type="button" class="btn ghost" id="ctrlReset">重設</button><button type="button" class="btn" id="ctrlDone">完成</button></div>`;
  wireQuality();
  for(const id of Object.keys(CTRL_IDS)) $('sz_'+id).oninput=e=>{ ctrlCfg.size[id]=parseFloat(e.target.value); applyCtrl(); };
  $('ctrlReset').onclick=()=>{ ctrlCfg={size:{},pos:{}}; applyCtrl(); saveCtrl(); startCtrlEdit(); };
  $('ctrlDone').onclick=()=>endCtrlEdit();
}
function endCtrlEdit(){
  saveCtrl(); $('ctrlPanel').hidden=true; $('touch').classList.remove('edit'); $('touch').hidden=true;
  state='zoo'; $('zooUI').hidden=false;
}
for(const id of Object.keys(CTRL_IDS)){
  const el=$(id);
  el.addEventListener('pointerdown',e=>{ if(state!=='ctrledit') return; e.preventDefault(); ctrlDrag=id; el.setPointerCapture&&el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove',e=>{ if(state!=='ctrledit'||ctrlDrag!==id) return;
    ctrlCfg.pos[id]={x:Math.max(0.04,Math.min(0.96,e.clientX/innerWidth)),y:Math.max(0.08,Math.min(0.94,e.clientY/innerHeight))}; applyCtrl(); });
  el.addEventListener('pointerup',()=>{ if(ctrlDrag===id){ ctrlDrag=null; saveCtrl(); } });
}

/* =========================================================
   8. 主迴圈
   ========================================================= */
const clock=new THREE.Clock(), tmpV=new THREE.Vector3();
function collide(p,r){
  for(const b of colliders){
    const cx=Math.max(b.x0,Math.min(p.x,b.x1)), cz=Math.max(b.z0,Math.min(p.z,b.z1)), dx=p.x-cx, dz=p.z-cz, d2=dx*dx+dz*dz;
    if(d2<r*r){ if(d2>1e-6){ const d=Math.sqrt(d2); p.x=cx+dx/d*r; p.z=cz+dz/d*r; } else { const mx=(b.x0+b.x1)/2; p.x=p.x>mx?b.x1+r:b.x0-r; } }
  }
  const d=Math.hypot(p.x,p.z); if(d>185){ p.x*=185/d; p.z*=185/d; }
}
function update(dt){
  if(zooActive){ zooUpdate(dt); return; }
  const t=clock.elapsedTime;
  if(world) world.traverse(o=>{ if(o.userData.spin){ o.rotation.y+=dt*2; o.position.y+=Math.sin(t*3)*0.003; } });
  for(const it of interactables) if(it.bug&&!it.done){ it.bug.position.y=0.8+Math.sin(t*4+it.ph)*0.25; it.bug.rotation.y+=dt*1.5; }
  for(const s of smoke){ s.userData.t=(s.userData.t+dt*0.18)%1; const k=s.userData.t; s.position.set(Math.sin(k*5)*0.6,5+k*9,33.6-k*7); const sc=0.8+k*4; s.scale.set(sc,sc,1); s.material.opacity=0.55*(1-k); }
  const playing=state==='play'||state==='confirm';
  const stormK=playing?(timeLeft<=0?1:Math.max(0,1-timeLeft/45)):0;
  const p=snowGeo.attributes.position.array, wind=2+stormK*14;
  for(let i=0;i<SNOW_N;i++){ p[i*3+1]-=dt*(2.2+stormK*3); p[i*3]+=dt*wind*0.6; p[i*3+2]+=dt*wind*0.3; if(p[i*3+1]<0)p[i*3+1]+=25; if(p[i*3]>30)p[i*3]-=60; if(p[i*3+2]>30)p[i*3+2]-=60; }
  snowGeo.attributes.position.needsUpdate=true;
  snow.position.set(player.pos.x,player.pos.y-6,player.pos.z);
  scene.fog.density=0.016+stormK*0.05;
  scene.fog.color.copy(SKY).lerp(STORM_SKY,stormK*0.7); scene.background.copy(scene.fog.color);
  if(state!=='play'){
    if(state==='hub'||state==='boot') player.yaw+=dt*0.03;
    camera.position.set(player.pos.x,(inTrain?TRAIN_FLOOR:heightAt(player.pos.x,player.pos.z))+1.65,player.pos.z); camera.rotation.set(player.pitch,player.yaw,0); return;
  }
  const C=CFG(), T=TMP(), W=DATA.config.wraith;
  timeLeft-=dt;
  if(toastT>0){ toastT-=dt; if(toastT<=0) $('toast').style.opacity=0; }
  let ix=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x, iz=(keys.KeyS?1:0)-(keys.KeyW?1:0)+joy.y;
  const il=Math.hypot(ix,iz); if(il>1){ix/=il;iz/=il;}
  const speed=sprint?C.sprintSpeed:C.walkSpeed, sy=Math.sin(player.yaw), cy=Math.cos(player.yaw);
  player.pos.x+=(ix*cy+iz*sy)*speed*dt; player.pos.z+=(-ix*sy+iz*cy)*speed*dt;
  if(inTrain) clampInTrain(); else collide(player.pos,0.45);
  const moving=il>0.1; if(moving) player.bob+=dt*(sprint?13:9);
  const gy=inTrain?TRAIN_FLOOR:heightAt(player.pos.x,player.pos.z);
  camera.position.set(player.pos.x,gy+1.65+(moving?Math.sin(player.bob)*0.06:0),player.pos.z);
  camera.rotation.set(player.pitch,player.yaw,0); player.pos.y=gy;

  const inHeat=distToTrain(player.pos.x,player.pos.z)<C.heatRadius;
  if(inHeat){
    player.temp=Math.min(T.max,player.temp+T.heatRegenPerSec*(C.heatRegenMult||1)*dt);
    if(bagCount()>0){ const n=bagCount(); depositAll(); toast(`存入車廂 ${n} 單位物資`); }
    if(container.length){ const n=boardContainer(); toast(`${n} 隻生物從容器移進車廂`); }
    if(followers.length){ const names=boardFollowers(); toast(`${names.join('、')} 安全上車了`); }
    player.hp=Math.min(HPC().max,player.hp+HPC().heatRegenPerSec*dt);
    ammoTick+=dt; if(ammoTick>weapon.refillSeconds&&ammo<weapon.ammo&&takeAmmoRound()){ ammo++; ammoTick=0; }
    if(curNode&&curNode.type==='stall'&&haul.fuel+bag.fuel>=(curNode.need||0)&&!curNode.told){ curNode.told=true; toast(`煤炭夠了，可以繼續前往${curNode.destName}`); }
  } else {
    const warm=warmZones.some(w=>Math.hypot(player.pos.x-w.x,player.pos.z-w.z)<w.r)?(curStation.warmDrainMult||1):inVault()?0.6:1;
    player.temp-=warm*(CFG().drainMult||1)*(timeLeft<=0?T.stormDrainPerSec:T.drainPerSec+(sprint&&moving?T.sprintExtraDrain:0)+followers.length*T.perFollowerDrain)*dt;
  }
  followers.forEach((f,i)=>{
    const back=1.6+i*1.3; tmpV.set(player.pos.x+Math.sin(player.yaw)*back,0,player.pos.z+Math.cos(player.yaw)*back);
    const m=f.mesh, dx=tmpV.x-m.position.x, dz=tmpV.z-m.position.z, d=Math.hypot(dx,dz);
    if(d>0.3){ const s=Math.min(d,dt*(d>4?9:5)); m.position.x+=dx/d*s; m.position.z+=dz/d*s; m.rotation.y=Math.atan2(dx,dz); f.hop+=dt*12; setAnim(m,d>4?'run':'walk'); } else setAnim(m,'idle');
    m.position.y=heightAt(m.position.x,m.position.z)+(isAnimated(m)?0:Math.abs(Math.sin(f.hop))*0.12);
  });
  const elapsed=C.runSeconds-timeLeft;
  netComputeAuth();
  if(netAuth&&elapsed>nextSpawn){
    const max=timeLeft<=0?W.stormMax:W.baseMax+Math.floor(elapsed/W.addMaxEverySeconds);
    if(wraiths.length<max) spawnWraith();
    nextSpawn=elapsed+(timeLeft<=0?W.stormSpawnInterval:W.spawnInterval)*(C.wraithSpawnMult||1);
  }
  updateTrainDefense(dt,elapsed); if(state!=='play') return;
  for(const w of [...wraiths]){
    if(!netAuth){ netFollowEnemy(w,dt,inHeat); continue; }
    if(w.raid){ raidStep(w,dt); continue; }
    const g=w.g; w.phase+=dt;
    const tg=netTarget(g.position), dx=tg.x-g.position.x, dz=tg.z-g.position.z, d=Math.max(0.01,Math.hypot(dx,dz));
    const holding=w.def&&w.def.ranged&&!tg.inHeat&&enemyRanged(w,d,dx,dz,dt,tg.inHeat,tg);
    if(holding){}
    else if(d<W.chaseRange&&!tg.inHeat){ const s=(timeLeft<=0?W.stormSpeed:W.speed)*(w.spd||1)*dt; g.position.x+=dx/d*s; g.position.z+=dz/d*s; }
    else { g.position.x+=Math.sin(w.phase*0.5)*dt; g.position.z+=Math.cos(w.phase*0.4)*dt; }
    if(distToTrain(g.position.x,g.position.z)<C.heatRadius+1){ g.position.x-=dx/d*dt*4; g.position.z-=dz/d*dt*4; }
    g.rotation.y=Math.atan2(dx,dz); g.position.y=heightAt(g.position.x,g.position.z)+(w.def&&w.def.look!=='wraith'?0:Math.sin(w.phase*2)*0.25);
    if(w.hit>0){ w.hit-=dt; w.mat.emissive.setHex(0x553311); } else w.mat.emissive.setHex(0x0a1a2a);
    const ldx=player.pos.x-g.position.x, ldz=player.pos.z-g.position.z, ld=Math.max(0.01,Math.hypot(ldx,ldz));
    if(ld<1.5&&!inHeat){ hurt(W.touchDrainPerSec*(w.def?w.def.touchMult:1)*(CFG().wraithTouchMult||1)*dt); hurtT=0.3; player.pos.x+=ldx/ld*dt*3; player.pos.z+=ldz/ld*dt*3; }
  }
  if(netAuth) updateBoss(dt,inHeat,timeLeft<=0); else netFollowBoss(dt,inHeat); coopTick(dt); netTick(dt); updateEnemyShots(dt); updateFood(dt); updateVault();
  if(hurtT>0) hurtT-=dt; $('hurt').style.opacity=hurtT>0?1:0;
  for(let i=flares.length-1;i>=0;i--){
    const f=flares[i]; f.life-=dt; f.v.y-=(f.grav??6)*dt; f.m.position.addScaledVector(f.v,dt);
    let hit=bossHitTest(f);
    if(!hit) for(let j=wraiths.length-1;j>=0;j--){
      const w=wraiths[j];
      if(f.m.position.distanceTo(tmpV.copy(w.g.position).setY(w.g.position.y+enemyHitY(w)))<(weapon.range||1.5)){
        hit=true; damageEnemy(w,f.dmg||1);
        break;
      }
    }
    if(hit||f.life<=0||f.m.position.y<heightAt(f.m.position.x,f.m.position.z)){ world.remove(f.m); flares.splice(i,1); }
  }
  fireCd-=dt; if(weapon.auto&&fireHeld) fire();
  interact(dt);
  if(player.temp<=0){ player.temp=0; player.hp-=HPC().frozenHpPerSec*dt; hurtT=Math.max(hurtT,0.15); }
  else if(player.temp<TMP().max*HPC().coldBelowPct/100) player.hp-=HPC().coldHpPerSec*dt;
  if(player.hp<=0) collapse();
  if(state==='play') hud(inHeat);
}
function loop(){ requestAnimationFrame(loop); const dt=Math.min(clock.getDelta(),0.05); update(dt); updateMixersLod(dt); perfTick(dt); if(zooActive) renderer.render(zooScene,state==='zoowalk'?camera:zooCam); else renderer.render(scene,camera); }
