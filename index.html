<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a111d">
<style>body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}img{max-width:100%}</style>
<title>烏托邦</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
/* Layout: full-bleed 3D canvas; HUD pinned to the four corners; one committed night-frost world (ember = warmth, ice = cold) */
:root{
  --night:#0a111d;
  --frost:#d6ebf5;
  --frost-dim:#8aa4b6;
  --ice:#7cc8e8;
  --ember:#ff9a3c;
  --danger:#ff5d5d;
  --panel:rgba(9,16,28,.66);
  --line:rgba(160,205,230,.22);
  --font-ui:"Noto Sans TC",system-ui,sans-serif;
  --font-num:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--frost);font-family:var(--font-ui);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.lbl{font-size:11px;letter-spacing:.14em;color:var(--frost-dim)}

#hud{position:fixed;inset:0;pointer-events:none}
.corner{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.tl{top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));width:min(210px,42vw)}
.tr{top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));min-width:130px}
.tc{top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.bar{height:8px;background:rgba(124,200,232,.15);border-radius:4px;overflow:hidden;margin:5px 0 3px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ice),var(--ember));transition:width .2s linear}
#tempTxt{font-size:26px;font-weight:700;line-height:1}
#tempTxt.cold{color:var(--ice)}
#tempTxt.crit{color:var(--danger)}
#heatTag{font-size:11px;color:var(--ember);margin-top:2px}
.row{display:flex;justify-content:space-between;gap:14px;font-size:13px;line-height:1.55}
.row b{font-family:var(--font-num);font-size:16px;font-weight:700}
.sep{height:1px;background:var(--line);margin:5px 0}
#arrow{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:14px solid var(--ember);transition:transform .08s linear}
#trainDist{font-size:15px}
#storm{font-size:13px}
#storm.warn{color:var(--danger);font-weight:700}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--frost);box-shadow:0 0 0 2px rgba(0,0,0,.35)}
#ammo{position:absolute;left:50%;top:50%;transform:translate(14px,10px);font-size:13px;color:var(--ember);white-space:nowrap}
#prompt{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 14px;font-size:14px;white-space:nowrap}
#prog{display:block;height:3px;background:var(--ice);width:0;margin-top:5px;border-radius:2px}
#toast{position:fixed;pointer-events:none;z-index:5;width:max-content;max-width:calc(100vw - 32px);left:50%;top:32%;transform:translateX(-50%);font-size:15px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.8);text-align:center;transition:opacity .4s}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(150,215,255,.55) 100%);opacity:0;transition:opacity .3s}
#hurt{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(120,0,40,.5) 100%);opacity:0;transition:opacity .15s}

#touch{position:fixed;inset:0;pointer-events:none}
#stick{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:120px;height:120px;border-radius:50%;border:1px solid var(--line);background:rgba(9,16,28,.35);pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(214,235,245,.28)}
.tbtn{position:absolute;pointer-events:auto;border-radius:50%;border:1px solid var(--line);background:rgba(9,16,28,.55);color:var(--frost);font:700 13px var(--font-ui);display:grid;place-items:center}
.tbtn:active,.tbtn.on{background:rgba(255,154,60,.35)}
#btnFire{right:max(24px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:78px;height:78px}
#btnAct{right:calc(max(24px,env(safe-area-inset-right,0px)) + 92px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:66px;height:66px}
#btnRun{right:calc(max(24px,env(safe-area-inset-right,0px)) + 6px);bottom:calc(env(safe-area-inset-bottom,0px) + 132px);width:56px;height:56px;font-size:12px}

#screen{position:fixed;inset:0;display:grid;place-items:center;background:rgba(6,11,20,.82);overflow-y:auto;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{max-width:460px;width:100%;display:flex;flex-direction:column;gap:14px}
.card h1{font-family:var(--font-ui);font-weight:900;font-size:40px;letter-spacing:.08em;margin:0;line-height:1.1;text-wrap:balance}
.card h1 small{display:block;font-family:var(--font-num);font-size:14px;letter-spacing:.3em;color:var(--ice);font-weight:500;margin-bottom:6px}
.card h2{margin:0;font-size:24px;text-wrap:balance}
.card p{margin:0;line-height:1.7;color:var(--frost-dim);font-size:14px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;border-top:1px solid var(--line);padding-top:12px}
.keys kbd{font-family:var(--font-num);font-size:13px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--frost);white-space:nowrap}
.btn{appearance:none;border:0;border-radius:6px;background:var(--ember);color:#1a0d02;font:900 16px var(--font-ui);padding:13px 18px;cursor:pointer;letter-spacing:.1em}
.btn:focus-visible{outline:2px solid var(--frost);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--frost);border:1px solid var(--line)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1}
.ledger{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ledger div{border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center}
.ledger b{display:block;font-family:var(--font-num);font-size:26px;color:var(--frost)}
.ledger span{font-size:12px;color:var(--frost-dim)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:13px;border:1px solid rgba(255,154,60,.45);color:var(--ember);border-radius:999px;padding:2px 10px}
@media (prefers-reduced-motion:reduce){.bar i,#arrow,#toast,#vignette{transition:none}}
/* 營地（hub）與圖鑑 */
.hub{max-width:620px;width:100%;display:flex;flex-direction:column;gap:16px}
.hub-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hub-head h1{font-weight:900;font-size:34px;letter-spacing:.08em;margin:0;line-height:1.1}
.hub-head h1 small{display:block;font-family:var(--font-num);font-size:13px;letter-spacing:.3em;color:var(--ice);font-weight:500;margin-bottom:6px}
.savechip{font-size:12px;color:var(--frost-dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.savechip.cloud{color:var(--ice);border-color:rgba(124,200,232,.45)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;letter-spacing:.12em;color:var(--frost-dim)}
.sec-title b{font-family:var(--font-num);font-size:15px;color:var(--frost);letter-spacing:.04em}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.dex div{border:1px solid var(--line);border-left:3px solid var(--rc,var(--line));border-radius:6px;padding:7px 8px;min-width:0}
.dex b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dex span{font-size:11px;color:var(--frost-dim)}
.dex .unk b{color:var(--frost-dim);letter-spacing:.2em}
.dex .unk{opacity:.6}
.soon{font-size:13px;color:var(--frost-dim);border:1px dashed var(--line);border-radius:6px;padding:10px 12px;line-height:1.6}
.loading{font-size:14px;color:var(--frost-dim);letter-spacing:.1em}

/* 手機橫向：高度很矮時壓縮 HUD 與按鈕 */
@media (orientation:landscape) and (max-height:520px){
  .corner{padding:5px 8px}
  .tl{width:min(170px,26vw)}
  #tempTxt{font-size:20px}
  .row{font-size:12px;line-height:1.35}
  .row b{font-size:14px}
  .lbl{font-size:10px}
  #prompt{bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
  #stick{width:104px;height:104px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
  #btnFire{bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
  #btnAct{bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
  #btnRun{bottom:calc(env(safe-area-inset-bottom,0px) + 110px)}
  #toast{top:24%}
}
#rotateHint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 170px);transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:13px;color:var(--ice);white-space:nowrap;pointer-events:none}
@media (orientation:landscape){#rotateHint{display:none}}
.auth{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.auth input{flex:1;min-width:0;background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--frost);font:14px var(--font-ui);padding:10px 12px}
.auth input:focus-visible{outline:2px solid var(--ice);outline-offset:1px}
.auth .btn{padding:10px 14px;font-size:14px}
.auth-note{font-size:12px;color:var(--frost-dim)}

/* 園區介面 */
#touch.walk #btnAct,#touch.walk #btnFire{display:none}
#zooUI{position:fixed;inset:0;pointer-events:none}
#zooUI button{pointer-events:auto;cursor:pointer}
.ztop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.zres{display:flex;flex-wrap:wrap;gap:6px}
.zres span{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 9px;display:flex;align-items:baseline;gap:6px;font-size:12px}
.zres i{font-style:normal;color:var(--frost-dim)}
.zres b{font-size:17px;font-weight:700}
.zres .warnchip{color:var(--danger);font-weight:700}
.zacts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.zpool{font-size:13px;color:var(--ember)}
.zbtn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--frost);font:700 13px var(--font-ui);border-radius:6px;padding:8px 12px}
.zbtn.go{background:var(--ember);color:#1a0d02;border-color:transparent}
.zbtn:focus-visible,.ztool:focus-visible,.zmini:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.ztools{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-direction:column;gap:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:auto;scrollbar-width:none}
.ztool{flex:0 0 auto;appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--frost);border-radius:6px;padding:7px 11px;text-align:left;display:flex;flex-direction:column;gap:1px;font-family:var(--font-ui)}
.ztool b{font-size:13px}
.ztool span{font-size:11px;color:var(--frost-dim);white-space:nowrap}
.ztool.on{border-color:var(--ember);box-shadow:inset 0 0 0 1px var(--ember)}
.ztool.poor span{color:var(--danger)}
.zpanel{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 70px);width:min(340px,calc(100vw - 24px));max-height:55vh;overflow-y:auto;background:rgba(9,16,28,.9);border:1px solid var(--line);border-radius:8px;padding:12px;pointer-events:auto;display:flex;flex-direction:column;gap:10px}
.zp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.zp-head b{display:block;font-size:16px}
.zp-head span{font-size:12px;color:var(--frost-dim)}
.zpanel em{font-style:normal;color:var(--danger)}
.zclose{appearance:none;background:transparent;border:1px solid var(--line);color:var(--frost);border-radius:6px;width:30px;height:30px}
.zp-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;border-top:1px solid var(--line);padding-top:8px}
.zp-name{min-width:0}
.zp-name b{font-size:14px}
.zp-name span{display:block;font-size:11px;color:var(--frost-dim)}
.zp-bars{grid-column:1;display:flex;gap:10px}
.zp-bars label{flex:1;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--frost-dim)}
.zbar{flex:1;height:5px;background:rgba(124,200,232,.15);border-radius:3px;overflow:hidden}
.zbar i{display:block;height:100%;background:var(--ice)}
.zbar.low i{background:var(--danger)}
.zp-row .zmini{grid-column:2;grid-row:1 / span 2;align-self:center}
.zmini{appearance:none;border:1px solid var(--line);background:transparent;color:var(--frost);font:700 12px var(--font-ui);border-radius:6px;padding:6px 10px}
.zmini.add{border-color:rgba(255,154,60,.5);color:var(--ember)}
.zp-add{display:flex;flex-wrap:wrap;gap:6px}
.zp-empty{font-size:12px;color:var(--frost-dim);margin:0}
#zWalkExit{margin-left:auto}
@media (orientation:landscape) and (max-height:520px){.zpanel{max-height:62vh;bottom:calc(env(safe-area-inset-bottom,0px) + 60px)}.zres b{font-size:15px}}

.dextabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.dextab{flex:0 0 auto;appearance:none;border:1px solid var(--line);background:transparent;color:var(--frost-dim);font:700 13px var(--font-ui);border-radius:999px;padding:6px 12px;cursor:pointer}
.dextab b{font-family:var(--font-num);font-weight:500;margin-left:2px}
.dextab.on{color:var(--frost);border-color:var(--ember)}
.dexinfo{font-size:13px;color:var(--frost-dim);border:1px solid var(--line);border-radius:6px;padding:10px 12px;line-height:1.6}
.dexinfo b{color:var(--frost);font-size:15px}
.dexinfo i{font-size:12px}
.dexinfo span{display:block;font-size:12px}
.dexinfo p{margin:4px 0 0;color:var(--frost)}
.dexcell{appearance:none;background:transparent;color:var(--frost);text-align:left;cursor:pointer;font-family:var(--font-ui);border:1px solid var(--line);border-left:3px solid var(--rc,var(--line));border-radius:6px;padding:7px 8px;min-width:0}
.dexcell b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dexcell span{font-size:11px;color:var(--frost-dim)}
.dexcell:focus-visible,.dextab:focus-visible{outline:2px solid var(--ice);outline-offset:2px}

/* 路線圖 */
.mapwrap{max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px}
.maphead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.maphead h2{margin:0;font-size:24px;flex:1}
.maphead span{color:var(--ember);font-size:16px}
.maphead .btn{padding:8px 12px;font-size:13px}
.mapbox{border:1px solid var(--line);border-radius:8px;background:radial-gradient(ellipse at 50% 100%,rgba(255,154,60,.08),transparent 60%),rgba(9,16,28,.55);aspect-ratio:1/1;max-height:58vh;margin-inline:auto;width:100%;max-width:min(560px,58vh)}
.mapbox svg{width:100%;height:100%;display:block}
.lk{stroke:rgba(160,205,230,.18);stroke-width:.5;stroke-dasharray:1.2 1.2}
.lk.open{stroke:rgba(160,205,230,.55);stroke-dasharray:none}
.nd{cursor:pointer;outline:none}
.nd .hit{fill:transparent}
.nd text{font:700 3.1px var(--font-ui);fill:var(--frost)}
.nd .dot{stroke:var(--frost);stroke-width:.5}
.nd .t-ruins{fill:#5b6068}.nd .t-lake{fill:#3f86b0}.nd .t-greenhouse{fill:#3f7a3a}.nd .t-settlement{fill:#8a6a48}.nd .t-home{fill:var(--ember)}
.nd.locked{opacity:.35}.nd.locked text{fill:var(--frost-dim)}
.nd.visited .dot{stroke:var(--ember)}
.nd.avail .dot{stroke:var(--ice);stroke-width:.8}
.nd.sel .dot{stroke:var(--ember);stroke-width:1.1}
.nd:focus-visible .dot{stroke:var(--ice);stroke-width:1.2}
.mapinfo{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.mapinfo b{font-size:17px}
.mapinfo span{font-size:13px;color:var(--frost-dim);line-height:1.5}
.mapinfo .btn{margin-top:4px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.trades{display:flex;flex-direction:column;gap:8px}
.trade{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:6px;padding:9px 10px}
.trade b{display:block;font-size:14px}
.trade span{font-size:12px;color:var(--frost-dim)}
.zmini:disabled{opacity:.4}

/* 工坊 */
.shoplist{display:flex;flex-direction:column;gap:8px}
.shopcard{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.shopcard.on{border-color:var(--ember)}
.sc-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.sc-main b{font-size:15px}
.sc-main em{font-style:normal;font-size:13px;color:var(--ember);margin-left:4px}
.sc-main span{font-size:12px;color:var(--frost-dim);line-height:1.5}
.sc-max{font-size:12px;color:var(--frost-dim);white-space:nowrap}
.shopcard .zmini{white-space:nowrap;flex:0 0 auto}
.statline{font-size:12px;color:var(--ice);line-height:1.6}
.warnline{color:var(--ember)!important}
/* 操作設定 */
#touch.edit #stick,#touch.edit .tbtn{outline:2px dashed var(--ember);outline-offset:3px;cursor:move;touch-action:none}
#touch.edit #btnAct,#touch.edit #btnFire{display:grid}
#ctrlPanel{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);width:min(320px,calc(100vw - 32px));background:rgba(9,16,28,.92);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;pointer-events:auto;font-size:13px}
#ctrlPanel span{color:var(--frost-dim);font-size:12px}
#ctrlPanel label{display:flex;justify-content:space-between;align-items:center;gap:10px}
#ctrlPanel input{flex:1;max-width:180px;accent-color:var(--ember)}
#ctrlPanel .btn{padding:9px 12px;font-size:14px}

/* 繁殖 */
.zp-note{font-size:12px;line-height:1.6;color:var(--frost-dim);border-left:2px solid var(--ember);padding-left:8px}
.zp-btns{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;gap:4px;align-self:center}
.zp-btns .zmini{padding:4px 8px;font-size:11px}
.sx{font-weight:900}.sx.m{color:var(--ice)}.sx.f{color:#e8a0c0}
.stars{font-size:11px;color:#e9c46a;letter-spacing:.05em;font-weight:400}

/* 自由建造工具列 */
.ztabs{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.ztab{flex:0 0 auto;appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--frost-dim);font:700 12px var(--font-ui);border-radius:999px;padding:5px 11px;cursor:pointer}
.ztab.on{color:var(--frost);border-color:var(--ember)}
.zopts{display:flex;gap:6px;align-items:center;margin-left:auto;flex:0 0 auto}

let saveProfile=(()=>{ try{ return localStorage.getItem('utopia-profile')||'p1'; }catch(e){ return 'p1'; } })();

  async list(){ const out=[]; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k!=='utopia-save'&&!k.startsWith('utopia-save:')) continue;
    const id=k==='utopia-save'?'p1':k.slice(12); let d=null; try{ d=JSON.parse(localStorage.getItem(k)); }catch(e){} out.push({id,name:(d&&d.profileName)||'',updatedAt:d&&d.updatedAt,runs:d&&d.runs}); } }catch(e){} return out; },

};
function waitForClaude(ms){
  return new Promise(res => {
    const t0 = Date.now();
    (function poll(){ if(window.claude && window.claude.use) return res(window.claude); if(Date.now()-t0>ms) return res(null); setTimeout(poll, 100); })();
  });

    async remove(slot){ try{ await col.doc(docId(slot)).delete(); }catch(e){ try{ await col.doc(docId(slot)).set({deleted:true}); }catch(_){} } const L=(await readIdx()).filter(x=>x.id!==slot); await idx.set({list:L}); }
  };
}
let store = LocalStore, save = emptySave(), saving = Promise.resolve();
const SB_URL='https://pujvupwghochfklrgvtq.supabase.co', SB_KEY='sb_publishable_jHEGIwFLfpGOriA-ijixGg_dytbHXQH';
const onOwnSite=/github\.io$|^localhost$|^127\./.test(location.hostname);

function heightAt(x,z){
  const ax=Math.abs(x); let t=Math.min(1,Math.max(0,(ax-6)/14)); t=t*t*(3-2*t);
  const h=2.6*Math.sin(x*0.045)*Math.cos(z*0.038)+1.6*Math.sin(x*0.12+z*0.07)+0.8*Math.sin(z*0.19-x*0.1)+5*Math.sin(x*0.012+1.3)*Math.sin(z*0.015);
  return (h+1.2)*t;
}

function makeModel(sp){
  const g=new THREE.Group();
  if(typeof sp==='string') (MODELS[sp]||MODELS.hare)(g);
  else if(sp.model&&MODELS[sp.model]) MODELS[sp.model](g);
  else if(sp.body){ const inner=new THREE.Group(); bodyModel(inner,sp.body); g.add(inner); }
  else MODELS.hare(g);
  if(typeof sp!=='string'){ const a=speciesAsset(sp); if(a) swapInAsset(g,a.file,a.opt,a.anim); }
  return g;
}

function buildStation(node, seed){

  if(st.lake){
    const L=st.lake; lakeInfo={x:L.x,z:L.z,r:L.radius};
    const lg=new THREE.CircleGeometry(L.radius,56); lg.rotateX(-Math.PI/2);
    const p=lg.attributes.position; for(let i=0;i<p.count;i++) p.setY(i,heightAt(p.getX(i)+L.x,p.getZ(i)+L.z)+0.07);
    lg.computeVertexNormals();
    const lake=new THREE.Mesh(lg,new THREE.MeshPhongMaterial({color:0x9fd2ea,shininess:90,emissive:0x0e2a3a})); lake.position.set(L.x,0,L.z); world.add(lake);
  }
  if(st.greenhouses){
    const glass=new THREE.MeshPhongMaterial({color:0xcfe9f0,transparent:true,opacity:0.28,shininess:100,depthWrite:false}), frame=M(0x3a4a44), leaf=M(0x3a7a3a), soil=M(0x4a3a2a);
    let t2=0;
    while(warmZones.length<st.greenhouses && t2++<300){
      const a=R(0,Math.PI*2), r=R(24,120), x=Math.cos(a)*r, z=Math.sin(a)*r;
      if(!farFromTrain(x,z,6)||warmZones.some(w=>Math.hypot(x-w.x,z-w.z)<20)) continue;
      const y=heightAt(x,z), W=st.warmRadius*1.6, H=4;
      const gnd=box(W,0.12,W,soil); gnd.position.set(x,y+0.05,z); world.add(gnd);
      const g=box(W,H,W,glass); g.position.set(x,y+H/2,z); world.add(g);
      for(const [sx,sz] of [[-1,-1],[1,-1],[-1,1],[1,1]]){ const p=box(0.15,H,0.15,frame); p.position.set(x+sx*W/2,y+H/2,z+sz*W/2); world.add(p); }
      const ridge=box(W,0.15,0.15,frame); ridge.position.set(x,y+H,z); world.add(ridge);
      for(let k=0;k<6;k++){ const c=new THREE.Mesh(new THREE.ConeGeometry(R(0.4,0.8),R(1,2.2),6),leaf); c.position.set(x+R(-W/2+1,W/2-1),y+0.9,z+R(-W/2+1,W/2-1)); world.add(c); }
      warmZones.push({x,z,r:st.warmRadius});
    }
  }
  const ruins=[]; let tries=0;

    const a=R(0,Math.PI*2), r=R(26,135), x=Math.cos(a)*r, z=Math.sin(a)*r;
    if(!farFromTrain(x,z,4) || avoid(x,z) || ruins.some(o=>Math.hypot(o.x-x,o.z-z)<18)) continue;
    ruins.push({x,z});
  }
  for(const o of ruins){
    const y=heightAt(o.x,o.z), hgt=R(2.2,4.2), sz=R(5,7), skip=Math.floor(R(0,4)), mat=rng()<0.5?wallMat:woodMat;
    [{w:sz,d:0.4,x:0,z:-sz/2},{w:sz,d:0.4,x:0,z:sz/2},{w:0.4,d:sz,x:-sz/2,z:0},{w:0.4,d:sz,x:sz/2,z:0}].forEach((wl,i)=>{
      if(i===skip) return;
      const hh=hgt*R(0.5,1), m=box(wl.w,hh,wl.d,mat); m.position.set(o.x+wl.x,y+hh/2-0.3,o.z+wl.z); world.add(m);
      const cap=box(wl.w+0.1,0.15,wl.d+0.1,snowCap); cap.position.set(m.position.x,y+hh-0.25,m.position.z); world.add(cap);
      colliders.push({x0:m.position.x-wl.w/2,x1:m.position.x+wl.w/2,z0:m.position.z-wl.d/2,z1:m.position.z+wl.d/2});
    });

  for(let i=0;i<st.looseCrates;i++){ const a=R(0,Math.PI*2), r=R(18,110), x=Math.cos(a)*r, z=Math.sin(a)*r; if(farFromTrain(x,z,2)&&!avoid(x,z)) addCrate(x,z); }
  const trunk=M(0x2b2420), pine=M(0x23362f);
  biomeExtras(biome,avoid);
  for(let i=0;i<Math.round(st.trees*biome.treesMult);i++){
    const a=R(0,Math.PI*2), r=R(15,190), x=Math.cos(a)*r, z=Math.sin(a)*r;
    if(!farFromTrain(x,z,1)||avoid(x,z)) continue;
    const y=heightAt(x,z), show=((i*37)%100)/100<Q().trees, addT=o=>{ if(show) world.add(o); };   // 畫質低時少畫一些樹，但亂數照樣消耗，多人地圖才會一致
    const assetPick=(list,o)=>{ const A=DATA.assets; if(!A) return null; const f=A.nature[list][Math.floor(rng()*A.nature[list].length)]; return staticAsset(f,o); };
    if(rng()<0.65){
      const h=R(3,6), at=assetPick('snowTrees',{height:h*1.15});
      if(at){ at.rotation.y=R(0,6.28); const w=new THREE.Group(); w.add(at); w.position.set(x,y-0.1,z); w.rotation.y=R(0,6.28); addT(w); colliders.push({x0:x-0.35,x1:x+0.35,z0:z-0.35,z1:z+0.35}); continue; }
      const g=new THREE.Group();
      const t=cyl(0.15,0.25,h,trunk,6); t.position.y=h/2; g.add(t);
      if(rng()<0.6){ const c=new THREE.Mesh(new THREE.ConeGeometry(R(1,1.6),h*0.8,7),pine); c.position.y=h*0.75; g.add(c); const s=new THREE.Mesh(new THREE.ConeGeometry(0.7,0.8,7),snowCap); s.position.y=h*1.1; g.add(s); }
      g.position.set(x,y-0.2,z); addT(g); colliders.push({x0:x-0.3,x1:x+0.3,z0:z-0.3,z1:z+0.3});
    } else {
      const s=R(0.6,1.8), ar=assetPick('snowRocks',{height:s*1.3});

      const rk=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),M(0x6a7078)); rk.position.set(x,y+s*0.3,z); rk.rotation.set(R(0,3),R(0,3),0); addT(rk);
      colliders.push({x0:x-s*0.8,x1:x+s*0.8,z0:z-s*0.8,z1:z+s*0.8});
    }

  let placed=0; tries=0;
  while(st.ice && placed<st.ice.count && tries++<400){
    const sp=pickSpecies(node,st.ice.categories); if(!sp) break;
    const minD=DATA.config.rarity[sp.rarity].minDist;
    const a=R(0,Math.PI*2), r=R(minD,Math.max(minD+20,130)), x=Math.cos(a)*r, z=Math.sin(a)*r;
    if(!farFromTrain(x,z,6)||avoid(x,z)) continue;
    if(interactables.some(it=>it.type==='ice'&&Math.hypot(it.pos.x-x,it.pos.z-z)<25)) continue;
    placeIce(sp,x,z,R(0,6.28)); placed++;
  }
  // 釣魚洞／昆蟲
  const C=st.catch;
  if(C) for(let i=0;i<C.count;i++){
    const sp=pickSpecies(node,C.categories); if(!sp) break;
    let x,z;
    if(C.kind==='hole'&&lakeInfo){ const a=R(0,6.28), r=R(4,lakeInfo.r*0.85); x=lakeInfo.x+Math.cos(a)*r; z=lakeInfo.z+Math.sin(a)*r; }
    else if(warmZones.length){ const w=warmZones[Math.floor(R(0,warmZones.length))], a=R(0,6.28), r=R(0,w.r*0.7); x=w.x+Math.cos(a)*r; z=w.z+Math.sin(a)*r; }

    placeCatch(sp,C,x,z);

}
function placeCatch(sp,C,x,z){

  else { bug=makeModel(sp); bug.scale.multiplyScalar(1.6); bug.position.y=0.8; g.add(bug); }
  const mk=addMarker(g,rc,C.kind==='hole'?1.4:1.9); world.add(g);

}
function placeIce(sp,x,z,rot){

function addCrate(x,z){

canvas.addEventListener('touchstart',e=>{ for(const t of e.changedTouches) if(lookTouch.id===null){ lookTouch.id=t.identifier; lookTouch.x=t.clientX; lookTouch.y=t.clientY; } },{passive:true});
addEventListener('touchmove',e=>{ for(const t of e.changedTouches){ if(t.identifier===joy.id) moveJoy(t); else if(t.identifier===lookTouch.id){ look(t.clientX-lookTouch.x,t.clientY-lookTouch.y,0.006); lookTouch.x=t.clientX; lookTouch.y=t.clientY; } } if(state==='play'||state==='zoowalk'||state==='zoo') e.preventDefault(); },{passive:false});
const endTouch=e=>{ for(const t of e.changedTouches){ if(t.identifier===joy.id){ joy.id=null; joy.x=joy.y=0; knob.style.transform=''; } if(t.identifier===lookTouch.id) lookTouch.id=null; } };
addEventListener('touchend',endTouch); addEventListener('touchcancel',endTouch);
const btnAct=$('btnAct'), btnFire=$('btnFire'), btnRun=$('btnRun');
btnAct.addEventListener('pointerdown',e=>{ e.preventDefault(); if(state==='ctrledit') return; if(!actHeld) actPressed=true; actHeld=true; });
['pointerup','pointercancel','pointerleave'].forEach(ev=>btnAct.addEventListener(ev,()=>{ actHeld=false; }));
btnFire.addEventListener('pointerdown',e=>{ e.preventDefault(); if(state==='ctrledit') return; fireHeld=true; fire(); });
['pointerup','pointercancel','pointerleave'].forEach(ev=>btnFire.addEventListener(ev,()=>{ fireHeld=false; }));
$('btnHeal').addEventListener('pointerdown',e=>{ e.preventDefault(); if(state==='ctrledit') return; useHeal(); });
$('btnEat').addEventListener('pointerdown',e=>{ e.preventDefault(); if(state==='ctrledit') return; eatFood(); });
btnRun.addEventListener('pointerdown',e=>{ e.preventDefault(); if(state==='ctrledit') return; sprint=!sprint; btnRun.classList.toggle('on',sprint); });

const flareMat=new THREE.MeshBasicMaterial({color:0xffb064});
let fireCd=0, fireHeld=false;
function fire(){
  if(state!=='play'||fireCd>0) return;
  if(weapon.melee||ammo<=0){ meleeAttack(); return; }
  ammo--; fireCd=weapon.cooldown||0.2;
  const base=new THREE.Vector3(0,0,-1).applyEuler(camera.rotation), n=weapon.pellets||1, sp=weapon.spread||0, flame=!!weapon.auto;
  for(let k=0;k<n;k++){
    const dir=base.clone(); if(sp){ dir.x+=(Math.random()-0.5)*sp*2; dir.y+=(Math.random()-0.5)*sp*2; dir.z+=(Math.random()-0.5)*sp*2; dir.normalize(); }
    const m=sph(flame?0.18:0.13,flareMat);
    const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:DOT,color:flame?0xff6a1a:0xff9a3c,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending})); glow.scale.set(flame?2.2:1.6,flame?2.2:1.6,1); m.add(glow);
    m.position.copy(camera.position).addScaledVector(dir,0.6); world.add(m);
    flares.push({m,v:dir.multiplyScalar(weapon.projectileSpeed),life:weapon.life||1.6,dmg:weapon.damage,grav:weapon.grav??(flame?0:6)});
  }
}

let toastT=0;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.opacity=1; toastT=2.8; }
const fmt=s=>{ s=Math.max(0,Math.ceil(s)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };

  else { st.textContent='暴風雪來了・快登車'; st.className='num warn'; }
  const tz=Math.max(TRAIN_Z0,Math.min(TRAIN_Z1,player.pos.z)), dx=-player.pos.x, dz=tz-player.pos.z;

/* 互動 */
function nearest(){
  let best=null,bd=3.2;
  for(const it of interactables){ if(it.done||inTrain!==!!it.inside) continue; const d=Math.hypot(it.pos.x-player.pos.x,it.pos.z-player.pos.z); if(d<bd){bd=d;best=it;} }
  if(!inTrain&&Math.hypot(DEPART.x-player.pos.x,DEPART.z-player.pos.z)<3.4) best={type:'depart'};
  return best;
}
let lastTarget=null;
function interact(dt){
  const it=nearest(), pr=$('prompt'), pt=$('promptTxt'), pg=$('prog'), key=isTouch?'互動':'E';
  if(it!==lastTarget && lastTarget && !lastTarget.done){ if(lastTarget.type==='ice'){ lastTarget.thaw=0; lastTarget.ice.scale.setScalar(1); } if(lastTarget.type==='catch') lastTarget.prog=0; }
  lastTarget=it;
  if(!it){ pr.hidden=true; actPressed=false; return; }
  pr.hidden=false; pg.style.width='0';
  if(it.type==='crate'){
    const full=bagCount()>=CFG().bagCapacity;
    pt.textContent=full?'背包已滿，先回火車存放':`[${key}] 搜刮${it.item.name}箱`;
    if(actPressed&&!full){
      const take=Math.min(it.amount,CFG().bagCapacity-bagCount());
      bag[it.item.id]+=take; it.amount-=take; toast(`取得 ${it.item.name} ×${take}`);
      if(it.amount<=0){ it.done=true; world.remove(it.group); coopSend('take',{t:'crate',x:it.pos.x,z:it.pos.z}); }
    }
  } else if(it.type==='tdoor'||it.type==='tslot'||it.type==='tbench'){
    trainInteract(it,pt,key);
  } else if(it.type==='vault'){
    pt.textContent=`[${key}] 打開碉堡寶箱`; if(actPressed) openVaultChest(it);
  } else if(it.type==='note'){
    pt.textContent=`[${key}] 撿起日誌`; if(actPressed) readNote(it);
  } else if(it.type==='ammo'){
    pt.textContent=ammo>=weapon.ammo?'彈藥是滿的':`[${key}] 補充彈藥`;
    if(actPressed&&ammo<weapon.ammo){ ammo=weapon.ammo; it.done=true; world.remove(it.group); toast(`${weapon.name}彈藥補滿了`); }
  } else if(it.type==='ice'&&it.locked){
    pt.textContent=`${it.species.name}被${boss?boss.def.name:'首領'}的寒氣封住了，先擊敗牠`;
  } else if(it.type==='ice'){
    const sp=it.species, rar=DATA.config.rarity[sp.rarity];
    if(followers.length>=CFG().followCapacity) pt.textContent=`同時最多帶 ${CFG().followCapacity} 隻，先送回火車`;
    else{
      const known=save.collection[sp.id]?'':'・新物種';
      pt.textContent=`長按 [${key}] 融冰救援 ${sp.name}（${rar.name}${known}）`;
      if(actHeld){ it.thaw+=dt/1.8*(CFG().thawMult||1); it.ice.scale.setScalar(Math.max(0.05,1-it.thaw*0.9)); }
      else if(it.thaw>0){ it.thaw=Math.max(0,it.thaw-dt); it.ice.scale.setScalar(1-it.thaw*0.9); }
      pg.style.width=Math.min(100,it.thaw*100)+'%';
      if(it.thaw>=1){
        it.done=true; it.group.remove(it.ice); it.group.remove(it.marker); coopSend('take',{t:'ice',x:it.pos.x,z:it.pos.z});
        const an=it.animal; it.group.remove(an); an.position.copy(it.pos); world.add(an); freezeAnim(an,false); setAnim(an,'walk');
        followers.push({mesh:an,species:sp,origin:it.pos.clone(),rot:an.rotation.y,hop:Math.random()*6});
        toast(`${sp.name} 救出來了！帶牠回火車`);
      }
    }
  } else if(it.type==='catch'){
    const cap=CFG().containerCapacity, sp=it.species, rar=DATA.config.rarity[sp.rarity];
    if(container.length>=cap) pt.textContent=`容器滿了（${cap}），先回火車`;
    else{
      pt.textContent=it.kind==='hole'?`長按 [${key}] 釣魚（${rar.name}）`:`長按 [${key}] 捕捉 ${sp.name}（${rar.name}${save.collection[sp.id]?'':'・新物種'}）`;
      if(actHeld) it.prog+=dt*(CFG().catchSpeed||1)/it.secs; else it.prog=Math.max(0,it.prog-dt);
      pg.style.width=Math.min(100,it.prog*100)+'%';
      if(it.prog>=1){ it.done=true; world.remove(it.group); coopSend('take',{t:'catch',x:it.pos.x,z:it.pos.z}); container.push(sp.id); toast(`${it.kind==='hole'?'釣到':'抓到'} ${sp.name}（${rar.name}${save.collection[sp.id]?'':'・新物種'}）`); }
    }
  } else if(it.type==='depart'){
    pt.textContent=`[${key}] 登車出發`;
    if(actPressed) askDepart();
  }
  actPressed=false;
}
function depositAll(){ for(const k in bag){ haul[k]+=bag[k]; bag[k]=0; } }
function boardContainer(){ const n=container.length; rescued.push(...container); container=[]; return n; }
function boardFollowers(){ for(const f of followers){ rescued.push(f.species.id); world.remove(f.mesh); } const names=followers.map(f=>f.species.name); followers=[]; return names; }

function askDepart(){
  state='confirm'; if(document.exitPointerLock) document.exitPointerLock();
  const left=followers.length?`還有 ${followers.length} 隻跟著你，牠們會一起上車。`:'';
  screenEl.hidden=false;
  screenEl.innerHTML=`<div class="card"><h2>現在出發？</h2><p>背包裡的物資會自動存進車廂。${left}還沒搜刮的地點就留在這片冰原了。</p>
    <div class="btns"><button class="btn ghost" id="stay" type="button">再找一下</button><button class="btn" id="go" type="button">鳴笛出發</button></div></div>`;
  $('stay').onclick=()=>{ screenEl.hidden=true; state='play'; if(!isTouch) tryLock(); };
  $('go').onclick=()=>{ depositAll(); boardFollowers(); boardContainer(); finish(false); };
}

function collapse(){
  if(inTrain) setInTrain(false);
  const D=DATA.config.death, T=TMP();
  // 隨機掉落一部分背包物品
  const units=[]; for(const k in bag) for(let i=0;i<bag[k];i++) units.push(k);
  const dropN=Math.round(units.length*D.dropFraction);
  for(let i=0;i<dropN;i++){ const j=Math.floor(Math.random()*units.length); bag[units[j]]--; units.splice(j,1); }
  // 跟隨的生物跑回原地重新被冰封
  const lost=followers.length;
  for(const f of followers){ world.remove(f.mesh); if(D.followersReturnToIce) placeIce(f.species,f.origin.x,f.origin.z,f.rot); }
  followers=[]; collapses++;
  const lostC=container.length; container=[];
  if(timeLeft<=0){ finish(true); return; }
  player.pos.set(4.5,0,8); player.temp=T.respawnTemp+(CFG().respawnBonus||0); player.hp=HPC().respawnHp; timeLeft=Math.max(5,timeLeft-T.collapseTimePenalty);
  toast(`你失溫倒下，被列車員拖回來。掉了 ${dropN} 件物資${lost?`，${lost} 隻生物跑回原地`:''}${lostC?`，容器裡的 ${lostC} 隻生物也跑掉了`:''}`);
}

/* 結算 → 寫入存檔 */
function finish(failed){
  coopSend('leave',{id:coopId});
  state='result'; $('rotateHint').hidden=true; if(document.exitPointerLock) document.exitPointerLock();
  $('hud').hidden=true; $('touch').hidden=true;
  const newOnes=rescued.filter(id=>!save.collection[id]);
  ensureZoo(); save.zoo.research=(save.zoo.research||0)+new Set(newOnes).size*(DATA.config.researchPerNewSpecies||0)+(STATS&&STATS.researchPerRun||0);
  save.runs++;
  save.map=save.map||{visited:['utopia']}; if(curNode&&curNode.type!=='stall'&&!save.map.visited.includes(curNode.id)) save.map.visited.push(curNode.id);
  for(const k in haul) save.resources[k]=(save.resources[k]||0)+haul[k];
  ensureZoo();
  for(const id of rescued){ save.collection[id]=(save.collection[id]||0)+1; save.zoo.unplaced[id]=(save.zoo.unplaced[id]||0)+1; }
  const bossHtml=bossSettle();
  persist();
  for(const k in haulBanked) haul[k]=(haul[k]||0)+haulBanked[k];   // 結算畫面也算進途中存進倉庫的部分
  const total=Object.values(haul).reduce((a,b)=>a+b,0);
  const grade=trainBrokenRun?'火車被攻破了':failed?'列車在暴風雪中被迫出發':rescued.length>=4?'傳奇救援':rescued.length>=2?'順利歸隊':'勉強撐過';
  screenEl.hidden=false;
  screenEl.innerHTML=`<div class="card">
    <h1><small>EXPEDITION ${String(save.runs).padStart(2,'0')} · ${esc(curNode?curNode.name:'')}</small>${grade}</h1>
    ${trainBrokenRun?`<p>霜影攻破了火車，只能丟下一半的物資逃走。</p>`:failed?'<p>你在暴風雪中失溫，列車員把你拖上車後只能鳴笛離開。</p>':''}${STATS&&STATS.researchPerRun?`<p>研究車廂整理了資料：研究 +${STATS.researchPerRun}</p>`:''}
    <div class="ledger">${DATA.items.filter(i=>i.core||haul[i.id]).map(i=>`<div><b class="num">${haul[i.id]||0}</b><span>${esc(i.name)}</span></div>`).join('')}<div><b class="num">${rescued.length}</b><span>生物</span></div></div>
    ${rescued.length?`<div class="tags">${rescued.map(id=>`<span>${esc(DATA.speciesById[id].name)}${newOnes.includes(id)?'・新':''}</span>`).join('')}</div>`:'<p>這趟沒有救到生物。</p>'}
    ${bossHtml}
    <p>共帶回物資 ${total} 單位${collapses?`，途中倒下 ${collapses} 次`:''}${newOnes.length?`，圖鑑新增 ${new Set(newOnes).size} 種`:''}。</p>
    ${curNode&&curNode.type==='stall'?stallButtons():''}
    <button class="btn${curNode&&curNode.type==='stall'?' ghost':''}" id="toHub" type="button">回到烏托邦</button>
  </div>`;
  $('toHub').onclick=()=>enterZoo();
  if(curNode&&curNode.type==='stall') wireStall();
}

function authHtml(){
  if(sbUser) return `<div class="sec"><div class="auth"><span class="auth-note">已登入 ${esc(sbUser.email||'')}，進度會同步到雲端</span><button class="btn ghost" id="logout" type="button">登出</button></div></div>`;
  return `<div class="sec"><form class="auth" id="loginForm"><input id="email" type="email" required placeholder="輸入 Email 登入，跨裝置同步存檔" autocomplete="email"><button class="btn" type="submit">寄登入連結</button></form><span class="auth-note" id="authMsg">沒登入也能玩，進度會先存在這台裝置。</span></div>`;
}
function wireAuth(){
  const f=$('loginForm');
  if(f) f.addEventListener('submit',async e=>{
    e.preventDefault();
    const email=$('email').value.trim(), msg=$('authMsg');
    msg.textContent='寄送中…';
    const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
    msg.textContent=error?`寄送失敗：${error.message}`:`登入連結已寄到 ${email}，在這台裝置打開信件裡的連結就完成登入。`;
  });
  const lo=$('logout');
  if(lo) lo.onclick=async()=>{ await sb.auth.signOut(); sbUser=null; store=LocalStore; careerSave=save; activeSlot='career'; showModeSelect(); };
}

const tileCenter=(b)=>{ const d=bdef(b.type); return { x:(b.x+d.size[0]/2-GN()/2)*TS(), z:(b.z+d.size[1]/2-GN()/2)*TS() }; };
const tileDist=(a,b)=>{ const d1=bdef(a.type), d2=bdef(b.type); return Math.hypot((a.x+d1.size[0]/2)-(b.x+d2.size[0]/2),(a.z+d1.size[1]/2)-(b.z+d2.size[1]/2)); };
const findB=uid=>save.zoo.buildings.find(b=>b.uid===uid);
function occupancy(){ const m=new Map(); for(const b of save.zoo.buildings){ const d=bdef(b.type); if(!d) continue;
    if(b.poly){ for(let i=0;i<d.size[0];i++) for(let j=0;j<d.size[1];j++){ const x=(b.x+i+0.5-GN()/2)*TS(), z=(b.z+j+0.5-GN()/2)*TS(); if(pointInPoly(x,z,b.poly)) m.set((b.x+i)+','+(b.z+j),b.uid); } continue; } for(let i=0;i<d.size[0];i++) for(let j=0;j<d.size[1];j++) m.set((b.x+i)+','+(b.z+j),b.uid); } return m; }
function canPlace(d,x,z){ if(x<0||z<0||x+d.size[0]>GN()||z+d.size[1]>GN()) return false; const o=occupancy(); for(let i=0;i<d.size[0];i++) for(let j=0;j<d.size[1];j++) if(o.has((x+i)+','+(z+j))) return false; return true; }
const resOf=k=>k==='coins'?save.zoo.coins:k==='research'?(save.zoo.research||0):(save.resources[k]||0);
const resName=k=>k==='coins'?'金幣':k==='research'?'研究':(DATA.itemsById[k]?DATA.itemsById[k].name:k);

/* ---------- 模擬：需求、溫度、門票 ---------- */
function heatersOn(){ return zooStats.heatOn; }
function habitatTemp(b){
  const d=bdef(b.type); if(waterRegulated(b)) return autoTemp(b);
  let t=(d.baseTemp==='auto'?autoTemp(b):(d.baseTemp||0))+(d.baseTemp==='auto'?0:worldTempOffset(b)+coolerOffset(b));
  if(heatersOn()) for(const h of save.zoo.buildings){ const hd=bdef(h.type); if(hd.kind==='heater' && isWorking(h) && tileDist(h,b)<=hd.radius+Math.max(...d.size)/2) t+=hd.heat; }
  return t;
}
function autoTemp(b){ const sp=save.zoo.animals.filter(a=>a.habitat===b.uid).map(a=>DATA.speciesById[a.species]).filter(Boolean); if(!sp.length) return 15; const lo=Math.max(...sp.map(s=>s.tempRange[0])), hi=Math.min(...sp.map(s=>s.tempRange[1])); return Math.round(lo<=hi?(lo+hi)/2:sp.reduce((t,s)=>t+(s.tempRange[0]+s.tempRange[1])/2,0)/sp.length); }
function habitatFed(b){ const d=bdef(b.type); return save.zoo.buildings.some(f=>{ const fd=bdef(f.type); return fd.kind==='feeder' && isWorking(f) && tileDist(f,b)<=fd.radius+Math.max(...d.size)/2; }); }
function simulate(min){
  const Z=ZC(), zoo=save.zoo;
  // 暖爐耗煤
  const heaters=zoo.buildings.filter(b=>bdef(b.type).kind==='heater');
  if(heaters.length){
    zoo.fuelDebt+=heaters.reduce((s,h)=>s+bdef(h.type).fuelPerMin,0)*min;
    while(zoo.fuelDebt>=1 && (save.resources.fuel||0)>0){ save.resources.fuel--; zoo.fuelDebt--; }
    zooStats.heatOn=(save.resources.fuel||0)>0 || zoo.fuelDebt<1;
  } else zooStats.heatOn=true;
  worldStep(); ensureOps(); ensureResearch(); envDirty(); const rf=RF(), SR=DATA.config.speciesResearch; opsBeforeAnimals(min);
  const temps=new Map(), fed=new Map(), counts=new Map();
  for(const a of zoo.animals){ const k=a.habitat+'|'+a.species; counts.set(k,(counts.get(k)||0)+1); }
  let attract=0;
  for(const a of zoo.animals){
    const b=findB(a.habitat), sp=DATA.speciesById[a.species]; if(!b||!sp) continue;
    if(!temps.has(b.uid)){ temps.set(b.uid,habitatTemp(b)); fed.set(b.uid,habitatFed(b)); }
    a.food=Math.max(0,(a.food??80)-Z.foodDecayPerMin*min);
    while(a.food<Z.feedRefillAt && fed.get(b.uid) && (save.resources.feed||0)>=1){ if(Math.random()<rf.feedEfficiency) save.resources.feed--; a.food=Math.min(100,a.food+Z.feedRefillAmount); }
    const T=temps.get(b.uid), tempOK=T>=sp.tempRange[0]&&T<=sp.tempRange[1];
    const socialOK=!SOCIAL_GROUP.includes(sp.social) || counts.get(b.uid+'|'+a.species)>=2;
    const target=Math.max(0,Math.min(40,a.food/30*40)+(tempOK?40:0)+(socialOK?20:5)-animalOpsPenalty(a,b)-elderPenalty(a)+careHappyDelta(a,b)+rf.happinessBonus+knowLevel(a.species)*SR.happinessPerLevel);
    const h=a.happy??60, step=Z.happinessPerMin*min;
    a.happy=Math.abs(target-h)<=step?target:h+Math.sign(target-h)*step;
    attract+=sp.attract*a.happy/100*(0.8+0.1*(a.stars||2))*(isAdult(a)?1:1.25)*elderAttract(a)*geneSizeMult(a)*(b.poly&&barrierDef(b.barrier).opaque?0.5:1)*(bdef(b.type).walk?FAC().walkAttract:1)*(1+knowLevel(a.species)*SR.attractPerLevel);
  }
  opsEconomy(attract*escapeAttract(),min); computeRating();
  breedingStep(min); agingStep(min); escapeStep(min); fightStep(min); contagionStep(min);
  zoo.lastTick=Date.now();
}
function catchUp(){
  const zoo=save.zoo, Z=ZC();
  let m=Math.min(Z.offlineCapMinutes,Math.max(0,(Date.now()-(zoo.lastTick||Date.now()))/60000));
  // 只有生涯在離線時繼續運作；沙盒與挑戰離開時暫停（挑戰中去遠征 20 分鐘內仍會計時）

    if(zooDeathLog.length){ toast(zooDeathLog.length===1?`${nameOf(zooDeathLog[0])} 年紀大了，安詳地離開了。牠的名字留在紀念牆上。`:`${zooDeathLog.length} 隻動物年老離開了，名字都留在紀念牆上。`); zooDeathLog=[]; rebuildZooAnimals(); persist(); const b=zSelUid&&findB(zSelUid); if(b&&!$('zPanel').hidden&&bdef(b.type).kind==='habitat') openHabitatPanel(b); } }
  zSaveT+=dt; if(zSaveT>=ZC().autosaveSeconds){ zSaveT=0; persist(); }
  zHudT+=dt; if(zHudT>=0.5){ zHudT=0; updateZooHud(); }
  zAchT=(zAchT||0)+dt; if(zAchT>=5){ zAchT=0; checkAchievements(); }
  zChT=(zChT||0)+dt; if(zChT>=1){ zChT=0; challengeHud(); checkChallenge(); }
  storyTick(dt);
  updatePeople(dt); updateTram(dt); updateBubbles(dt); updateWorldVisual(dt);
  if(zBrushing&&state==='zoo'){ applyBrush(zBrushing.x,zBrushing.z,zBrushing.tool,dt); refreshTerrain(); }
  if(state==='zoo'){ const px=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0), pz=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
    if(px||pz){ const lim=GN()*TS()/2; zooCamT.x=Math.max(-lim,Math.min(lim,zooCamT.x+px*zooCamT.d*0.6*dt)); zooCamT.z=Math.max(-lim,Math.min(lim+6,zooCamT.z+pz*zooCamT.d*0.6*dt)); } }
  for(const g of zooBMeshes.values()) if(g.userData.glow) g.userData.glow.material.opacity=heatersOn()?0.55+Math.sin(clock.elapsedTime*3)*0.15:0;
  for(const z of zooAnimals){
    const m=z.mesh;
    const gy=ZH(m.position.x,m.position.z);
    const lift=DATA.speciesById[z.a.species]&&DATA.speciesById[z.a.species].category==='aquatic'?0.35:0;
    if(animalBehave(z,dt,gy,lift)) continue;
    if(z.wait>0){ z.wait-=dt; if(z.act!=='swim') m.position.y=gy+0.1+lift; setAnim(m,'idle'); continue; }
    const dx=z.tx-m.position.x, dz=z.tz-m.position.z, d=Math.hypot(dx,dz);
    if(d<0.2){ if(z.poly){ const q=randomInPoly(z.poly); z.tx=q.x; z.tz=q.z; } else { z.tx=z.c.x+(Math.random()*2-1)*z.hw; z.tz=z.c.z+(Math.random()*2-1)*z.hd; } z.wait=1+Math.random()*4; continue; }
    const s=Math.min(d,dt*1.4); m.position.x+=dx/d*s; m.position.z+=dz/d*s; m.rotation.y=Math.atan2(dx,dz); setAnim(m,'walk');
    z.hop+=dt*10; if(!(z.act==='swim'&&gy<TRN().waterLevel)) m.position.y=gy+0.1+lift+(isAnimated(m)?0:Math.abs(Math.sin(z.hop))*0.12);
  }
  if(state==='zoowalk'){
    let ix=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x, iz=(keys.KeyS?1:0)-(keys.KeyW?1:0)+joy.y;
    const il=Math.hypot(ix,iz); if(il>1){ix/=il;iz/=il;}
    const sp=sprint?6.5:3.6, sy=Math.sin(player.yaw), cy=Math.cos(player.yaw);
    player.pos.x+=(ix*cy+iz*sy)*sp*dt; player.pos.z+=(-ix*sy+iz*cy)*sp*dt;
    const lim=GN()*TS()/2-0.6; player.pos.x=Math.max(-lim,Math.min(lim,player.pos.x)); player.pos.z=Math.max(-lim,Math.min(lim+4,player.pos.z));
    if(il>0.1) player.bob+=dt*8;
    camera.position.set(player.pos.x,Math.max(ZH(player.pos.x,player.pos.z),TRN().waterLevel)+1.65+(il>0.1?Math.sin(player.bob)*0.05:0),player.pos.z); camera.rotation.set(player.pitch,player.yaw,0);
  } else {
    const cy=ZH(zooCamT.x,zooCamT.z); zooCam.position.set(zooCamT.x,cy+zooCamT.d*0.82,zooCamT.z+zooCamT.d*0.58); zooCam.lookAt(zooCamT.x,cy,zooCamT.z);
  }
}

/* =========================================================
   路線圖（第三階段）：選站點出發、倖存者聚落交易
   節點來自 data/map.json，層級規則來自 config.tiers
   ========================================================= */
const STYPE={home:'起點',ruins:'廢墟',lake:'湖泊',greenhouse:'溫室',settlement:'聚落'};
let mapSel=null;
function mapState(){
  save.map=save.map||{visited:['utopia']};
  const v=new Set(save.map.visited); v.add('utopia');
  const avail=new Set(); for(const n of DATA.map) if(v.has(n.id)) n.links.forEach(l=>avail.add(l));
  return {v,avail};
}
const nodeFuel=n=>n.tier?DATA.config.tiers[n.tier].fuel:0;
function nodeCats(n){ const st=DATA.stationById[n.type]; if(!st||st.trade) return []; return [...new Set([...(st.ice?st.ice.categories:[]),...(st.catch?st.catch.categories:[])])]; }
function nodeProgress(n){
  const cats=nodeCats(n); if(!cats.length) return null;
  const pool=speciesPool(n,cats); const got=pool.filter(s=>save.collection[s.id]).length;
  return {got,total:pool.length};
}
function showMap(){
  state='map'; $('zooUI').hidden=true; $('zPanel').hidden=true;
  const {v,avail}=mapState(), fuel=Math.floor(save.resources.fuel||0);
  if(!mapSel||!DATA.mapById[mapSel]) mapSel=[...avail].find(id=>!v.has(id))||'old_town';
  const lines=[], seen=new Set();
  for(const n of DATA.map) for(const l of n.links){ const k=[n.id,l].sort().join('|'); if(seen.has(k)) continue; seen.add(k); const m=DATA.mapById[l]; if(!m) continue;
    const open=(v.has(n.id)||v.has(l)); lines.push(`<line x1="${n.x}" y1="${n.y}" x2="${m.x}" y2="${m.y}" class="${open?'lk open':'lk'}"/>`); }
  const dots=DATA.map.map(n=>{
    const cls=n.type==='home'?'home':v.has(n.id)?'visited':avail.has(n.id)?'avail':'locked';
    const r=n.type==='home'?3.4:2.6+(n.tier||0)*0.25;
    return `<g class="nd ${cls}${mapSel===n.id?' sel':''}" data-node="${n.id}" tabindex="0" role="button" aria-label="${esc(n.name)}">
      <circle cx="${n.x}" cy="${n.y}" r="${r+2.4}" class="hit"/><circle cx="${n.x}" cy="${n.y}" r="${r}" class="dot t-${n.type}"/>
      <text x="${n.x}" y="${n.y+r+4.2}" text-anchor="middle">${esc(cls==='locked'?'？？？':n.name)}</text></g>`;
  }).join('');
  screenEl.hidden=false;
  screenEl.innerHTML=`<div class="mapwrap">
    <div class="maphead"><h2>路線圖</h2><span class="num">煤炭 ${fuel}</span><button type="button" class="btn ghost" id="mapBack">回到園區</button></div>
    <div class="mapbox"><svg viewBox="0 0 100 100" aria-label="冰原路線圖">${lines.join('')}${dots}</svg></div>
    <div class="mapinfo" id="mapInfo"></div>
  </div>`;
  $('mapBack').onclick=()=>{ screenEl.hidden=true; state='zoo'; $('zooUI').hidden=false; };
  screenEl.querySelectorAll('.nd').forEach(el=>{ const pick=()=>{ mapSel=el.dataset.node; showMap(); }; el.addEventListener('click',pick); el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); } }); });
  renderMapInfo(v,avail,fuel);
}
function renderMapInfo(v,avail,fuel){
  const n=DATA.mapById[mapSel], box=$('mapInfo');
  if(n.type==='home'){ box.innerHTML=`<b>${esc(n.name)}</b><span>烏托邦的月台。從這裡出發，越往北越遠、越稀有。</span>`; return; }
  const locked=!avail.has(n.id)&&!v.has(n.id), tier=DATA.config.tiers[n.tier], cost=nodeFuel(n), prog=nodeProgress(n);
  if(locked){ box.innerHTML=`<b>？？？</b><span>${esc(tier.name)}・先抵達相鄰的站點才會解鎖。</span>`; return; }
  ensureProgress(); const maxTier=computeStats().maxTier||1;
  const enough=fuel>=cost, tierOK=n.tier<=maxTier, zones=(n.zones&&n.zones.length)?n.zones.join('、'):'所有展區';
  const cats=[...new Set(speciesPool(n,nodeCats(n)).map(s=>s.category))].map(c=>DATA.config.categories[c].name).join('、');
  const label=!tierOK?`需要鍋爐 Lv${n.tier-1}（到工坊升級）`:enough?(n.type==='settlement'?'前往交易':'出發'):`出發（煤炭只有 ${fuel}，會在半路停車）`;
  box.innerHTML=`<b>${esc(n.name)}</b>
    <span>${esc(STYPE[n.type])}・${esc(tier.name)}・路程煤炭 ${cost}${v.has(n.id)?'・去過':''}</span>
    ${n.type==='settlement'?`<span>倖存者會拿物資和你交易，也能換到稀有物種。</span>`
      :`<span>可能出現：${esc(zones)}（${esc(cats)}）</span>${prog?`<span>這裡的圖鑑 ${prog.got}/${prog.total}</span>`:''}${bossForNode(n)?`<span class="warnline">⚠ 霜影首領「${esc(bossForNode(n).name)}」守在這裡${bossKills(bossForNode(n).id)?`・已擊敗 ${bossKills(bossForNode(n).id)} 次`:''}。牠身邊封著一隻${esc(DATA.config.rarity[bossForNode(n).guard].name)}生物，附近有彈藥箱。</span>`:''}`}
    ${tierOK&&!enough?`<span class="warnline">煤炭不夠時火車會停在半路的荒原，要下車找到煤炭才能繼續。</span>`:''}
    <button type="button" class="btn" id="mapGo" ${tierOK?'':'disabled'}>${label}</button>`;
  if(tierOK) $('mapGo').onclick=()=>{
    if(!enough){
      const need=cost-fuel; save.resources.fuel=0;
      leaveZooForExpedition({id:'stall',name:'半路荒原',type:'stall',tier:Math.max(1,n.tier-1),zones:n.zones||[],links:[],dest:n.id,destName:n.name,need});
      return;
    }
    save.resources.fuel=(save.resources.fuel||0)-cost;
    if(n.type==='settlement'){ save.map.visited.includes(n.id)||save.map.visited.push(n.id); persist(); showTrade(n); }
    else leaveZooForExpedition(n);
  };
}
function stallButtons(){
  const fuel=Math.floor(save.resources.fuel||0), need=curNode.need||0;
  return `<button class="btn" id="contBtn" type="button" ${fuel>=need?'':'disabled'}>${fuel>=need?`繼續前往${esc(curNode.destName)}（用掉煤炭 ${need}）`:`煤炭還差 ${need-fuel}，沒辦法繼續`}</button>`;
}
function wireStall(){
  const b=$('contBtn'); if(!b||b.disabled) return;
  const dest=DATA.mapById[curNode.dest], need=curNode.need||0;
  b.onclick=()=>{
    save.resources.fuel=(save.resources.fuel||0)-need;
    if(dest.type==='settlement'){ save.map.visited.includes(dest.id)||save.map.visited.push(dest.id); persist(); showTrade(dest); }
    else { persist(); startExpedition(dest); }
  };
}
function showTrade(n){
  state='map';
  const trades=DATA.config.trades;
  const giveTxt=g=>Object.entries(g).map(([k,v])=>`${resName(k)} ${v}`).join('・');
  const getTxt=g=>g.species?'一隻沒見過的稀有物種':Object.entries(g).map(([k,v])=>`${resName(k)} ${v}`).join('・');
  screenEl.hidden=false;
  screenEl.innerHTML=`<div class="card">
    <h1><small>SETTLEMENT · 交易</small>${esc(n.name)}</h1>
    <p>倉庫：${['coins',...DATA.items.map(i=>i.id)].map(k=>`${resName(k)} ${Math.floor(resOf(k))}`).join('・')}</p>
    <div class="trades">${trades.map(t=>`<div class="trade"><div><b>${esc(t.name)}</b><span>付 ${esc(giveTxt(t.give))} → 得 ${esc(getTxt(t.get))}</span></div>
      <button type="button" class="zmini add" data-trade="${t.id}" ${affordable(t.give)?'':'disabled'}>交易</button></div>`).join('')}</div>
    <p id="tradeMsg" class="zp-empty"></p>
    <button class="btn" id="tradeDone" type="button">回到烏托邦</button>
  </div>`;
  screenEl.querySelectorAll('[data-trade]').forEach(el=>el.onclick=()=>{
    const t=trades.find(x=>x.id===el.dataset.trade); if(!affordable(t.give)) return;
    let msg='';
    if(t.get.species){
      const pool=DATA.species.filter(s=>s.rarity===t.get.species&&!save.collection[s.id]);
      const sp=pool.length?pool[Math.floor(Math.random()*pool.length)]:null;
      if(!sp){ $('tradeMsg').textContent='這個等級的物種你都有了。'; return; }
      pay(t.give,-1); ensureZoo();
      save.collection[sp.id]=1; save.zoo.unplaced[sp.id]=(save.zoo.unplaced[sp.id]||0)+1;
      msg=`換到 ${sp.name}！牠已經在園區等著安置。`;
    } else { pay(t.give,-1); pay(t.get,1); msg=`交易完成：得到 ${getTxt(t.get)}`; }
    persist(); showTrade(n); $('tradeMsg').textContent=msg;
  });
  $('tradeDone').onclick=()=>enterZoo();
}

/* =========================================================
   工坊（第四階段）：火車升級、武器與裝備
   等級效果來自 data/upgrades.json，裝備來自 data/equipment.json
   ========================================================= */
function ensureProgress(){
  save.upgrades=save.upgrades||{};
  save.gear=save.gear||{owned:['flare_gun'],equipped:{weapon:'flare_gun'}};
  if(!save.gear.owned.includes('flare_gun')) save.gear.owned.push('flare_gun');
  if(!save.starterKit){ save.starterKit=1; save.resources.ammo=(save.resources.ammo||0)+20; save.resources.bandage=(save.resources.bandage||0)+2; }
  ensureZoo();
}
function upLevel(id){ return (save.upgrades&&save.upgrades[id])||0; }
function computeStats(){
  const s=Object.assign({drainMult:1,wraithTouchMult:1,catchSpeed:1,workshop:0},DATA.config.expedition);
  for(const u of DATA.upgrades){ const lv=upLevel(u.id); for(let i=0;i<lv&&i<u.levels.length;i++) Object.assign(s,u.levels[i].effects); }
  const eq=(save.gear&&save.gear.equipped)||{};
  for(const id of Object.values(eq)){
    const g=DATA.equipById[id]; if(!g||g.slot==='weapon') continue;
    if(g.drainMult) s.drainMult*=g.drainMult;
    if(g.bagBonus) s.bagCapacity+=g.bagBonus;
    if(g.catchSpeed) s.catchSpeed=Math.max(s.catchSpeed,g.catchSpeed);
    if(g.sprintSpeed) s.sprintSpeed=Math.max(s.sprintSpeed,g.sprintSpeed);
    if(g.walkSpeed) s.walkSpeed=Math.max(s.walkSpeed,g.walkSpeed);
  }
  applyTrainEffects(s);
  const rf=RF(); s.drainMult*=rf.expDrainMult; s.wraithTouchMult*=rf.expWraithMult; s.containerCapacity+=rf.expContainerBonus;
  return s;
}
let shopTab='train';
function showWorkshop(msg){
  ensureProgress(); state='shop';
  const st=computeStats(), z=save.zoo;
  const wallet=['coins','research',...DATA.items.map(i=>i.id)].map(k=>`<span><i>${esc(resName(k))}</i><b class="num">${Math.floor(resOf(k))}</b></span>`).join('');

        ${next?`<button type="button" class="zmini add" data-up="${u.id}" ${affordable(next.cost)?'':'disabled'}>${esc(costText(next.cost))}</button>`:'<span class="sc-max">已滿級</span>'}</div>`;
    }).join('');

      +'<p class="zp-empty">材料在遠征時搜刮：森林多木材、村莊多布料、礦區和港口多零件與火藥、溫室多草藥。獵槍、步槍、機槍在熱區補子彈要消耗彈藥；火焰噴射器燒煤炭。</p>';
  } else if(shopTab==='food'){

      }).join('');
    }).join('');
  }
  screenEl.hidden=false;
  screenEl.innerHTML=`<div class="hub">
    <div class="hub-head"><h1><small>WORKSHOP · 火車工坊</small>工坊</h1></div>
    <div class="zres">${wallet}</div>
    <div class="dextabs" role="tablist">
      <button type="button" role="tab" class="dextab${shopTab==='train'?' on':''}" data-tab="train" aria-selected="${shopTab==='train'}">火車升級</button>
      <button type="button" role="tab" class="dextab${shopTab==='cars'?' on':''}" data-tab="cars" aria-selected="${shopTab==='cars'}">車廂編組</button>
      <button type="button" role="tab" class="dextab${shopTab==='craft'?' on':''}" data-tab="craft" aria-selected="${shopTab==='craft'}">製作</button>
      <button type="button" role="tab" class="dextab${shopTab==='food'?' on':''}" data-tab="food" aria-selected="${shopTab==='food'}">廚房</button>
      <button type="button" role="tab" class="dextab${shopTab==='gear'?' on':''}" data-tab="gear" aria-selected="${shopTab==='gear'}">武器與裝備</button>
    </div>
    <div class="statline">背包 ${st.bagCapacity}・跟隨 ${st.followCapacity}・容器 ${st.containerCapacity}・熱區 ${st.heatRadius} m・體溫流失 ${Math.round(st.drainMult*100)}%・可去：${esc(DATA.config.tiers[st.maxTier].name)}</div>
    ${msg?`<div class="dexinfo">${esc(msg)}</div>`:''}
    <div class="shoplist">${body}</div>
    <p class="zp-empty">研究點數來自園區：每多養一種不同的物種，研究就累積得越快；圖鑑每新增一種也會加研究。</p>
    <button class="btn ghost" id="shopBack" type="button">回到園區</button>

  screenEl.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{ shopTab=el.dataset.tab; carPick=null; showWorkshop(); });

/* =========================================================
   繁殖（第五階段）：性別、成長、懷孕、品質星等、血緣與野放
   數值都在 config.breeding
   ========================================================= */
const BR=()=>DATA.config.breeding;
const STAR_TXT=n=>'★'.repeat(n)+'☆'.repeat(Math.max(0,BR().maxStars-n));
let zooBirthLog=[];
function rollStars(sp){ const r=BR().rescueStars[sp.rarity]||[1,2]; return r[0]+Math.floor(Math.random()*(r[1]-r[0]+1)); }
function newIndividual(speciesId,habitat,extra){
  const z=save.zoo, sp=DATA.speciesById[speciesId];
  return withGenes(Object.assign({ id:'a'+(z.nextUid++), species:speciesId, habitat, sex:Math.random()<0.5?'M':'F', stars:rollStars(sp),
    born:(z.clock||0)-BR().adultMinutes-rescueAge(sp), parents:[], gen:0, food:80, happy:60, breed:true }, extra||{}));
}
function withGenes(a){ if(!a.genes) a.genes=rollGenes(a.stars||2); return a;
}
function migrateAnimals(){
  const z=save.zoo; z.clock=z.clock||0; z.stored=z.stored||[];
  for(const a of z.animals){
    if(!a.sex) a.sex=Math.random()<0.5?'M':'F';
    if(!a.stars) a.stars=rollStars(DATA.speciesById[a.species]||{rarity:'common'});
    if(a.born==null) a.born=z.clock-BR().adultMinutes;
    if(!a.parents) a.parents=[];
    if(a.gen==null) a.gen=0;
    if(a.breed==null) a.breed=true;
    withGenes(a);
  }
}
const isAdult=a=>(save.zoo.clock-a.born)>=BR().adultMinutes*RF().adultMinutesMult;
function related(a,b){
  if(a.parents.includes(b.id)||b.parents.includes(a.id)) return '親子';
  if(a.parents.length&&b.parents.some(p=>a.parents.includes(p))) return '手足';
  return null;
}
const nameOf=a=>`${DATA.speciesById[a.species].name} #${a.id.slice(1)}`;
function litterSize(sp){ const r=BR().litter[sp.category]||[1,1]; return r[0]+Math.floor(Math.random()*(r[1]-r[0]+1)); }
function breedingStep(min){
  const z=save.zoo, B=BR();
  z.clock=(z.clock||0)+min;
  // 生產
  for(const f of z.animals.filter(a=>a.preg)){
    if(z.clock<f.preg.due) continue;
    const hb=findB(f.habitat); if(!hb) { delete f.preg; continue; }
    const d=bdef(hb.type), room=d.capacity-z.animals.filter(a=>a.habitat===hb.uid).length;
    if(room<=0) continue;                     // 空間不足，延後生產
    const father=z.animals.find(a=>a.id===f.preg.father)||{id:f.preg.father,stars:f.stars,gen:0};
    const sp=DATA.speciesById[f.species], n=Math.min(room,litterSize(sp));
    for(let i=0;i<n;i++){
      let st=Math.round((f.stars+father.stars)/2);
      if(Math.random()<B.starUpChance) st++;
      if(Math.random()<B.starDownChance) st--;
      if(f.preg.inbred) st-=B.inbreedPenalty;
      st=Math.max(1,Math.min(B.maxStars,st));
      const baby=newIndividual(f.species,f.habitat,{stars:st,born:z.clock,parents:[father.id,f.id],gen:Math.max(f.gen,father.gen||0)+1,happy:80,genes:inheritGenes(father,f,f.preg.inbred)});
      z.animals.push(baby); zooBirthLog.push(baby); z.births=(z.births||0)+1; consOnBirth(baby);
    }
    f.cooldownUntil=z.clock+B.cooldownMinutes; delete f.preg;
  }
  // 受孕
  for(const f of z.animals){
    if(f.sex!=='F'||f.preg||!f.breed||!isAdult(f)||isElder(f)||(f.happy??0)<B.minHappy||(f.cooldownUntil||0)>z.clock) continue;
    const mates=z.animals.filter(m=>m.sex==='M'&&m.habitat===f.habitat&&m.species===f.species&&m.breed&&isAdult(m)&&!isElder(m)&&(m.happy??0)>=B.minHappy);
    if(!mates.length) continue;
    const unrelated=mates.filter(m=>!related(f,m));
    const m=(unrelated.length?unrelated:mates)[Math.floor(Math.random()*(unrelated.length||mates.length))];
    if(Math.random()<B.chancePerMin*RF().breedChanceMult*geneFertMult(f)*min) f.preg={due:z.clock+B.gestationMinutes,father:m.id,inbred:!!related(f,m)};
  }
}
function habitatBreedNote(b){
  const z=save.zoo, inside=z.animals.filter(a=>a.habitat===b.uid), notes=[];
  for(const f of inside.filter(a=>a.sex==='F')) for(const m of inside.filter(a=>a.sex==='M'&&a.species===f.species)){
    const r=related(f,m); if(r) notes.push(`<em>⚠ ${esc(nameOf(f))} 和 ${esc(nameOf(m))} 是${r}，配對會讓後代品質下降</em>`);
  }
  const preg=inside.filter(a=>a.preg);
  if(preg.length) notes.push(`懷孕中：${preg.map(a=>`${esc(nameOf(a))}（${a.preg.due<=z.clock?'等空位就會生':`約 ${Math.ceil(a.preg.due-z.clock)} 分鐘後`}）`).join('、')}`);
  return notes.join('<br>');
}
function releaseAnimal(a){
  const B=BR(), sp=DATA.speciesById[a.species], rar=['common','rare','endangered','legendary'].indexOf(sp.rarity);
  const research=Math.round(B.releaseResearch*(1+rar)*(a.stars/2)), coins=Math.round(B.releaseCoins*(1+rar)*(a.stars/2));
  save.zoo.research=(save.zoo.research||0)+research; save.zoo.coins+=coins;
  save.zoo.released=(save.zoo.released||0)+1; consOnRelease(a);
  const cp=DATA.config.biz.cpRelease[sp.rarity]||1; earnCp(cp);
  return {research,coins,cp};
}

/* ---------- 壽命與老化（數值在 config.aging） ---------- */
const AG=()=>DATA.config.aging;
let zooDeathLog=[];
const agingOff=()=>!!(save.zoo&&save.zoo.noAging);
function lifespanOf(a){
  const sp=DATA.speciesById[a.species]||{category:'mammal',rarity:'common'}, A=AG();
  return (A.lifespanMinutes[sp.category]||4320)*(A.rarityMult[sp.rarity]||1)*(sp.lifespanMult||1)*RF().lifespanMult*(1+A.starBonusPerStar*((a.stars||2)-3))*geneLifeMult(a);
}
function rescueAge(sp){ const A=AG(), r=A.rescueAgeRange, base=(A.lifespanMinutes[sp.category]||4320)*(A.rarityMult[sp.rarity]||1)*(sp.lifespanMult||1);
  return Math.max(0, base*(r[0]+Math.random()*(r[1]-r[0]))-BR().adultMinutes); }
const ageOf=a=>(save.zoo.clock||0)-a.born;
const lifeFrac=a=>ageOf(a)/lifespanOf(a);
const isElder=a=>!agingOff()&&lifeFrac(a)>=AG().elderAt;
const stageOf=a=>!isAdult(a)?'幼體':isElder(a)?'老年':'成年';
const elderPenalty=a=>isElder(a)?AG().elderHappyPenalty*RF().elderPenaltyMult:0;
const elderAttract=a=>isElder(a)?AG().elderAttractMult:1;
function agingStep(min){
  if(agingOff()||min<=0) return;
  const z=save.zoo, A=AG();
  const dies=a=>lifeFrac(a)>=1 && Math.random()<A.deathChancePerMin*min*(a.sick?A.sickDeathMult:1);
  const gone=[];
  z.animals=z.animals.filter(a=>{ if(dies(a)){ gone.push(a); return false; } return true; });
  z.stored=(z.stored||[]).filter(a=>{ if(dies(a)){ gone.push(a); return false; } return true; });
  for(const a of gone){
    z.deaths=(z.deaths||0)+1; zooDeathLog.push(a);
    z.memorial=z.memorial||[];
    z.memorial.unshift({id:a.id,species:a.species,sex:a.sex,stars:a.stars,gen:a.gen,age:Math.round(ageOf(a)),at:Date.now()});
    if(z.memorial.length>A.memorialMax) z.memorial.length=A.memorialMax;
  }
}

/* =========================================================
   自由建造（第六階段）：地形雕塑與上色、水面、自由擺放物件
   物件來自 data/props.json，地形數值來自 config.terrain
   ========================================================= */
const TRN=()=>DATA.config.terrain;
let zTerrain=null, zWater=null, zGrid=null, zPropRoot=null, zTerrN=0, zTerrSide=0;
const zPropMeshes=new Map();
let zRot=0, zSnap=true, zBrush=3, zBrushing=null, zMoveUid=null, zTab='facility', zSelProp=null;

/* ---------- 地形資料 ---------- */
function ensureTerrain(){
  const side=GN()*TS(), n=Math.round(side/TRN().resolution)+1;
  zTerrN=n; zTerrSide=side;
  const z=save.zoo;
  if(!z.terrain||z.terrain.n!==n){ z.terrain={n,h:new Array(n*n).fill(0),p:new Array(n*n).fill(0)}; }
  z.props=z.props||[];
}
const tIdx=(i,j)=>j*zTerrN+i;
function terrXY(x,z){ const r=TRN().resolution; return {fi:(x+zTerrSide/2)/r, fj:(z+zTerrSide/2)/r}; }
function ZH(x,z){
  const T=save.zoo&&save.zoo.terrain; if(!T) return 0;
  const {fi,fj}=terrXY(x,z); if(fi<0||fj<0||fi>zTerrN-1||fj>zTerrN-1) return 0;
  const i=Math.min(zTerrN-2,Math.floor(fi)), j=Math.min(zTerrN-2,Math.floor(fj)), u=fi-i, v=fj-j, h=T.h;
  return (h[tIdx(i,j)]*(1-u)+h[tIdx(i+1,j)]*u)*(1-v)+(h[tIdx(i,j+1)]*(1-u)+h[tIdx(i+1,j+1)]*u)*v;
}

/* ---------- 地形網格 ---------- */
function noiseTexture(){
  const c=document.createElement('canvas'); c.width=c.height=128; const x=c.getContext('2d');
  for(let i=0;i<128;i+=2) for(let j=0;j<128;j+=2){ const v=200+Math.floor(Math.random()*55); x.fillStyle=`rgb(${v},${v},${v})`; x.fillRect(i,j,2,2); }
  for(let k=0;k<260;k++){ const v=150+Math.floor(Math.random()*40); x.fillStyle=`rgb(${v},${v},${v})`; x.fillRect(Math.random()*128,Math.random()*128,2+Math.random()*3,1+Math.random()*2); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat&&t.repeat.set&&t.repeat.set(GN()*TS()/4,GN()*TS()/4); return t;
}
const PAINT_RGB=()=>TRN().paints.map(p=>new THREE.Color(hex(p.color)));
let zVarSeed=null;
function buildTerrainMesh(){
  ensureTerrain();
  const n=zTerrN, side=zTerrSide;
  const g=new THREE.PlaneGeometry(side,side,n-1,n-1); g.rotateX(-Math.PI/2);
  g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(n*n*3),3));
  zVarSeed=new Float32Array(n*n); for(let i=0;i<n*n;i++) zVarSeed[i]=0.93+Math.random()*0.1;
  g.setAttribute('w0',new THREE.BufferAttribute(new Float32Array(n*n*3),3));
  g.setAttribute('w1',new THREE.BufferAttribute(new Float32Array(n*n*3),3));
  zTerrain=new THREE.Mesh(g,terrainTex&&terrainTex.length===6?splatMaterial():new THREE.MeshLambertMaterial({vertexColors:true,map:noiseTexture()}));
  zooScene.add(zTerrain);
  zWater=new THREE.Mesh(new THREE.PlaneGeometry(side,side),new THREE.MeshPhongMaterial({color:0x2a6f99,transparent:true,opacity:0.78,shininess:90}));
  zWater.rotation.x=-Math.PI/2; zWater.position.y=TRN().waterLevel; zooScene.add(zWater);
  refreshTerrain();
}
function refreshTerrain(){
  const T=save.zoo.terrain, g=zTerrain.geometry, pos=g.attributes.position, col=g.attributes.color, pal=PAINT_RGB(), n=zTerrN, w0=g.attributes.w0, w1=g.attributes.w1;
  // PlaneGeometry 的頂點順序：列（z）由負到正、行（x）由負到正
  for(let j=0;j<n;j++) for(let i=0;i<n;i++){
    const k=j*n+i; pos.setY(k,T.h[k]);
    const c=pal[T.p[k]]||pal[0], v=zVarSeed[k]*(T.h[k]<TRN().waterLevel-0.2?0.8:1);
    col.setXYZ(k,c.r*v,c.g*v,c.b*v);
    if(w0){ const p=T.p[k]||0; w0.setXYZ(k,p===0?1:0,p===1?1:0,p===2?1:0); w1.setXYZ(k,p===3?1:0,p===4?1:0,p===5?1:0); }
  }
  if(w0){ w0.needsUpdate=true; w1.needsUpdate=true; }
  pos.needsUpdate=true; col.needsUpdate=true; g.computeVertexNormals(); g.computeBoundingSphere&&g.computeBoundingSphere();
}
function flattenRect(x0,z0,x1,z1,margin){
  const T=save.zoo.terrain, r=TRN().resolution, n=zTerrN;
  const cx=(x0+x1)/2, cz=(z0+z1)/2, target=ZH(cx,cz);
  for(let j=0;j<n;j++) for(let i=0;i<n;i++){
    const x=i*r-zTerrSide/2, z=j*r-zTerrSide/2;
    const dx=Math.max(x0-x,0,x-x1), dz=Math.max(z0-z,0,z-z1), d=Math.hypot(dx,dz);
    if(d>margin) continue;
    const k=tIdx(i,j), w=d<=0?1:1-d/margin; T.h[k]+= (target-T.h[k])*w;
  }
}
function applyBrush(x,z,tool,dt){
  const T=save.zoo.terrain, C=TRN(), r=C.resolution, n=zTerrN, rad=zBrush, k0=C.brushStrength*dt;
  const {fi,fj}=terrXY(x,z), ri=Math.ceil(rad/r);
  let avg=0, cnt=0;
  if(tool==='t_smooth'){ for(let j=Math.max(0,Math.floor(fj)-ri);j<=Math.min(n-1,Math.ceil(fj)+ri);j++) for(let i=Math.max(0,Math.floor(fi)-ri);i<=Math.min(n-1,Math.ceil(fi)+ri);i++){ avg+=T.h[tIdx(i,j)]; cnt++; } avg/=Math.max(1,cnt); }
  for(let j=Math.max(0,Math.floor(fj)-ri);j<=Math.min(n-1,Math.ceil(fj)+ri);j++) for(let i=Math.max(0,Math.floor(fi)-ri);i<=Math.min(n-1,Math.ceil(fi)+ri);i++){
    const d=Math.hypot(i-fi,j-fj)*r; if(d>rad) continue;
    const w=Math.pow(1-d/rad,1.5), k=tIdx(i,j);
    if(tool==='t_raise') T.h[k]+=k0*w;
    else if(tool==='t_lower') T.h[k]-=k0*w;
    else if(tool==='t_flat') T.h[k]+=(zBrushing.target-T.h[k])*Math.min(1,k0*w*2);
    else if(tool==='t_smooth') T.h[k]+=(avg-T.h[k])*Math.min(1,k0*w*1.5);
    else if(tool.startsWith('t_paint_')) T.p[k]=parseInt(tool.slice(8),10);
    T.h[k]=Math.max(C.min,Math.min(C.max,Math.round(T.h[k]*100)/100));
  }
}

function placePropMesh(p){
  const old=zPropMeshes.get(p.uid); if(old) zPropRoot.remove(old);
  const g=makeProp(p.type), pd=pdef(p.type);
  if(pd&&pd.asset){ const st=staticAsset(pd.asset,{height:pd.height}); if(st){ for(const ch of [...g.children]) g.remove(ch); g.add(st); } else swapInAsset(g,pd.asset,{height:pd.height}); } g.position.set(p.x,ZH(p.x,p.z)+(p.y||0),p.z); g.rotation.y=p.rot||0; g.userData.prop=p.uid;
  zPropRoot.add(g); zPropMeshes.set(p.uid,g);
}
function rebuildProps(){ for(const g of zPropMeshes.values()) zPropRoot.remove(g); zPropMeshes.clear(); for(const p of save.zoo.props) placePropMesh(p); }
function snapXZ(x,z){ return zSnap?{x:Math.round(x),z:Math.round(z)}:{x,z}; }
function pickProp(cx,cy){
  const r=canvas.getBoundingClientRect(); zNdc.set((cx-r.left)/r.width*2-1,-(cy-r.top)/r.height*2+1); zRay.setFromCamera(zNdc,zooCam);
  const hits=zRay.intersectObjects(zPropRoot.children,true);
  for(const h of hits){ let o=h.object; while(o&&o.userData.prop==null) o=o.parent; if(o) return save.zoo.props.find(p=>p.uid===o.userData.prop); }
  return null;
}
function groundHit(cx,cy){
  const r=canvas.getBoundingClientRect(); zNdc.set((cx-r.left)/r.width*2-1,-(cy-r.top)/r.height*2+1); zRay.setFromCamera(zNdc,zooCam);
  const h=zTerrain?zRay.intersectObject(zTerrain,false)[0]:null;
  if(h) return h.point.clone();
  return zRay.ray.intersectPlane(zPlane,new THREE.Vector3());
}

/* 寫實地形材質：六張 ambientCG 貼圖依每個頂點的上色權重混合 */
function splatMaterial(){
  const u=THREE.UniformsUtils.merge([THREE.UniformsLib.fog,{
    t0:{value:terrainTex[0]},t1:{value:terrainTex[1]},t2:{value:terrainTex[2]},t3:{value:terrainTex[3]},t4:{value:terrainTex[4]},t5:{value:terrainTex[5]},
    sunDir:{value:new THREE.Vector3(30,60,20).normalize()},sky:{value:new THREE.Color(0xeaf4ff)},ground:{value:new THREE.Color(0x8a9aa6)},water:{value:TRN().waterLevel}}]);
  return new THREE.ShaderMaterial({uniforms:u,fog:true,
    vertexShader:`attribute vec3 w0; attribute vec3 w1; attribute vec3 color;
      varying vec3 vW0; varying vec3 vW1; varying vec2 vUv; varying vec3 vN; varying float vShade; varying float vH;
      #include <fog_pars_vertex>
      void main(){ vW0=w0; vW1=w1; vUv=position.xz/2.5; vN=normalize(normalMatrix*normal); vShade=dot(color,vec3(0.333)); vH=position.y;
        vec4 mvPosition=modelViewMatrix*vec4(position,1.0); gl_Position=projectionMatrix*mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader:`uniform sampler2D t0; uniform sampler2D t1; uniform sampler2D t2; uniform sampler2D t3; uniform sampler2D t4; uniform sampler2D t5;
      uniform vec3 sunDir; uniform vec3 sky; uniform vec3 ground; uniform float water;
      varying vec3 vW0; varying vec3 vW1; varying vec2 vUv; varying vec3 vN; varying float vShade; varying float vH;
      #include <fog_pars_fragment>
      void main(){
        vec3 c=texture2D(t0,vUv).rgb*vW0.x+texture2D(t1,vUv).rgb*vW0.y+texture2D(t2,vUv).rgb*vW0.z
              +texture2D(t3,vUv).rgb*vW1.x+texture2D(t4,vUv).rgb*vW1.y+texture2D(t5,vUv).rgb*vW1.z;
        float wsum=vW0.x+vW0.y+vW0.z+vW1.x+vW1.y+vW1.z; c/=max(wsum,0.001);
        vec3 n=normalize(vN); vec3 hemi=mix(ground,sky,n.y*0.5+0.5)*0.75;
        float d=max(dot(n,normalize((viewMatrix*vec4(sunDir,0.0)).xyz)),0.0);
        vec3 col=c*(hemi+vec3(1.0,0.95,0.86)*d*0.6);
        if(vH<water-0.15) col*=0.75;
        gl_FragColor=vec4(col,1.0);
        #include <fog_fragment>
      }`});
}

const MODEL_EXT='glb'/*@@MODEL_EXT@@*/;
const assetCache={}, assetWait={};
function modelUrl(file){
  const hasExt=/\.(glb|gltf)$/.test(file);
  if(MODEL_EXT==='json') return 'models/'+file.replace(/\.(glb|gltf)$/,'')+'.json';
  return 'models/'+file+(hasExt?'':'.glb');
}
/* 0 A.D. 動物：模型、動畫、貼圖分開放，載入後組合成一份 */
function loadZad(name){
  const key='zad:'+name; if(assetCache[key]) return Promise.resolve(assetCache[key]); if(assetWait[key]) return assetWait[key];
  const def=DATA.assets.zad[name]; if(!def) return Promise.reject(new Error('no zad'));
  const raw=f=>new Promise((res,rej)=>new THREE.GLTFLoader().load(modelUrl(f),res,undefined,rej));
  const tex=def.tex?new Promise(res=>{ try{ new THREE.TextureLoader().load('models/'+def.tex,t=>{ t.flipY=false; res(t); },undefined,()=>res(null)); }catch(e){ res(null); } }):Promise.resolve(null);
  assetWait[key]=Promise.all([raw(def.mesh),tex,...Object.entries(def.anims||{}).map(([k,f])=>raw(f).then(g=>[k,g]).catch(()=>null))]).then(([g,t,...an])=>{
    g.scene.traverse(o=>{ if(o.isMesh){ o.material=(typeof Q==='function'&&Q().lambert)?new THREE.MeshLambertMaterial({map:t||null,color:t?0xffffff:0x9a8a7a,skinning:!!o.isSkinnedMesh}):new THREE.MeshStandardMaterial({map:t||null,color:t?0xffffff:0x9a8a7a,roughness:0.9,metalness:0,skinning:!!o.isSkinnedMesh}); } });
    const clips=[];
    for(const x of an){ if(!x) continue; const [k,ga]=x; for(const c of ga.animations){ const cl=c.clone(); cl.name=k; cl.tracks=cl.tracks.filter(tr=>g.scene.getObjectByName(tr.name.split('.')[0])); if(cl.tracks.length) clips.push(cl); break; } }
    g.animations=clips; g.scene.updateMatrixWorld(true);
    g.userData={box:new THREE.Box3().setFromObject(g.scene)};
    assetCache[key]=g; return g;
  });
  return assetWait[key];
}
const mixers=new Set();
function loadAsset(file){
  if(assetCache[file]) return Promise.resolve(assetCache[file]);
  if(assetWait[file]) return assetWait[file];
  if(!THREE.GLTFLoader) return Promise.reject(new Error('no loader'));
  assetWait[file]=new Promise((res,rej)=>{
    try{ new THREE.GLTFLoader().load(modelUrl(file),g=>{
      g.scene.updateMatrixWorld(true);
      g.userData={box:new THREE.Box3().setFromObject(g.scene)};
      assetCache[file]=g; res(g);
    },undefined,e=>{ delete assetWait[file]; rej(e); }); }catch(e){ rej(e); }
  });
  return assetWait[file];
}
function tintObject(obj,tint){
  const c=new THREE.Color(hex(tint));
  obj.traverse(o=>{ if(!o.isMesh) return; const ms=Array.isArray(o.material)?o.material:[o.material];
    const nm=ms.map(m=>{ const k=m.clone(); if(k.color) k.color.lerp(c,0.65); return k; }); o.material=Array.isArray(o.material)?nm:nm[0]; });
}
/* 依高度（或長度）縮放，底部貼地、置中 */
function instAsset(g,opt){
  const animated=g.animations&&g.animations.length&&THREE.SkeletonUtils;
  const obj=animated?THREE.SkeletonUtils.clone(g.scene):g.scene.clone(true);
  const b=g.userData.box, sz=b.getSize(new THREE.Vector3());
  const s=opt.length?opt.length/Math.max(sz.z,sz.x,0.001):opt.scale?opt.scale:(opt.height||1)/Math.max(sz.y,0.001);
  obj.scale.setScalar(s);
  obj.position.set(-(b.min.x+b.max.x)/2*s,-b.min.y*s,-(b.min.z+b.max.z)/2*s);
  if(opt.tint) tintObject(obj,opt.tint);
  obj.traverse(o=>{ if(o.isMesh) o.frustumCulled=false; });
  const out={obj,mixer:null,actions:{},cur:null};
  if(animated){ out.mixer=new THREE.AnimationMixer(obj); for(const a of g.animations) out.actions[a.name.replace(/.*\|/,'')]=out.mixer.clipAction(a); mixers.add(out.mixer); }
  return out;
}
/* 把程序模型換成外部模型（載入完成才換，失敗就維持程序模型） */
function swapInAsset(group,file,opt,anims){
  (typeof file==='function'?file():loadAsset(file)).then(g=>{
    if(group.userData.disposed) return;
    for(const c of [...group.children]) group.remove(c);
    const inst=instAsset(g,opt); group.add(inst.obj);
    group.userData.asset=inst; group.userData.animMap=anims||{};
    setAnim(group,group.userData.wantAnim||'idle');
  }).catch(()=>{});
}
function setAnim(group,kind){
  group.userData.wantAnim=kind;
  const inst=group.userData.asset; if(!inst||!inst.mixer) return;
  const name=(group.userData.animMap||{})[kind]||(group.userData.animMap||{}).idle; const act=name&&inst.actions[name];
  if(!act||inst.cur===act) return;
  act.reset().play(); if(inst.cur) act.crossFadeFrom(inst.cur,0.25,false); inst.cur=act;
}
function freezeAnim(group,frozen){ const inst=group.userData.asset; if(inst&&inst.mixer) inst.mixer.timeScale=frozen?0:1; group.userData.frozen=frozen; }
const isAnimated=group=>!!(group.userData.asset&&group.userData.asset.mixer);
function updateMixers(dt){
  for(const m of mixers){
    let o=m.getRoot(); while(o.parent) o=o.parent;
    if(!o.isScene){ mixers.delete(m); continue; }
    m.update(dt);
  }
}
function speciesAsset(sp){

   員工在 data/staff.json，成就在 data/achievements.json，數值在 config.ops
   ========================================================= */
const OPS=()=>DATA.config.ops;
const opsStats={coverage:1,satisfaction:60,rating:1,score:0,parts:{},unpaid:false,theft:false,needs:{},salary:0,income:{ticket:0,spend:0}};
const staffCount=id=>((save.zoo&&save.zoo.staff)||{})[id]||0;
const totalStaff=()=>Object.values(save.zoo.staff||{}).reduce((a,b)=>a+b,0);
const isWorking=b=>(b.cond??100)>=OPS().brokenBelow;
function ensureOps(){
  const z=save.zoo; if(!z) return;
  z.staff=z.staff||{...OPS().startStaff};
  z.ticket=z.ticket??OPS().ticketDefault;
  z.clean=z.clean??100; z.births=z.births||0; z.ach=z.ach||{};
